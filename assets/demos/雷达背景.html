<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷达背景</title>
<style>
:root{--bg:#02110a;--sweep:#27e08a;--grid:#0c6b3f;--blip:#9dffd0;--speed:1;--size:1;}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
// canvas 雷达：同心网格 + 旋转扫描扇 + 随机光点淡出；size 控制半径、speed 控制转速
const state={bg:"#02110a",sweep:"#27e08a",grid:"#0c6b3f",blip:"#9dffd0",speed:1,size:1};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let ang=0,blips=[];
function resize(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',resize);resize();
function spawn(){ if(Math.random()<.04){blips.push({a:Math.random()*Math.PI*2,R:Math.random(),life:1});} }
function apply(){
  document.documentElement.style.setProperty('--bg',state.bg);
  document.documentElement.style.setProperty('--sweep',state.sweep);
  document.documentElement.style.setProperty('--grid',state.grid);
  document.documentElement.style.setProperty('--blip',state.blip);
  document.documentElement.style.setProperty('--speed',state.speed);
  document.documentElement.style.setProperty('--size',state.size);
}
function frame(){
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=Math.min(W,H)*.42*state.size;
  ctx.fillStyle=state.bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=state.grid;ctx.lineWidth=1;
  for(let i=1;i<=4;i++){ctx.beginPath();ctx.arc(cx,cy,R*i/4,0,Math.PI*2);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
  ctx.globalAlpha=.18;ctx.fillStyle=state.sweep;
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,0,Math.PI/5);ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;ctx.strokeStyle=state.sweep;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(R,0);ctx.stroke();
  ctx.restore();
  spawn();
  for(const b of blips){b.life-=.012;
    const x=cx+Math.cos(b.a)*R*b.R, y=cy+Math.sin(b.a)*R*b.R;
    ctx.fillStyle=state.blip;ctx.globalAlpha=Math.max(0,b.life);
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;blips=blips.filter(b=>b.life>0);
  ang+=.012*state.speed;
  requestAnimationFrame(frame);
}
apply();frame();
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
