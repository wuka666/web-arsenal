<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大型菜单演示</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; font-family:system-ui,"Microsoft YaHei",sans-serif; background:#f5f6f8; }
  .nav { display:flex; gap:6px; padding:14px 22px; background:#fff; border-bottom:1px solid var(--border,#e5e7eb); }
  .nav a { padding:8px 14px; font-size:15px; color:var(--text,#1f2937); cursor:pointer; border-radius:8px; user-select:none; }
  .nav a:hover { background:var(--hover,#f3f4f6); }
  .nav a.mega { font-weight:700; }
  .mega-wrap { position:relative; }
  .panel {
    position:absolute; top:calc(100% + 10px); left:0; display:flex; gap:22px; background:var(--pb,#fff);
    border:1px solid var(--border,#e5e7eb); border-radius:var(--radius,12px); box-shadow:0 16px 40px rgba(0,0,0,.12);
    padding:18px 22px; opacity:0; transform:translateY(-8px); pointer-events:none; transition:opacity var(--dur,.22s) ease, transform var(--dur,.22s) ease; z-index:20;
  }
  .mega-wrap.open .panel { opacity:1; transform:translateY(0); pointer-events:auto; }
  .col { min-width:170px; }
  .col .ct { font-size:13px; font-weight:800; color:var(--tc,#111827); letter-spacing:.03em; margin-bottom:8px; }
  .item { display:flex; gap:11px; padding:9px 10px; border-radius:9px; cursor:pointer; }
  .item:hover { background:var(--hover,#f3f4f6); }
  .ic { width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:9px;
        background:color-mix(in srgb, var(--ic,#2563eb) 14%, #fff); color:var(--ic,#2563eb); font-size:17px; }
  .item .nm { font-size:15px; font-weight:600; color:var(--text,#1f2937); }
  .item .ds { font-size:12px; color:var(--dc,#6b7280); margin-top:2px; }
  .hint { position:fixed; bottom:14px; left:0; right:0; text-align:center; font-size:13px; color:#999; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px); opacity:0; background:#111827; color:#fff; padding:10px 18px; border-radius:10px; font-size:14px; transition:.2s; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <nav class="nav">
    <a>首页</a>
    <div class="mega-wrap" id="mw">
      <a class="mega" id="mega">产品 ▾</a>
      <div class="panel" id="panel"></div>
    </div>
    <a>定价</a>
    <a>文档</a>
  </nav>
  <p class="hint">悬停「产品」展开含图标与说明的多分类面板</p>
  <div class="toast" id="toast"></div>
<script>
  const MENU = [
    { title:"设计工具", items:[
      { ic:"✎", nm:"Figma", ds:"协作式界面设计" },
      { ic:"◑", nm:"Sketch", ds:"矢量界面设计" }
    ]},
    { title:"开发", items:[
      { ic:"</>", nm:"VS Code", ds:"轻量代码编辑器" },
      { ic:"⚡", nm:"WebStorm", ds:"智能 IDE" }
    ]},
    { title:"协作", items:[
      { ic:"◎", nm:"Slack", ds:"团队沟通" },
      { ic:"▤", nm:"Notion", ds:"文档与知识库" }
    ]},
    { title:"分析", items:[
      { ic:"▦", nm:"Amplitude", ds:"产品行为分析" },
      { ic:"◔", nm:"Mixpanel", ds:"漏斗与留存" }
    ]}
  ];
  const state = {
    theme:"#2563eb", panelBg:"#ffffff", text:"#1f2937", titleColor:"#111827", radius:12, fontSize:15, dur:0.22,
    iconColor:"#2563eb", hoverBg:"#f3f4f6", border:"#e5e7eb", cols:3, descColor:"#6b7280"
  };
  const mw=document.getElementById("mw"), mega=document.getElementById("mega"), panel=document.getElementById("panel"), toast=document.getElementById("toast");
  let t=null;
  function showToast(m){ toast.textContent="打开："+m; toast.classList.add("show"); clearTimeout(t); t=setTimeout(()=>toast.classList.remove("show"),1400); }
  function render(){
    const n=Math.max(2,Math.min(4,state.cols));
    panel.innerHTML = MENU.slice(0,n).map(c=>'<div class="col"><div class="ct">'+c.title+'</div>'+
      c.items.map(i=>'<div class="item" data-nm="'+i.nm+'"><div class="ic">'+i.ic+'</div><div><div class="nm">'+i.nm+'</div><div class="ds">'+i.ds+'</div></div></div>').join("")+'</div>').join("");
    [...panel.querySelectorAll(".item")].forEach(it=> it.onclick=()=> showToast(it.dataset.nm));
  }
  mega.onmouseenter=()=>{ mw.classList.add("open"); };
  mw.onmouseleave=()=>{ mw.classList.remove("open"); };
  document.addEventListener("click",e=>{ if(!mw.contains(e.target)) mw.classList.remove("open"); });
  function apply(){
    const R=document.documentElement.style;
    R.setProperty("--theme",state.theme); R.setProperty("--pb",state.panelBg); R.setProperty("--text",state.text);
    R.setProperty("--tc",state.titleColor); R.setProperty("--radius",state.radius+"px"); R.setProperty("--fs",state.fontSize+"px");
    R.setProperty("--dur",state.dur+"s"); R.setProperty("--ic",state.iconColor); R.setProperty("--hover",state.hoverBg);
    R.setProperty("--border",state.border); R.setProperty("--dc",state.descColor);
    render();
  }
  window.addEventListener("message",e=>{ const d=e.data; if(!d||d.type!=="param")return; state[d.key]=d.value; apply(); });
  apply();
</script>
</body>
</html>
