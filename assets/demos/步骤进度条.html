<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>步骤条</title>
<style>
:root{--c1:#007aff;--c2:#ffffff;--c3:#1f2937;--bg:#f2f2f7;--bd:#e5e7eb;--rad:999px;--gap:8px;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:min(94vw,420px);background:var(--c2);border-radius:16px;padding:26px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.steps{display:flex;align-items:flex-start;gap:var(--gap)}
.step{flex:1;text-align:center;cursor:pointer}
.step .dot{width:30px;height:30px;margin:0 auto 8px;border-radius:var(--rad);background:var(--bd);color:var(--c3);display:grid;place-items:center;font-weight:700;transition:.3s}
.step.done .dot,.step.cur .dot{background:var(--c1);color:var(--c2)}
.step .t{font-size:12px;opacity:.7}
.step.cur .t{opacity:1;font-weight:700}
.line{height:3px;background:var(--bd);border-radius:2px;margin:14px 0 18px;position:relative;overflow:hidden}
.line i{position:absolute;left:0;top:0;bottom:0;background:var(--c1);transition:width .3s;display:block}
</style></head><body>
<div class="box"><div class="steps" id="steps"></div><div class="line"><i id="line"></i></div><div style="text-align:center;color:var(--c1);font-weight:700;cursor:pointer;user-select:none" id="next">下一步 ›</div></div>
<script>
const state={c1:"#007aff",c2:"#ffffff",c3:"#1f2937",bg:"#f2f2f7",bd:"#e5e7eb",rad:999,pd:8,gap:8};
const r=document.documentElement.style;
const NAMES=['填写','确认','支付','完成'];let cur=0;
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--bd',state.bd);r.setProperty('--rad',state.rad+'px');r.setProperty('--gap',state.gap+'px');}
function render(){const s=document.getElementById('steps');s.innerHTML='';NAMES.forEach((t,i)=>{const d=document.createElement('div');d.className='step'+(i<cur?' done':'')+(i===cur?' cur':'');d.innerHTML='<div class="dot">'+(i<cur?'✓':i+1)+'</div><div class="t">'+t+'</div>';d.addEventListener('click',()=>{cur=i;render();});s.appendChild(d);});document.getElementById('line').style.width=(cur/(NAMES.length-1)*100)+'%';}
apply();render();
document.getElementById('next').addEventListener('click',()=>{cur=Math.min(NAMES.length-1,cur+1);render();});
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
