<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>操作指引标注演示</title><style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.btn{background:var(--bc,#1a1a1a);color:#fff;border:none;border-radius:10px;padding:14px 26px;font-size:14px;cursor:pointer;position:relative}
.coach{position:absolute;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;width:200px;font-size:13px;color:#222;box-shadow:0 8px 24px rgba(0,0,0,.16);opacity:0;transition:.3s;z-index:5;pointer-events:auto}
.coach.on{opacity:1}
.arrow{position:absolute;width:10px;height:10px;background:#fff;border-left:1px solid #e5e7eb;border-top:1px solid #e5e7eb;transform:rotate(45deg);z-index:6}
.coach button{margin-top:8px;background:var(--ac,#2f6bff);color:#fff;border:none;border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer}
</style></head><body>
<button class="btn" id="btn">导出报表</button>
<div class="coach" id="coach"><span id="ct">点这里可导出本页数据</span><div class="arrow" id="ar"></div><button id="ok">明白了</button></div>
<script>
const btn=document.getElementById('btn'),coach=document.getElementById('coach'),ar=document.getElementById('ar'),ok=document.getElementById('ok'),ct=document.getElementById('ct');
const state={bc:'#1a1a1a',ac:'#2f6bff',pos:'top',text:'点这里可导出本页数据',radius:10};
function applyStyle(){document.documentElement.style.setProperty('--bc',state.bc);document.documentElement.style.setProperty('--ac',state.ac);coach.style.borderRadius=state.radius+'px';ct.textContent=state.text;place();}
function place(){const b=btn.getBoundingClientRect();let cl,ctop,al,at;
 if(state.pos==='top'){cl=b.left+(b.width-200)/2;ctop=b.top-90;al=98;at=6;}
 else if(state.pos==='bottom'){cl=b.left+(b.width-200)/2;ctop=b.top+b.height+14;al=98;at=-6;}
 else if(state.pos==='left'){cl=b.left-214;ctop=b.top-10;al=200;at=16;}
 else{cl=b.left+b.width+14;ctop=b.top-10;al=0;at=16;}
 coach.style.left=cl+'px';coach.style.top=ctop+'px';ar.style.left=al+'px';ar.style.top=at+'px';ar.style.borderLeft=state.pos==='right'?'none':'1px solid #e5e7eb';ar.style.borderTop=state.pos==='bottom'?'none':'1px solid #e5e7eb';ar.style.borderRight=state.pos==='right'?'1px solid #e5e7eb':'none';ar.style.borderBottom=state.pos==='bottom'?'1px solid #e5e7eb':'none';}
ok.onclick=()=>coach.classList.remove('on');
applyStyle();coach.classList.add('on');
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;state[d.key]=d.value;if(['bc','ac','pos','text','radius'].includes(d.key))applyStyle();});
</script></body></html>
