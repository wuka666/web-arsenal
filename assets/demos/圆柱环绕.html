<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圆柱环绕</title>
<style>
:root{--bg:#f5f5f4;--card:#ffffff;--ink:#1c1917;--accent:#0ea5e9;--radius:10px;--cardW:110px;--count:8;--speed:0.25}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.scene{width:min(94vw,520px);height:280px;perspective:900px;display:flex;align-items:center;justify-content:center}
.ring{position:relative;width:calc(var(--cardW) * 1px);height:150px;transform-style:preserve-3d;transform:rotateY(var(--R,0deg))}
.it{position:absolute;inset:0;background:var(--card);border:2px solid var(--accent);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);font-size:13px;backface-visibility:hidden}
</style>
</head>
<body>
<div class="scene"><div class="ring" id="ring"></div></div>
<script>
var state={bg:"#f5f5f4",card:"#ffffff",ink:"#1c1917",accent:"#0ea5e9",radius:10,cardW:110,count:8,speed:0.25};
var r=document.documentElement.style;
function apply(){r.setProperty('--bg',state.bg);r.setProperty('--card',state.card);r.setProperty('--ink',state.ink);r.setProperty('--accent',state.accent);r.setProperty('--radius',state.radius+'px');r.setProperty('--cardW',state.cardW+'px');r.setProperty('--count',state.count);r.setProperty('--speed',state.speed);}
apply();
var ring=document.getElementById("ring");
function build(){ring.innerHTML="";var n=Math.round(state.count),R=Math.round((parseFloat(state.cardW)/2)/Math.tan(Math.PI/n));
for(var i=0;i<n;i++){var d=document.createElement("div");d.className="it";d.textContent="#"+(i+1);d.style.transform="rotateY("+(360/n*i)+"deg) translateZ("+R+"px)";ring.appendChild(d);}}
build();
var r=0;
window.__spin=function(dr){r+=dr;ring.style.setProperty("--R",r+"deg");};
setInterval(function(){window.__spin(parseFloat(state.speed)*2);},40);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
