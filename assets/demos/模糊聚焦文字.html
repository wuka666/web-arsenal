<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模糊聚焦文字</title>
<style>
:root{--c:#e8f0ff;--bg:#0a0e16;--fs:110;--blur:14;--dur:3;--hold:0.6}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
.txt{font-weight:800;font-size:calc(var(--fs)*1px);color:var(--c);
  filter:blur(calc(var(--blur)*1px));animation:focus calc(var(--dur)*1s) ease-in-out infinite calc(var(--hold)*1s)}
@keyframes focus{0%,100%{filter:blur(calc(var(--blur)*1px))}45%,65%{filter:blur(0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="txt" id="t">FOCUS</div>
<script>
const state={"text":"FOCUS","c":"#e8f0ff","bg":"#0a0e16","fs":110,"blur":14,"dur":3,"hold":0.6};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }
document.getElementById('t').textContent=state.text;
}

apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
