<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡片删除</title>
<style>
:root{--c1:#007aff;--c2:#ffffff;--c3:#1f2937;--bg:#f2f2f7;--bd:#e5e7eb;--rad:12px;--pad:14px;--gap:10px;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.list{display:flex;flex-direction:column;gap:var(--gap);width:min(92vw,340px)}
.card{background:var(--c2);border:1px solid var(--bd);border-radius:var(--rad);padding:var(--pad);display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden;transition:opacity .28s,transform .28s,height .28s,padding .28s,margin .28s}
.card.out{opacity:0;transform:translateX(40px);height:0;padding-top:0;padding-bottom:0;margin:0}
.card .d{width:34px;height:34px;border-radius:9px;background:var(--c1);opacity:.85;flex:0 0 auto}
.card .x{margin-left:auto;width:28px;height:28px;border:0;border-radius:8px;background:var(--bg);color:var(--c3);cursor:pointer;font-size:16px}
</style></head><body>
<div class="list" id="list"></div>
<script>
const state={c1:"#007aff",c2:"#ffffff",c3:"#1f2937",bg:"#f2f2f7",bd:"#e5e7eb",rad:12,pad:14,gap:10};
const r=document.documentElement.style;
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--bd',state.bd);r.setProperty('--rad',state.rad+'px');r.setProperty('--pad',state.pad+'px');r.setProperty('--gap',state.gap+'px');}
let items=['待办：整理素材库','待办：写周报','待办：回复邮件','待办：健身打卡'];
function render(){const l=document.getElementById('list');l.innerHTML='';items.forEach((t,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<span class="d"></span>'+t+'<button class="x">×</button>';d.querySelector('.x').addEventListener('click',()=>{d.classList.add('out');d.addEventListener('transitionend',()=>{items.splice(i,1);render();},{once:true});});l.appendChild(d);});}
apply();render();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
