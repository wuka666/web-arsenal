<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>活动热力矩阵</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  .wrap{
    width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--di);padding:20px;
    font:500 13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--wenzi);
  }
  .card{
    position:relative;width:100%;max-width:430px;background:var(--ka);
    border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:18px 16px 16px;
  }
  .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .hd b{font-size:14px;font-weight:600}
  .hd span{font-size:11px;font-weight:400;opacity:.5}
  /* 4 列 × 7 行 = 28 格。gap 变宽就是「邻格让位」：不用逐个改 transform，一行 CSS 全让开 */
  .grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gejian);
    transition:gap .3s cubic-bezier(.34,1.56,.64,1);
  }
  .grid.push{gap:calc(var(--gejian) + 6px)}
  /* 显隐走 transform/opacity（合成层，不重排）；--dl 是每格自己的波纹延迟 */
  .cell{
    position:relative;padding-top:100%;border:0;padding-right:0;padding-bottom:0;padding-left:0;
    border-radius:var(--yuanjiao);background:var(--ge);cursor:pointer;
    touch-action:manipulation;overflow:hidden;
    opacity:0;transform:scale(.7);
    transition:opacity .34s ease var(--dl,0s),
               transform .32s cubic-bezier(.34,1.56,.64,1),
               box-shadow .3s ease;
  }
  .cell.on{opacity:1;transform:scale(1)}
  /* 内层负责「深浅」：按活跃等级给透明度，0 级不亮 */
  .cell i{
    position:absolute;inset:0;border-radius:inherit;background:var(--liang);
    opacity:0;transition:opacity .34s ease var(--dl,0s);
  }
  .cell.on i{opacity:var(--lv,0)}
  .cell.focus{transform:scale(1.2);z-index:3;box-shadow:0 10px 24px rgba(0,0,0,.45)}
  .cell:focus-visible{outline:2px solid var(--liang);outline-offset:2px}
  /* 详情卡：贴在卡片容器里，左手坐标系跟着被点的格子走 */
  .pop{
    position:absolute;left:0;top:0;z-index:6;pointer-events:none;white-space:nowrap;
    background:var(--kapian);border:1px solid rgba(255,255,255,.12);border-radius:10px;
    padding:8px 11px;box-shadow:0 14px 30px rgba(0,0,0,.5);
    opacity:0;transform:translate(-50%,calc(-100% - 8px)) scale(.9);transform-origin:50% 100%;
    transition:opacity .2s ease,transform .26s cubic-bezier(.34,1.56,.64,1);
  }
  .pop.on{opacity:1;transform:translate(-50%,calc(-100% - 8px)) scale(1)}
  /* 靠上时翻到格子下方：单独一类，别再写内联 transform——内联会盖掉 .on 的动画终点 */
  .pop.below{transform-origin:50% 0;transform:translate(-50%,8px) scale(.9)}
  .pop.below.on{transform:translate(-50%,8px) scale(1)}
  .pop i{display:block;font-style:normal;font-size:10px;opacity:.55;letter-spacing:.02em}
  .pop b{display:block;margin-top:2px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .pop b em{font-style:normal;font-size:10px;font-weight:400;opacity:.55;margin-left:4px}
  .axis{display:flex;justify-content:space-between;margin-top:12px;font-size:10px;opacity:.42}
  .foot{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:10px;opacity:.45}
  .foot u{width:9px;height:9px;border-radius:3px;background:var(--ge);display:inline-block;text-decoration:none}
  .foot u.hi{background:var(--liang)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hd"><b>活跃度</b><span>近 4 周 · 点格子看当天</span></div>
    <div class="grid" id="grid"></div>
    <div class="axis"><span>4 周前</span><span>本周</span></div>
    <div class="foot"><u></u>低<u class="hi"></u>高</div>
  </div>
</div>
<script>
// 参数：apply() 按 UNIT 拼单位，CSS 里直接 var(--x)
var state = {di:"#0b1220",ka:"#121c2e",ge:"#1e2c44",liang:"#38bdf8",kapian:"#1b2740",
             wenzi:"#e6edf7",yuanjiao:8,gejian:8,bodong:140};
var UNIT = {yuanjiao:"px",gejian:"px",bodong:"ms"};
var root = document.documentElement;
function apply(){ for(var k in state){ root.style.setProperty("--"+k, state[k] + (UNIT[k]||"")); } }

var COLS = 4, ROWS = 7, N = COLS * ROWS;
var grid = document.getElementById("grid");
var card = grid.parentNode;

// 28 格活跃度（列 = 周，行 = 星期），固定数据不随机，截图稳定
var VAL = [3,1,0,2, 5,2,1,0, 2,4,3,1, 0,1,6,4, 3,3,2,5, 1,0,2,3, 4,2,1,2];
var DAY = [];
for(var d = 0; d < N; d++){
  DAY.push("第 " + (Math.floor(d / ROWS) + 1) + " 周 · 周" + ["一","二","三","四","五","六","日"][d % ROWS]);
}

var cells = [], timers = [], cur = -1, autoOn = true;

function later(fn, ms){
  var id = setTimeout(function(){
    timers = timers.filter(function(t){ return t !== id; });
    fn();
  }, ms);
  timers.push(id);
  return id;
}

// 建格子：delay 由「到矩阵中心的距离」决定 —— 中心先亮，波纹一圈圈往外推
var CX = (COLS - 1) / 2, CY = (ROWS - 1) / 2;
var MAXD = Math.sqrt(CX * CX + CY * CY);
for(var i = 0; i < N; i++){
  var b = document.createElement("button");
  b.className = "cell";
  b.type = "button";
  b.setAttribute("aria-label", DAY[i] + "，活跃度 " + VAL[i] + " 级");
  var c = i % COLS, r = Math.floor(i / COLS);
  var dist = Math.sqrt(Math.pow(c - CX, 2) + Math.pow(r - CY, 2));
  // 波纹延迟：距离归一到 0~1，乘 --bodong。写成 var() 才能被参数滑杆实时改
  b.style.setProperty("--dl", "calc(" + (dist / MAXD).toFixed(3) + " * var(--bodong))");
  b.style.setProperty("--lv", (VAL[i] ? (0.3 + Math.min(6, VAL[i]) / 6 * 0.7).toFixed(2) : 0));
  var inner = document.createElement("i");
  b.appendChild(inner);
  (function(idx, node){
    node.addEventListener("click", function(){ userOpen(idx); });
  })(i, b);
  grid.appendChild(b);
  cells.push(b);
}

function clearPop(){
  var el = card.querySelector(".pop");
  if(el && el.parentNode) el.parentNode.removeChild(el);
}

// 波纹：先把 28 格全部归零（各自 delay 不同，反向也成波纹），下一帧统一点亮
function ripple(){
  var el = card.querySelector(".pop");
  if(el) el.classList.remove("on");
  if(cur >= 0) cells[cur].classList.remove("focus");
  cur = -1;
  grid.classList.remove("push");
  cells.forEach(function(c){ c.classList.remove("on"); });

  later(function(){
    cells.forEach(function(c){ c.classList.add("on"); });
  }, 60);

  // 扫完 → 停 1.1s → 自动点中间一格展示详情卡
  var span = Math.max(0, Number(state.bodong) || 0) + 660;
  later(function(){ if(autoOn) open(14); }, span + 1100);
}

// 打开详情：本格放大 + gap 加宽（四周让位）+ 弹卡片
function open(i){
  if(cur >= 0) cells[cur].classList.remove("focus");
  cur = i;
  grid.classList.add("push");
  cells[i].classList.add("focus");
  clearPop();

  var box = cells[i].getBoundingClientRect();
  var cb = card.getBoundingClientRect();
  var el = document.createElement("div");
  el.className = "pop";
  el.innerHTML = "<i>" + DAY[i] + "</i><b>" + (VAL[i] * 7 + 3) + "<em>次活跃</em></b>";
  // 卡片默认放在格子上方，居中；靠上时改放下方，避免被卡片边界裁掉
  var below = (box.top - cb.top) < 62;
  el.style.left = (box.left - cb.left + box.width / 2) + "px";
  el.style.top = (below ? box.top - cb.top + box.height + 8 : box.top - cb.top) + "px";
  if(below) el.classList.add("below");
  card.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add("on"); });

  // 停 1.6s 复原
  later(close, 1600);
}

function close(){
  if(cur >= 0) cells[cur].classList.remove("focus");
  cur = -1;
  grid.classList.remove("push");
  var el = card.querySelector(".pop");
  if(el) el.classList.remove("on");
  later(function(){
    clearPop();
    if(autoOn) ripple();
  }, 280);
}

// 用户自己点：停掉自动循环，只留手动
function userOpen(i){
  autoOn = false;
  timers.forEach(clearTimeout);
  timers = [];
  open(i);
}

function clearAll(){
  timers.forEach(clearTimeout);
  timers = [];
}

addEventListener("pagehide", clearAll);
addEventListener("beforeunload", clearAll);

apply();
later(ripple, 240);

window.addEventListener("message", function(e){
  var d = e.data;
  if(!d || d.type !== "param") return;
  if(!(d.key in state)) return;
  state[d.key] = d.value;
  apply();
});
</script>
</body>
</html>
