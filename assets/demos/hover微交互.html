<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>悬停反馈演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
    background: var(--page-bg, #fff); font-family: system-ui, "Microsoft YaHei", sans-serif;
    padding: 0 20px;
  }

  .pills { display: flex; gap: 6px; background: var(--pill-bg, #f2f0eb); padding: 6px; border-radius: 999px; }
  .pills a {
    text-decoration: none; color: #555; font-size: 14px; padding: 9px 20px;
    border-radius: 999px; cursor: pointer;
    transition: background var(--dur, .15s) ease, color var(--dur, .15s) ease;
  }
  .pills a:hover { background: var(--pill-hover, #d9d5cc); color: var(--accent, #1a1a1a); }

  .cta {
    font-size: 15px; font-weight: 700; padding: 14px 38px; border-radius: 12px;
    border: none; cursor: pointer; background: var(--accent, #1a1a1a); color: #fff;
    transition: transform var(--dur, .15s) ease, box-shadow var(--dur, .15s) ease;
  }
  .cta:hover {
    transform: translateY(calc(-1 * var(--lift, 2px))) scale(var(--scale, 1));
    box-shadow: 0 8px 20px color-mix(in srgb, var(--accent, #1a1a1a) var(--shadow, 18%), transparent);
  }

</style>
</head>
<body>

  <nav class="pills"><a>首页</a><a>题库</a><a>统计</a><a>设置</a></nav>
  <button class="cta">开始刷题</button>

  <script>

    const state = {
      dur: 0.15, lift: 2, scale: 1, shadow: 18,
      accent: "#1a1a1a", pillBg: "#f2f0eb", pillHover: "#d9d5cc", bg: "#ffffff"
    };

    function apply() {
      const s = document.documentElement.style;
      s.setProperty("--dur", state.dur + "s");
      s.setProperty("--lift", state.lift + "px");
      s.setProperty("--scale", state.scale);
      s.setProperty("--shadow", state.shadow + "%");
      s.setProperty("--accent", state.accent);
      s.setProperty("--pill-bg", state.pillBg);
      s.setProperty("--pill-hover", state.pillHover);
      s.setProperty("--page-bg", state.bg);
    }

    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || d.type !== "param") return;
      state[d.key] = d.value;
      apply();
    });
    apply();
  </script>
</body>
</html>
