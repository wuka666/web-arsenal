<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拖拽排序</title>
<style>
:root{--c1:#007aff;--c2:#ffffff;--c3:#1f2937;--bg:#f2f2f7;--bd:#e5e7eb;--rad:12px;--pad:14px;--gap:10px;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.list{display:flex;flex-direction:column;gap:var(--gap);width:min(92vw,340px)}
.it{background:var(--c2);border:1px solid var(--bd);border-radius:var(--rad);padding:var(--pad);display:flex;align-items:center;gap:12px;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.05);user-select:none}
.it.drag{opacity:.4}
.it .h{width:22px;height:22px;border-radius:6px;background:var(--c1);opacity:.8;flex:0 0 auto}
</style></head><body>
<div class="list" id="list"></div>
<script>
const state={c1:"#007aff",c2:"#ffffff",c3:"#1f2937",bg:"#f2f2f7",bd:"#e5e7eb",rad:12,pad:14,gap:10};
const r=document.documentElement.style;
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--bd',state.bd);r.setProperty('--rad',state.rad+'px');r.setProperty('--pad',state.pad+'px');r.setProperty('--gap',state.gap+'px');}
let items=['需求设计','前端开发','联调测试','灰度发布','复盘沉淀'];let dragIdx=-1;
function render(){const l=document.getElementById('list');l.innerHTML='';items.forEach((t,i)=>{const d=document.createElement('div');d.className='it';d.draggable=true;d.innerHTML='<span class="h"></span>'+t;d.addEventListener('dragstart',()=>{dragIdx=i;d.classList.add('drag');});d.addEventListener('dragend',()=>d.classList.remove('drag'));d.addEventListener('dragover',e=>e.preventDefault());d.addEventListener('drop',e=>{e.preventDefault();if(dragIdx>=0&&dragIdx!==i){const m=items.splice(dragIdx,1)[0];items.splice(i,0,m);dragIdx=-1;render();}});l.appendChild(d);});}
apply();render();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
