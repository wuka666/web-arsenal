<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中心聚焦</title>
<style>
:root{--bg:#f2f2f7;--card:#ffffff;--ink:#1c1c1e;--accent:#007aff;--radius:16px;--cardH:120px;--maxS:1.12;--gap:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.vp{width:min(92vw,320px);height:340px;overflow-y:auto;background:#e5e5ea;border-radius:var(--radius);padding:10px;scroll-behavior:auto}
.c{height:calc(var(--cardH) * 1px);margin-bottom:calc(var(--gap) * 1px);background:var(--card);border-radius:var(--radius);display:flex;align-items:center;padding:0 16px;font-weight:700;color:var(--ink);transform:scale(var(--S,1));transform-origin:center;transition:transform .25s ease;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.c.near{border:2px solid var(--accent)}
</style>
</head>
<body>
<div class="vp" id="vp"></div>
<script>
var state={bg:"#f2f2f7",card:"#ffffff",ink:"#1c1c1e",accent:"#007aff",radius:16,cardH:120,maxS:1.12,gap:14};
var r=document.documentElement.style;
function apply(){r.setProperty('--bg',state.bg);r.setProperty('--card',state.card);r.setProperty('--ink',state.ink);r.setProperty('--accent',state.accent);r.setProperty('--radius',state.radius+'px');r.setProperty('--cardH',state.cardH+'px');r.setProperty('--maxS',state.maxS);r.setProperty('--gap',state.gap+'px');}
apply();
var vp=document.getElementById("vp");
for(var i=1;i<=8;i++){var d=document.createElement("div");d.className="c";d.textContent="内容 "+i;vp.appendChild(d);}
function upd(){var mid=vp.getBoundingClientRect().top+vp.clientHeight/2;
Array.prototype.forEach.call(vp.children,function(el){var b=el.getBoundingClientRect();var c=b.top+b.height/2;var dist=Math.abs(c-mid);var k=Math.max(0,1-dist/(vp.clientHeight/2));
var s=1+(parseFloat(state.maxS)-1)*k;el.style.setProperty("--S",s.toFixed(3));el.classList.toggle("near",k>0.6);});}
vp.addEventListener("scroll",upd);
window.__autoScroll=function(){vp.scrollTop+=1;if(vp.scrollTop>vp.scrollHeight-vp.clientHeight-2)vp.scrollTop=0;upd();};
setInterval(window.__autoScroll,60);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
