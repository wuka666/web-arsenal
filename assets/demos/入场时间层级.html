<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入场时间层级演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: var(--di); color: var(--zi); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .stage { width: min(560px, 92vw); }
  .seq { opacity: 0; transform: translateY(var(--weiyi)); }
  .seq.run { animation: rise var(--shichang) var(--ease) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .tag { display: inline-block; font-size: 12px; letter-spacing: .08em; color: var(--zhucai); border: 1px solid var(--zhucai); border-radius: 999px; padding: 3px 10px; }
  h1 { margin-top: 14px; font-size: 34px; line-height: 1.2; letter-spacing: -.5px; }
  .sub { margin-top: 10px; font-size: 15px; color: var(--cizi); }
  .row { margin-top: 20px; display: flex; gap: 12px; }
  .btn { border: none; border-radius: 8px; padding: 11px 22px; font-size: 14px; font-weight: 700; cursor: pointer; background: var(--zhucai); color: #fff; }
  .btn.ghost { background: transparent; color: var(--zi); border: 1px solid color-mix(in srgb, var(--zi) 20%, transparent); }
  .cards { margin-top: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card { background: var(--kase); border: 1px solid color-mix(in srgb, var(--zi) 8%, transparent); border-radius: 12px; padding: 14px; }
  .card b { display: block; font-size: 13.5px; }
  .card span { display: block; margin-top: 5px; font-size: 12px; color: var(--cizi); }
  .order { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--cizi); }
</style>
</head>
<body>
<div class="stage">
  <div class="tag seq">第 1 层 · 先看身份</div>
  <h1 class="seq">一句话说清你是什么</h1>
  <p class="sub seq">副文解释给谁用、解决什么，比标题低一级。</p>
  <div class="row seq"><button class="btn">主要动作</button><button class="btn ghost">次要动作</button></div>
  <div class="cards">
    <div class="card seq"><b>功能一</b><span>最后才轮到细节</span></div>
    <div class="card seq"><b>功能二</b><span>晚 1 拍进场</span></div>
    <div class="card seq"><b>功能三</b><span>晚 2 拍进场</span></div>
  </div>
</div>
<div class="order">入场时间层级：错峰间隔决定「谁先被看到」，克制页面里这是唯一的高音</div>
<script>

  const state = { jiange: 120, shichang: 700, weiyi: 18, huandong: "平滑", chongbo: true,
    zhucai: "#5E6AD2", di: "#fafafa", zi: "#1a1a1a", cizi: "#6b6b6b", kase: "#ffffff" };
  const EASE = { "平滑": "cubic-bezier(.16,1,.3,1)", "回弹": "cubic-bezier(.34,1.56,.64,1)", "匀速": "linear" };
  let timer = null;
  function apply() {
    const r = document.documentElement.style;
    r.setProperty("--zhucai", state.zhucai);
    r.setProperty("--di", state.di);
    r.setProperty("--zi", state.zi);
    r.setProperty("--cizi", state.cizi);
    r.setProperty("--kase", state.kase);
    r.setProperty("--weiyi", state.weiyi + "px");
    r.setProperty("--shichang", state.shichang + "ms");
    r.setProperty("--ease", EASE[state.huandong] || EASE["平滑"]);
  }

  function play() {
    document.querySelectorAll(".seq").forEach((el, i) => {
      el.classList.remove("run");
      void el.offsetWidth;
      el.style.animationDelay = (i * state.jiange) + "ms";
      el.classList.add("run");
    });
  }
  window.addEventListener("message", e => { const d = e.data; if (!d || d.type !== "param") return; state[d.key] = d.value; apply(); });
  apply(); play();

  timer = setInterval(() => { if (state.chongbo) play(); }, 4200);
</script>
</body>
</html>
