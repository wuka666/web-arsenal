<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{ --ease: cubic-bezier(.44,0,.56,1); }
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:220vh;background:var(--bg);}
  .hint{position:fixed;left:12px;bottom:10px;font-size:12px;color:#888;z-index:9}
  .replay{position:fixed;right:12px;top:12px;z-index:9;padding:6px 12px;border:0;border-radius:8px;background:#111;color:#fff;font-size:13px;cursor:pointer}
  .hero{min-height:60vh;display:flex;flex-direction:column;justify-content:center;padding:var(--pad) 8vw;text-align:var(--align);}
  .tag{align-self:var(--as);background:var(--tagBg);color:var(--tagColor);font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px;margin-bottom:20px;
    opacity:0;transform:translateY(var(--shift));transition:opacity .6s var(--ease),transform .6s var(--ease);}
  .title{margin:0;font-size:var(--titleSize);line-height:1.05;color:var(--titleColor);font-weight:var(--w);letter-spacing:-.03em;
    opacity:0;transform:translateY(var(--shift));transition:opacity .7s var(--ease),transform .7s var(--ease);}
  .sub{margin:22px 0 0;font-size:17px;color:#666;max-width:46ch;
    opacity:0;transform:translateY(var(--shift));transition:opacity .6s var(--ease) .15s,transform .6s var(--ease) .15s;}
  .hero.in .tag,.hero.in .title,.hero.in .sub{opacity:1;transform:translateY(0);}
</style></head>
<body>
  <button class="replay" id="rp">重播</button>
  <header class="hero" id="hero">
    <span class="tag" id="tag">Report 2026</span>
    <h1 class="title" id="title">AI in Design</h1>
    <p class="sub" id="sub">Designer Fund × Foundation Capital 年度设计报告</p>
  </header>
  <div class="hint">向下滚动 / 调右侧参数看变化</div>
  <script>
  const state = {
    title: "AI in Design", titleSize: 96, titleColor: "#111111",
    tag: "Report 2026", tagColor: "#ffffff", tagBg: "#111111",
    align: "左", pad: 80, weight: "中黑", shift: 60, bg: "#ffffff",
    sub: "Designer Fund × Foundation Capital 年度设计报告"
  };
  const root = document.documentElement;
  const W = { "常规":"400", "中黑":"600", "特黑":"900" };
  const AM = { "左":["left","flex-start"], "中":["center","center"], "右":["right","flex-end"] };
  function apply(){
    root.style.setProperty("--bg", state.bg);
    root.style.setProperty("--titleSize", state.titleSize + "px");
    root.style.setProperty("--titleColor", state.titleColor);
    root.style.setProperty("--tagColor", state.tagColor);
    root.style.setProperty("--tagBg", state.tagBg);
    root.style.setProperty("--pad", state.pad + "px");
    root.style.setProperty("--w", W[state.weight] || "600");
    root.style.setProperty("--shift", state.shift + "px");
    root.style.setProperty("--align", AM[state.align][0]);
    root.style.setProperty("--as", AM[state.align][1]);
    document.getElementById("title").textContent = state.title;
    document.getElementById("tag").textContent = state.tag;
    document.getElementById("sub").textContent = state.sub;
  }
  let io;
  function reset(){ // 重播：清状态并重新用 IntersectionObserver 观察 hero
    const h = document.getElementById("hero");
    h.classList.remove("in");
    if(io) io.disconnect();
    io = new IntersectionObserver((es)=>{
      es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("in"); });
    }, { threshold: 0.3 });
    io.observe(h);
  }
  document.getElementById("rp").onclick = reset;
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply(); reset();
  });
  apply(); reset();
  </script>
</body></html>
