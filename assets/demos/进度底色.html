<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>进度底色</title>
<style>
:root{--c1:#4f46e5;--c2:#ffffff;--c3:#1f2937;--bg:#eef0f4;--gap:14px;--rad:14px;--pad:16px;--w:320px;--h:64px;--p:62;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.list{width:min(92vw,var(--w));display:flex;flex-direction:column;gap:var(--gap)}
.row{position:relative;height:var(--h);background:var(--c2);border-radius:var(--rad);padding:0 var(--pad);display:flex;align-items:center;overflow:hidden;box-shadow:0 4px 14px rgba(20,20,40,.08)}
.fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p) * 1%);background:var(--c1);opacity:.16;transition:width .3s}
.row .lab{position:relative;font-weight:600}
.row .val{position:relative;margin-left:auto;font-variant-numeric:tabular-nums;opacity:.7}
</style></head><body>
<div class="list">
 <div class="row"><div class="fill"></div><span class="lab">阅读</span><span class="val" id="v">62%</span></div>
 <div class="row"><div class="fill" style="width:38%"></div><span class="lab">运动</span><span class="val">38%</span></div>
 <div class="row"><div class="fill" style="width:81%"></div><span class="lab">编码</span><span class="val">81%</span></div>
</div>
<script>
const state={c1:"#4f46e5",c2:"#ffffff",c3:"#1f2937",bg:"#eef0f4",gap:14,rad:14,pad:16,w:320,h:64,p:62};
const r=document.documentElement.style;
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--gap',state.gap+'px');r.setProperty('--rad',state.rad+'px');r.setProperty('--pad',state.pad+'px');r.setProperty('--w',state.w+'px');r.setProperty('--h',state.h+'px');r.setProperty('--p',state.p);document.getElementById('v').textContent=state.p+'%';}
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
