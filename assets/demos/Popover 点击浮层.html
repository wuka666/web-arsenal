<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Popover 点击浮层</title>
<style>
:root{--bg:#f8fafc;--ink:#0f172a;--popBg:#ffffff;--accent:#0ea5e9;--radius:10px;--w:220px;--pad:14px;--shadow:0.16}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{position:relative}
.btn{padding:10px 16px;border:none;background:var(--accent);color:#fff;border-radius:var(--radius);cursor:pointer;font-size:14px}
.pop{position:absolute;top:calc(100% + 10px);left:0;width:calc(var(--w) * 1px);background:var(--popBg);border:1px solid #e2e8f0;border-radius:var(--radius);padding:var(--pad);box-shadow:0 12px 30px rgba(0,0,0,var(--shadow));color:var(--ink);font-size:13px;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .2s,transform .2s}
.pop.on{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.pop h4{margin-bottom:6px;font-size:14px}
.pop p{opacity:.75;line-height:1.6;margin-bottom:10px}
.pop button{padding:6px 12px;border:none;background:var(--accent);color:#fff;border-radius:6px;cursor:pointer;font-size:12px}
</style>
<style>
/* 合规补齐：宪法附录B B1 —— 移动端可点元素命中区须 ≥44（WCAG 判命中区不判视觉尺寸，故用 min 尺寸撑开，视觉不变） */
.btn{min-width:44px;min-height:44px}
</style>
</head>
<body>
<div class="wrap"><button class="btn" id="b">了解更多</button><div class="pop" id="p"><h4>协作空间</h4><p>邀请成员一起编辑，权限可按角色分配，变更实时同步。</p><button>邀请成员</button></div></div>
<script>
var state={bg:"#f8fafc",ink:"#0f172a",popBg:"#ffffff",accent:"#0ea5e9",radius:10,w:220,pad:14,shadow:0.16};
var r=document.documentElement.style;
function apply(){r.setProperty('--bg',state.bg);r.setProperty('--ink',state.ink);r.setProperty('--popBg',state.popBg);r.setProperty('--accent',state.accent);r.setProperty('--radius',state.radius+'px');r.setProperty('--w',state.w+'px');r.setProperty('--pad',state.pad+'px');r.setProperty('--shadow',state.shadow);}
apply();
var b=document.getElementById("b"),p=document.getElementById("p");
b.addEventListener("click",function(e){e.stopPropagation();p.classList.toggle("on");});
document.addEventListener("click",function(e){if(!p.contains(e.target))p.classList.remove("on");});
setTimeout(function(){p.classList.add("on");},400);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
