<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可拦截卡片演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; gap: 18px; }
  .stage { position: relative; width: 300px; height: 200px; }
  .card { position: absolute; inset: 0; border-radius: 18px; background: var(--card); box-shadow: 0 10px 30px rgba(0,0,0,.16); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; font-weight: 700; cursor: grab; touch-action: none; user-select: none; will-change: transform, opacity; }
  .btn { padding: 10px 22px; border: none; border-radius: 10px; background: #3d5fd6; color: #fff; font-size: 14px; cursor: pointer; }

</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="card" id="card">飞出去的卡片</div>
</div>
<button class="btn" id="fly">让卡片飞出</button>

<script>
  const state = { dur: 900, dist: 360, rot: 22, card: "#3d5fd6", bg: "#fafafa", threshold: 200 };
  const stage = document.getElementById("stage");
  const card = document.getElementById("card");
  let raf = null, flying = false, dragging = false, px = 0, py = 0, sx = 0, sy = 0, t0 = 0;

  function apply() {
    card.style.background = state.card;
    document.body.style.background = state.bg;
  }
  function flyOut() {
    flying = true; t0 = performance.now();
    const fromX = 0, fromR = 0;
    (function step(now) {
      if (!flying) return;
      const p = Math.min((now - t0) / state.dur, 1);
      const e = 1 - Math.pow(1 - p, 3);
      const x = fromX + state.dist * e;
      const r = fromR + state.rot * e;
      card.style.transform = "translate(" + x + "px," + (40 * e) + "px) rotate(" + r + "deg)";
      card.style.opacity = 1 - p;
      if (p < 1) raf = requestAnimationFrame(step);
      else { flying = false; card.style.opacity = 0; }
    })(t0);
  }
  card.addEventListener("pointerdown", e => {
    if (raf) cancelAnimationFrame(raf);
    flying = false; dragging = true;
    card.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY;
    const m = new DOMMatrixReadOnly(getComputedStyle(card).transform);
    px = m.m41; py = m.m42;
    card.style.cursor = "grabbing";
    card.style.opacity = 1;
  });
  card.addEventListener("pointermove", e => {
    if (!dragging) return;
    card.style.transform = "translate(" + (px + e.clientX - sx) + "px," + (py + e.clientY - sy) + "px)";
  });
  card.addEventListener("pointerup", e => {
    if (!dragging) return; dragging = false; card.style.cursor = "grab";
    const m = new DOMMatrixReadOnly(getComputedStyle(card).transform);
    if (m.m41 > state.threshold) flyOut();
    else {
      card.style.transition = "transform .4s cubic-bezier(.34,1.5,.5,1)";
      card.style.transform = "translate(0,0) rotate(0deg)";
      setTimeout(() => card.style.transition = "", 420);
    }
  });
  document.getElementById("fly").addEventListener("click", () => { card.style.opacity = 1; card.style.transition = ""; card.style.transform = "translate(0,0)"; flyOut(); });
  window.addEventListener("message", e => { const d = e.data; if (!d || d.type !== "param") return; state[d.key] = d.value; apply(); });
  apply();
</script>
</body>
</html>
