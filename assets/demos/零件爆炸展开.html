<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>零件爆炸展开</title>
<style>
*{box-sizing:border-box;margin:0}
body{position:relative;height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0b1020);font-family:system-ui,"Segoe UI",Arial,sans-serif}
:root{--bg:#0b1020;--shell:#2b6cb0;--core:#ffce5a;--dist:95;--dur:7;--spin:22;--radius:10;--railW:4}
.scene{width:200px;height:200px;transform-style:preserve-3d;transform:perspective(900px)}
.box{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:calc(var(--radius)*1px);background:color-mix(in srgb,var(--shell) 80%,transparent);border:1px solid rgba(255,255,255,.25)}
.core{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:10px;background:var(--core,#ffce5a);box-shadow:0 0 30px var(--core,#ffce5a)}
/* 爆炸刻度尺：爆炸视图的读数需求——「炸开到几成」光看面间距是估不准的，给一根尺 */
/* 深底上 .10 的轨道等于没画，提到 .20；刻度线 .5 才看得出是「尺」 */
/* ⚠️ 本条 apply() 是老式写法（setProperty 不拼单位），--railW 是无单位数字，
   长度一律要 calc(var(--railW)*1px)，直接 width:var(--railW) 会算成 0（实测 0x140，整根尺子看不见） */
.rail{position:absolute;right:26px;top:50%;margin-top:-70px;width:calc(var(--railW)*1px);height:140px;border-radius:2px;background:rgba(255,255,255,.20)}
.rail .tick{position:absolute;left:-7px;width:calc(var(--railW)*1px + 14px);height:1px;background:rgba(255,255,255,.50)}
.rail .mark{position:absolute;left:-5px;width:calc(var(--railW)*1px + 10px);height:3px;border-radius:2px;background:var(--core);top:0}
/* 标签右对齐到尺子的右缘、向左排：向左延伸不会顶破窄屏右边（实测左排会溢出 22px） */
.rail .cap{position:absolute;right:0;top:-18px;font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.55);white-space:nowrap}
</style>
</head>
<body>
<div class="scene"><div class="box" id="box">
<div class="face" data-r=""></div>
<div class="face" data-r="rotateY(180deg)"></div>
<div class="face" data-r="rotateY(90deg)"></div>
<div class="face" data-r="rotateY(-90deg)"></div>
<div class="face" data-r="rotateX(90deg)"></div>
<div class="face" data-r="rotateX(-90deg)"></div>
<div class="core" id="core"></div>
</div></div>
<div class="rail" id="rail">
  <span class="cap" id="cap">展开度 100%</span>
  <i class="tick" style="top:0"></i><i class="tick" style="top:50%"></i><i class="tick" style="top:100%"></i>
  <i class="mark" id="mark"></i>
</div>
<script>
const state={"bg":"#0b1020","shell":"#2b6cb0","core":"#ffce5a","dist":95,"dur":7,"spin":22,"radius":10,"railW":4};
function apply(){const r=document.documentElement.style;for(const k in state){r.setProperty("--"+k,state[k]);}}
const box=document.getElementById("box"),core=document.getElementById("core"),mark=document.getElementById("mark"),cap=document.getElementById("cap");
const faces=[].slice.call(document.querySelectorAll(".face"));const half=60;let ang=0;
function draw(t){const e=t<0.4?t/0.4:t<0.7?1:1-(t-0.7)/0.3;ang+=state.spin/60;const tz=half+e*state.dist;faces.forEach(function(f){f.style.transform=f.dataset.r+" translateZ("+tz+"px)";});core.style.transform="scale(1)";box.style.transform="rotateX(-18deg) rotateY("+ang+"deg)";mark.style.top=(e*100)+"%";cap.textContent="展开度 "+Math.round(e*100)+"%";}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now){const t=(now/1000/state.dur)%1;draw(t);if(!reduce)requestAnimationFrame(frame);}
apply();if(reduce)draw(0.5);else requestAnimationFrame(frame);
addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
