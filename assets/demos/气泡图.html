<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>气泡图</title>
<style>
:root{--c1:#22d3ee;--c2:#a78bfa;--c3:#f472b6;--bg:#0f172a;--gap:60;--n:14;--speed:1;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#e5e7eb;min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:min(94vw,460px);background:#111827;border-radius:14px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
canvas{width:100%;height:280px;display:block}
</style></head><body>
<div class="box"><canvas id="cv"></canvas></div>
<script>
const state={c1:"#22d3ee",c2:"#a78bfa",c3:"#f472b6",bg:"#0f172a",gap:60,n:14,speed:1};
const r=document.documentElement.style;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const COL=['var(--c1)','var(--c2)','var(--c3)'];
function resolve(c){return getComputedStyle(document.documentElement).getPropertyValue(c.replace('var(','').replace(')','')).trim()||'#22d3ee';}
let bubbles=[];
function init(){bubbles=[];for(let i=0;i<state.n;i++){bubbles.push({x:Math.random(),y:Math.random(),r:14+Math.random()*26,vy:(Math.random()-.5)*.4,c:resolve(COL[i%3])});}}
function resize(){const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--gap',state.gap+'px');r.setProperty('--n',state.n);r.setProperty('--speed',state.speed);resize();init();}
apply();
function loop(){const w=cv.clientWidth,h=cv.height?cv.clientHeight:280;ctx.clearRect(0,0,w,h);bubbles.forEach(b=>{b.y-=b.vy*state.speed*0.004;if(b.y<-.1)b.y=1.1;const x=b.x*w,y=b.y*h;ctx.beginPath();ctx.arc(x,y,b.r,0,7);ctx.fillStyle=b.c;ctx.globalAlpha=.55;ctx.fill();ctx.globalAlpha=1;});requestAnimationFrame(loop);}
requestAnimationFrame(loop);
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
