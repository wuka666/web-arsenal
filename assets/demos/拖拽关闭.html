<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拖拽关闭演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #1a1a1a;
    overflow: hidden;
  }

  .btn {
    cursor: pointer; user-select: none; border: none; outline: none;
    background: #1a1a1a; color: #fff; font-size: 15px; font-weight: 700;
    padding: 12px 28px; border-radius: 10px;
  }
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0); pointer-events: none;
    transition: background .3s ease;
  }
  .mask.show { background: var(--maskbg, rgba(0,0,0,.3)); pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--h, 55vh);
    border-radius: var(--radius, 20px) var(--radius, 20px) 0 0;
    background: var(--sheet, #fff); box-shadow: 0 -8px 30px rgba(0,0,0,var(--shadow, .12));
    transform: translateY(105%);
    transition: transform var(--dur, .3s) cubic-bezier(.32,.72,0,1);
  }
  .sheet.show { transform: translateY(0); }
  .sheet.dragging { transition: none; }
  .sheet.gone { transform: translateY(105%); }
  .grab { padding: 14px 0 6px; cursor: grab; touch-action: none; user-select: none; }
  .grab:active { cursor: grabbing; }
  .handle { width: 40px; height: 4px; border-radius: 4px; background: var(--handlec, #ddd); margin: 0 auto; }
  .sheet-title { text-align: center; font-weight: 800; margin-top: 10px; }
</style>
</head>
<body>
<button class="btn" id="open">打开弹层</button>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab" id="grab"><div class="handle"></div></div>
  <div class="sheet-title">示例弹层</div>
  </div>

<script>

  const state = {
    threshold: 30,
    dur: 0.3,
    vel: 1.0,
    followRatio: 1,
    maskFollow: true,
    sheetH: 55,
    radius: 20,
    shadow: 0.12,
    mask: 0.3,
    maskColor: "#000000",
    sheetBg: "#ffffff",
    handleColor: "#dddddd"
  };
  const mask = document.getElementById("mask");
  const sheet = document.getElementById("sheet");
  const grab = document.getElementById("grab");

  function rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
  }

  function apply() {
    const R = document.documentElement.style;
    R.setProperty("--dur", state.dur + "s");
    R.setProperty("--h", state.sheetH + "vh");
    R.setProperty("--radius", state.radius + "px");
    R.setProperty("--shadow", state.shadow);
    R.setProperty("--maskbg", rgba(state.maskColor, state.mask));
    R.setProperty("--sheet", state.sheetBg);
    R.setProperty("--handlec", state.handleColor);

    state.threshold = +state.threshold;
    state.vel = +state.vel;
    state.followRatio = +state.followRatio;
  }

  let startY = 0, curY = 0, lastY = 0, lastT = 0, dragging = false, vel = 0;

  grab.addEventListener("pointerdown", (e) => {
    dragging = true;
    startY = curY = lastY = e.clientY;
    lastT = performance.now();
    vel = 0;
    grab.setPointerCapture(e.pointerId);
    sheet.classList.add("dragging");
    mask.style.transition = "none";
  });
  grab.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    curY = e.clientY;
    const now = performance.now();
    const dt = now - lastT;
    if (dt > 0) vel = (curY - lastY) / dt;
    lastY = curY; lastT = now;
    const dy = Math.max(0, curY - startY);

    const move = dy * state.followRatio;
    sheet.style.transform = "translateY(" + move + "px)";

    if (state.maskFollow) mask.style.background = rgba(state.maskColor, state.mask * (1 - Math.min(1, dy / (sheet.offsetHeight * 1.2))));
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove("dragging");
    mask.style.transition = "";
    mask.style.background = "";
    const dist = (curY - startY) * state.followRatio;
    const ratio = dist / sheet.offsetHeight * 100;

    if (ratio > state.threshold || vel > state.vel) close(); else rebound();
  }
  grab.addEventListener("pointerup", endDrag);
  grab.addEventListener("pointercancel", endDrag);

  function rebound() {
    sheet.classList.add("show");
    sheet.style.transform = "";
    setTimeout(() => sheet.classList.remove("show", "gone"), state.dur * 1000 + 60);
  }
  function close() {
    sheet.style.transform = "";
    sheet.classList.remove("show");
    sheet.classList.add("gone");
    mask.classList.remove("show");
    setTimeout(() => sheet.classList.remove("gone"), state.dur * 1000 + 60);
  }
  function open() {
    sheet.classList.remove("gone");
    sheet.classList.add("show");
    mask.classList.add("show");
  }
  document.getElementById("open").addEventListener("click", open);
  mask.addEventListener("click", close);

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });
  apply();
</script>
</body>
</html>
