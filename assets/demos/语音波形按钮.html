<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语音波形按钮</title>
<style>
:root{--btn:#d98a3d;--halo:#d98a3d;--bar:#ffffff;--ink:#1c1c1c;--radius:50;--size:84;--speed:1.1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2a241c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{position:relative;width:calc(var(--size)*1px);height:calc(var(--size)*1px)}
.halo{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,var(--halo) 0%,transparent 70%);opacity:.35;animation:pulse calc(var(--speed)*1s) ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.25}50%{transform:scale(1.05);opacity:.5}}
.btn{position:relative;width:100%;height:100%;border-radius:calc(var(--radius)*1px);background:var(--btn);display:flex;align-items:center;justify-content:center;gap:3px}
.btn i{width:4px;background:var(--bar);border-radius:3px;animation:wave calc(var(--speed)*1s) ease-in-out infinite}
.btn i:nth-child(1){height:18px;animation-delay:0s}
.btn i:nth-child(2){height:30px;animation-delay:.15s}
.btn i:nth-child(3){height:24px;animation-delay:.3s}
.btn i:nth-child(4){height:34px;animation-delay:.45s}
.btn i:nth-child(5){height:20px;animation-delay:.6s}
@keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.cap{position:absolute;bottom:-26px;left:0;right:0;text-align:center;color:var(--bar);font-size:12px;opacity:.7}
</style>
</head>
<body>
<div class="wrap"><div class="halo"></div><div class="btn"><i></i><i></i><i></i><i></i><i></i></div><div class="cap">按住说话</div></div>
</body>
</html>
