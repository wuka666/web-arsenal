<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>弹球池</title>
<style>
:root{
  --bg:#0e1116;
  --hue:190;
  --count:60;
  --size:16;
  --gravity:0.5;
  --bounce:0.82;
  --damping:0.995;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);height:100vh;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  color:rgba(255,255,255,.5);font:12px/1.4 system-ui,"PingFang SC",sans-serif;letter-spacing:.06em}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint">重力弹球在池内堆叠碰撞 · 可调球数 / 球径 / 重力 / 弹性 / 阻尼 / 色相</div>
<script>
// 全部参数集中于此，与上方 :root 一一对应（键=CSS 变量名）
var state={bg:"#0e1116",hue:190,count:60,size:16,gravity:0.5,bounce:0.82,damping:0.995};
function apply(){
  var r=document.documentElement.style;
  for(var k in state){ r.setProperty('--'+k,state[k]); }
}
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=0,H=0,balls=[]; var sig='';
function resize(){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  sig=''; // 尺寸变了重建
}
function build(){
  var n=Math.max(1,Math.min(140,state.count|0)), base=+state.size;
  balls=[];
  for(var i=0;i<n;i++){
    var r=base*(0.6+Math.random()*0.7);
    balls.push({x:r+Math.random()*(W-2*r),y:r+Math.random()*(H*0.7),
      vx:(Math.random()-0.5)*3,vy:Math.random()*2,r:r,
      hue:(+state.hue + (i/n)*80)%360});
  }
}
function step(dt){
  var g=+state.gravity, bo=+state.bounce, dp=+state.damping;
  for(var i=0;i<balls.length;i++){
    var b=balls[i];
    b.vy+=g*dt; b.vx*=dp; b.vy*=dp;
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*bo;}
    if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*bo;}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*bo;}
    if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*bo;}
  }
  // 球间斥力（O(n²)，球数上限 140 可承受）
  for(var a=0;a<balls.length;a++){
    for(var c=a+1;c<balls.length;c++){
      var A=balls[a],C=balls[c],dx=C.x-A.x,dy=C.y-A.y,d2=dx*dx+dy*dy;
      var rr=A.r+C.r;
      if(d2>0 && d2<rr*rr){
        var d=Math.sqrt(d2),ox=dx/d*(rr-d)*0.5,oy=dy/d*(rr-d)*0.5;
        A.x-=ox;A.y-=oy;C.x+=ox;C.y+=oy;
        var tvx=A.vx,tvy=A.vy;
        A.vx=C.vx*0.9;A.vy=C.vy*0.9;C.vx=tvx*0.9;C.vy=tvy*0.9;
      }
    }
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<balls.length;i++){
    var b=balls[i];
    var grd=ctx.createRadialGradient(b.x-b.r*0.35,b.y-b.r*0.4,b.r*0.15,b.x,b.y,b.r);
    grd.addColorStop(0,'hsl('+b.hue+' 92% 74%)');
    grd.addColorStop(1,'hsl('+b.hue+' 82% 52%)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  }
}
var last=performance.now();
function loop(now){
  var dt=Math.min(50,now-last)/16.67; last=now;
  var want=state.count+'|'+state.size+'|'+W+'|'+H;
  if(want!==sig){ sig=want; build(); }
  step(dt); draw(); requestAnimationFrame(loop);
}
resize(); window.addEventListener('resize',resize);
apply(); requestAnimationFrame(loop);
// 外部调参契约：只接受 type==='param' 且 key 在 state 内的消息
window.addEventListener('message',function(e){
  var d=e.data;
  if(!d||d.type!=='param')return;
  if(!(d.key in state))return;
  state[d.key]=d.value; apply();
});
</script>
</body>
</html>
