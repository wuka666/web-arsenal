<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>更新公告胶囊演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: var(--di); color: var(--zi); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 18px; }

  .pill { display: inline-flex; align-items: center; gap: 8px; padding: var(--neibian) calc(var(--neibian) * 1.6);
    background: var(--kadi); border: 1px solid var(--bianse); border-radius: var(--yuanjiao);
    font-size: var(--zihao); color: var(--zi); cursor: pointer; transition: filter .18s ease; }
  .pill .new { background: var(--dian); color: #fff; border-radius: 6px; padding: 1px 7px; font-size: calc(var(--zihao) - 1.5px); font-weight: 700; }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dian); }
  .pill .arw { color: var(--dian); transition: transform .2s ease; }
  .pill:hover { filter: brightness(calc(100% + var(--tiliang) * 1%)); }
  .pill:hover .arw { transform: translateX(var(--jianto)); }
  .pill.solid { background: var(--dian); color: #fff; border-color: var(--dian); }
  .pill.solid .new { background: #fff; color: var(--dian); }
  .pill.solid .arw, .pill.solid .dot { color: #fff; background: #fff; }

</style>
</head>
<body>
  <div class="pill" id="a"><span class="new">New</span>Loops 上线：反馈直接变成任务<span class="arw">→</span></div>
  <div class="pill" id="b"><span class="dot"></span>小圆点版：更低调的日常公告<span class="arw">→</span></div>
  <div class="pill solid" id="c"><span class="new">New</span>实心版：想让这条消息更跳一点</div>

<script>

  const state = { yuanjiao: 999, neibian: 8, zihao: 13, jianto: 5, tiliang: 12,
    dian: "#5E6AD2", kadi: "#ffffff", bianse: "#e6e6e6", zi: "#1a1a1a", di: "#fafafa" };
  function apply() {
    const r = document.documentElement.style;
    r.setProperty("--yuanjiao", state.yuanjiao + "px");
    r.setProperty("--neibian", state.neibian + "px");
    r.setProperty("--zihao", state.zihao + "px");
    r.setProperty("--jianto", state.jianto + "px");
    r.setProperty("--tiliang", state.tiliang);
    r.setProperty("--dian", state.dian);
    r.setProperty("--kadi", state.kadi);
    r.setProperty("--bianse", state.bianse);
    r.setProperty("--zi", state.zi);
    r.setProperty("--di", state.di);
  }
  window.addEventListener("message", e => { const d = e.data; if (!d || d.type !== "param") return; state[d.key] = d.value; apply(); });
  apply();
</script>
</body>
</html>
