<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>粒子星系 · 演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: system-ui, "Microsoft YaHei", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* 提示条 */
  .notice {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    color: #ffffff60; font-size: 13px; text-align: center; pointer-events: none;
    line-height: 1.5; letter-spacing: .02em;
  }
  .notice a { color: #ffffff90; pointer-events: auto; }

  /* 控制面板 */
  .panel-toggle {
    position: fixed; right: 16px; bottom: 16px; z-index: 10;
    width: 40px; height: 40px; border-radius: 999px;
    background: #ffffff1f; border: 0; color: #ffffffcc; cursor: pointer;
    font-size: 18px; display: grid; place-items: center; transition: background .15s;
  }
  .panel-toggle:hover { background: #ffffff33; }
  .panel {
    position: fixed; right: 16px; bottom: 64px; z-index: 10;
    width: 280px; max-height: 70vh; overflow-y: auto;
    background: #111; border: 1px solid #ffffff1a; border-radius: 12px;
    padding: 16px; display: none; flex-direction: column; gap: 8px;
  }
  .panel.open { display: flex; }
  .panel h3 { color: #ffffff99; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin: 4px 0 2px; }
  .panel label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #ffffffcc; font-size: 12px; }
  .panel input[type="range"] { width: 100px; accent-color: #ffffff; }
  .panel input[type="color"] { width: 50px; height: 22px; border: 0; background: transparent; cursor: pointer; }
  .panel select { background: #222; color: #fff; border: 1px solid #ffffff33; border-radius: 6px; padding: 2px 6px; font-size: 12px; }
  .panel .note { color: #ffffff66; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="notice">
  Canvas 2D 预览 · 完整 Three.js 3D 版需 HTTP 服务<br>
  <a href="https://win-hao.github.io/starflow/" target="_blank">查看在线版 →</a>
</div>

<button class="panel-toggle" id="toggle" aria-label="调参">⚙</button>
<div class="panel" id="panel">
  <h3>星场</h3>
  <label>星数 <b id="v-count">2000</b><input id="count" type="range" min="500" max="8000" step="100" value="2000"></label>
  <label>星星大小 <b id="v-size">1.5</b><input id="size" type="range" min="0.5" max="4" step="0.1" value="1.5"></label>
  <label>流动速度 <b id="v-speed">0.5</b><input id="speed" type="range" min="0" max="2" step="0.05" value="0.5"></label>
  <label>星带宽度 <b id="v-scatter">0.6</b><input id="scatter" type="range" min="0.2" max="1" step="0.05" value="0.6"></label>
  <label>旋转速度 <b id="v-rotate">0.3</b><input id="rotate" type="range" min="0" max="1" step="0.05" value="0.3"></label>
  <h3>颜色</h3>
  <label>主色 <input id="color1" type="color" value="#6eb5ff"></label>
  <label>辅色 <input id="color2" type="color" value="#ff8c5a"></label>
  <label>底色 <input id="bg" type="color" value="#000000"></label>
  <p class="note">调参通过 postMessage({type:'param',key,value}) 实时更新</p>
</div>

<script>
  const canvas = document.getElementById('c')
  const ctx = canvas.getContext('2d')
  let W, H

  const state = {
    count: 2000, size: 1.5, speed: 0.5, scatter: 0.6, rotate: 0.3,
    bgRatio: 0.1, palette: 'astra', twinkle: 0.6,
    color1: '#6eb5ff', color2: '#ff8c5a', bg: '#000000'
  }
  // 调色板 → 主辅色（降级版仅用颜色近似 3D 调色板）
  const PALETTES = {
    astra: ['#6eb5ff', '#ff8c5a'], aurora: ['#7CFFB2', '#4D9CFF'],
    ember: ['#FF7A45', '#FFD166'], ice: ['#9FE8FF', '#5B8DEF'], gold: ['#FFD700', '#FFF1B8']
  }

  // 生成星星
  let stars = []

  function initStars() {
    stars = []
    for (let i = 0; i < state.count; i++) {
      // 螺旋星系分布：半径 r 从 0.05 到 1，角度随半径变化
      const r = 0.05 + Math.pow(Math.random(), 0.6) * 0.95
      const armAngle = r * 8 * Math.PI  // 绕 4 圈
      const spread = (1 - r * 0.7) * state.scatter * 0.3  // 内圈密外圈疏
      const angle = armAngle + (Math.random() - 0.5) * spread
      const x = Math.cos(angle) * r
      const y = Math.sin(angle) * r
      const brightness = 0.3 + Math.random() * 0.7
      const armOffset = Math.random() * 0.2  // 星臂偏移
      const size = 0.3 + Math.random() * 0.7
      // 颜色混合：主色（蓝）为主，部分偏辅色（橙）
      const mix = Math.random()
      stars.push({ x, y, brightness, armOffset, size, mix, baseAngle: angle, r })
    }
  }

  let time = 0

  function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16)
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255]
  }

  function lerpColor(c1, c2, t) {
    return [
      Math.round(c1[0] + (c2[0] - c1[0]) * t),
      Math.round(c1[1] + (c2[1] - c1[1]) * t),
      Math.round(c1[2] + (c2[2] - c1[2]) * t)
    ]
  }

  function resize() {
    W = canvas.width = window.innerWidth
    H = canvas.height = window.innerHeight
  }
  window.addEventListener('resize', resize)
  resize()

  function draw() {
    time += 0.016 * state.speed

    // 背景
    ctx.fillStyle = state.bg
    ctx.fillRect(0, 0, W, H)

    // 中心光晕
    const cx = W / 2, cy = H / 2
    const maxR = Math.min(W, H) * 0.08
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR)
    const c1 = hexToRgb(state.color1)
    grad.addColorStop(0, `rgba(${c1[0]},${c1[1]},${c1[2]},0.3)`)
    grad.addColorStop(1, 'rgba(0,0,0,0)')
    ctx.fillStyle = grad
    ctx.fillRect(0, 0, W, H)

    // 背景星（小点，数量随 backgroundRatio 联动）
    ctx.fillStyle = '#ffffff30'
    const bgN = Math.round(state.count * state.bgRatio)
    for (let i = 0; i < bgN; i++) {
      const bx = Math.random() * W, by = Math.random() * H
      const bs = 0.5 + Math.random() * 1
      ctx.globalAlpha = 0.15 + Math.random() * 0.25
      ctx.beginPath()
      ctx.arc(bx, by, bs, 0, Math.PI * 2)
      ctx.fill()
    }
    ctx.globalAlpha = 1

    // 星系星星
    const scale = Math.min(W, H) * 0.35
    const rot = time * state.rotate
    const c1rgb = hexToRgb(state.color1)
    const c2rgb = hexToRgb(state.color2)

    for (const s of stars) {
      const angle = s.baseAngle + rot
      const r = s.r * scale
      const x = cx + Math.cos(angle) * r
      const y = cy + Math.sin(angle) * r * 0.55  // 压扁成椭圆

      // 闪烁（速度随 twinkleSpeed 联动）
      const twinkle = 0.6 + 0.4 * Math.sin(time * state.twinkle * 3 + s.armOffset * 10)
      const alpha = s.brightness * twinkle

      // 颜色
      const color = lerpColor(c1rgb, c2rgb, s.mix * 0.4)
      const sz = s.size * state.size * (0.5 + 0.5 * r / scale)

      // 绘制星星（带辉光）
      const glowR = sz * 3
      const grad2 = ctx.createRadialGradient(x, y, 0, x, y, glowR)
      grad2.addColorStop(0, `rgba(${color[0]},${color[1]},${color[2]},${alpha * 0.6})`)
      grad2.addColorStop(0.2, `rgba(${color[0]},${color[1]},${color[2]},${alpha * 0.3})`)
      grad2.addColorStop(1, `rgba(${color[0]},${color[1]},${color[2]},0)`)
      ctx.fillStyle = grad2
      ctx.beginPath()
      ctx.arc(x, y, glowR, 0, Math.PI * 2)
      ctx.fill()

      // 核心亮点
      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.8})`
      ctx.beginPath()
      ctx.arc(x, y, sz * 0.4, 0, Math.PI * 2)
      ctx.fill()

      // 十字衍射
      ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.15})`
      ctx.lineWidth = 0.5
      ctx.beginPath()
      ctx.moveTo(x - sz, y)
      ctx.lineTo(x + sz, y)
      ctx.moveTo(x, y - sz)
      ctx.lineTo(x, y + sz)
      ctx.stroke()
    }

    requestAnimationFrame(draw)
  }

  initStars()
  draw()

  // 面板控制
  const panel = document.getElementById('panel')
  document.getElementById('toggle').addEventListener('click', () => panel.classList.toggle('open'))

  function bind(id, key, isFloat) {
    const el = document.getElementById(id)
    const val = document.getElementById('v-' + id)
    el.addEventListener('input', () => {
      state[key] = isFloat ? parseFloat(el.value) : Number(el.value)
      val.textContent = state[key]
      if (key === 'count') initStars()
    })
  }

  bind('count', 'count')
  bind('size', 'size', true)
  bind('speed', 'speed', true)
  bind('scatter', 'scatter', true)
  bind('rotate', 'rotate', true)

  document.getElementById('color1').addEventListener('input', e => { state.color1 = e.target.value })
  document.getElementById('color2').addEventListener('input', e => { state.color2 = e.target.value })
  document.getElementById('bg').addEventListener('input', e => { state.bg = e.target.value })

  // postMessage 调参
  // 把 s209 方案参数键映射到降级版内部 state：核心参数给可见反馈，3D 专属静默接受
  const PARAM_MAP = {
    starCount: 'count', size: 'size', scatter: 'scatter',
    backgroundRatio: 'bgRatio', rotationDepth: 'rotate',
    palette: 'palette', flowSpeed: 'speed', twinkleSpeed: 'twinkle'
  }
  const IGNORE_3D = ['bloomIntensity','bloomThreshold','intensity','flare','vignette','ambientColor']
  window.addEventListener('message', e => {
    const d = e.data
    if (!d || d.type !== 'param') return
    if (d.key in PARAM_MAP) {
      state[PARAM_MAP[d.key]] = d.value
      if (d.key === 'palette') { const p = PALETTES[d.value] || PALETTES.astra; state.color1 = p[0]; state.color2 = p[1] }
    } else if (!IGNORE_3D.includes(d.key)) {
      state[d.key] = d.value
    }
    if (d.key === 'starCount' || d.key === 'backgroundRatio') initStars()
  })
</script>
</body>
</html>
