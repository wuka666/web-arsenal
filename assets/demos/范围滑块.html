<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>范围滑块</title>
<style>
:root{--c1:#007aff;--c2:#ffffff;--c3:#1f2937;--bg:#f2f2f7;--rad:14px;--w:340px;--h:14px;--sz:28px;--lo:30;--hi:70;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:min(92vw,var(--w));background:var(--c2);border-radius:var(--rad);padding:30px 18px 22px;box-shadow:0 6px 18px rgba(20,20,40,.08)}
.range{position:relative;height:60px;touch-action:none}
.track{position:absolute;left:0;right:0;top:23px;height:var(--h);background:#d1d1d6;border-radius:999px}
.fill{position:absolute;top:23px;height:var(--h);background:var(--c1);border-radius:999px;left:calc(var(--lo) * 1%);width:calc((var(--hi) - var(--lo)) * 1%)}
.hd{position:absolute;top:23px;width:var(--sz);height:var(--sz);border-radius:50%;background:var(--c2);box-shadow:0 2px 8px rgba(0,0,0,.25);transform:translate(-50%,-7px);cursor:grab}
.hd.lo{left:calc(var(--lo) * 1%)}.hd.hi{left:calc(var(--hi) * 1%)}
.read{text-align:center;margin-top:14px;font-weight:700;color:var(--c1);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="box"><div class="range" id="range"><div class="track"></div><div class="fill"></div><div class="hd lo" id="lo"></div><div class="hd hi" id="hi"></div></div><div class="read" id="read">30 – 70</div></div>
<script>
const state={c1:"#007aff",c2:"#ffffff",c3:"#1f2937",bg:"#f2f2f7",rad:14,w:340,h:14,sz:28,lo:30,hi:70};
const r=document.documentElement.style;
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--rad',state.rad+'px');r.setProperty('--w',state.w+'px');r.setProperty('--h',state.h+'px');r.setProperty('--sz',state.sz+'px');r.setProperty('--lo',state.lo);r.setProperty('--hi',state.hi);document.getElementById('read').textContent=state.lo+' – '+state.hi;}
apply();
const range=document.getElementById('range');
function drag(which){return e=>{const b=range.getBoundingClientRect();let p=(e.clientX-b.left)/b.width*100;p=Math.max(0,Math.min(100,p));if(which==='lo')state.lo=Math.min(Math.round(p),state.hi-1);else state.hi=Math.max(Math.round(p),state.lo+1);apply();};}
const lo=document.getElementById('lo'),hi=document.getElementById('hi');
function bind(el,which){let f=null;el.addEventListener('pointerdown',e=>{f=drag(which);el.setPointerCapture(e.pointerId);f(e);});el.addEventListener('pointermove',e=>{if(f)f(e);});el.addEventListener('pointerup',()=>f=null);}
bind(lo,'lo');bind(hi,'hi');
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
