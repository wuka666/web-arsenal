<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品卡悬停演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--page-bg, #fff); font-family: system-ui, "Microsoft YaHei", sans-serif;
  }
  .cards { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; padding: 0 20px; }
  .pcard {
    width: 180px; background: var(--card-bg, #fff); border: 1px solid #e5e2db;
    border-radius: var(--card-r, 18px);
    padding: 26px 18px 20px; text-align: center; cursor: pointer;
    transition: transform var(--hover-dur, .3s) ease, box-shadow var(--hover-dur, .3s) ease, filter var(--hover-dur, .3s) ease;
  }
  .pcard:hover {
    transform: translateY(calc(-1 * var(--hover-amp, 6px))) rotate(calc(var(--tilt, 1.5deg) * -1));
    box-shadow: 0 16px 30px color-mix(in srgb, #1b1b1b var(--shadow, 14%), transparent);
    filter: brightness(1.05);
  }
  .device {
    width: 100%; height: 110px; border-radius: 12px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.85); font-size: 12px; font-weight: 600;
  }

  .device.a { background: linear-gradient(145deg, var(--dev-a, #7b5cff), color-mix(in srgb, var(--dev-a, #7b5cff) 55%, white)); }
  .device.b { background: linear-gradient(145deg, var(--dev-b, #1b1b1b), color-mix(in srgb, var(--dev-b, #1b1b1b) 55%, white)); }
  .device.c { background: linear-gradient(145deg, var(--dev-c, #ff7a9c), color-mix(in srgb, var(--dev-c, #ff7a9c) 55%, white)); }
  .pcard h4 { font-size: 14px; color: #1b1b1b; }
  .pcard p { font-size: 12px; color: #8d8a82; margin-top: 4px; }
</style>
</head>
<body>
  <div class="cards">
    <div class="pcard"><div class="device a">便携设备</div><h4>随身款</h4><p>随身携带，随时使用</p></div>
    <div class="pcard"><div class="device b">智能手表</div><h4>腕上款</h4><p>腕上查看，抬手即得</p></div>
    <div class="pcard"><div class="device c">桌面设备</div><h4>桌面款</h4><p>桌面常驻，稳定可靠</p></div>
  </div>
  <script>

    const state = {
      amp: 6, dur: 0.3, tilt: 1.5, shadow: 14, radius: 18,
      cardBg: "#ffffff", devA: "#7b5cff", devB: "#1b1b1b", devC: "#ff7a9c", bg: "#ffffff"
    };

    function apply() {
      const s = document.documentElement.style;
      s.setProperty("--hover-amp", state.amp + "px");
      s.setProperty("--hover-dur", state.dur + "s");
      s.setProperty("--tilt", state.tilt + "deg");
      s.setProperty("--shadow", state.shadow + "%");
      s.setProperty("--card-r", state.radius + "px");
      s.setProperty("--card-bg", state.cardBg);
      s.setProperty("--dev-a", state.devA);
      s.setProperty("--dev-b", state.devB);
      s.setProperty("--dev-c", state.devC);
      s.setProperty("--page-bg", state.bg);
    }

    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || d.type !== "param") return;
      state[d.key] = d.value;
      apply();
    });
    apply();
  </script>
</body>
</html>
