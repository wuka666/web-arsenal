<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水波按钮演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #1a1a1a;
  }

  .btn {
    position: relative; overflow: hidden; cursor: pointer; user-select: none; outline: none;
    background: var(--bg, #fff); color: var(--tc, #1a1a1a); border: 2px solid var(--bd, #1a1a1a);
    font-size: var(--fs, 17px); font-weight: 700; letter-spacing: 3px;
    padding: 18px 56px; border-radius: var(--r, 14px);
    transition: background .25s ease, color .25s ease;
  }
  .btn:active { filter: brightness(.96); }

  .ripple {
    position: absolute; border-radius: 50%;
    background: var(--ripple, #1a1a1a);
    transform: scale(0); pointer-events: none;
  }
  .ripple.go { animation: rippleGo var(--dur, .55s) ease-out forwards; }
  @keyframes rippleGo { to { transform: scale(1); opacity: 0; } }
</style>
</head>
<body>
<button class="btn" id="btn">提交</button>

<script>

  const state = {
    dur: 0.55, opacity: 0.18, rippleColor: "#1a1a1a", spread: 1,
    bg: "#ffffff", color: "#1a1a1a", border: "#1a1a1a", radius: 14, fontSize: 17
  };
  const btn = document.getElementById("btn");
  const root = document.documentElement;

  function apply() {
    const s = root.style;
    s.setProperty("--dur", state.dur + "s");
    s.setProperty("--ripple", state.rippleColor);
    s.setProperty("--bg", state.bg);
    s.setProperty("--tc", state.color);
    s.setProperty("--bd", state.border);
    s.setProperty("--r", state.radius + "px");
    s.setProperty("--fs", state.fontSize + "px");
  }

  btn.addEventListener("click", (e) => {
    const rect = btn.getBoundingClientRect();

    const r = Math.max(rect.width, rect.height) * state.spread;
    const rip = document.createElement("span");
    rip.className = "ripple";
    rip.style.width = rip.style.height = r + "px";
    rip.style.opacity = state.opacity;

    rip.style.left = (e.clientX - rect.left - r / 2) + "px";
    rip.style.top = (e.clientY - rect.top - r / 2) + "px";
    btn.appendChild(rip);
    rip.classList.add("go");
    rip.addEventListener("animationend", () => rip.remove());
  });

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });
  apply();
</script>
</body>
</html>
