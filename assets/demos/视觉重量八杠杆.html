<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视觉重量方案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--page, #fff); font-family: system-ui, "Microsoft YaHei", sans-serif; padding: 20px;
  }
  .plan { width: min(620px, 94vw); }
  .plan h1 { font-size: 26px; font-weight: 800; color: var(--ink, #1a1a1a); }
  .aim { margin-top: 6px; font-size: 14px; color: #8a8a85; }
  .steps { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .step {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--card, #faf9f6); border: 1px solid #ecebe7;
    border-radius: var(--r, 12px); padding: 12px 14px;
    font-size: 14px; line-height: 1.7; color: #555;
  }
  .step b { color: var(--ink, #1a1a1a); white-space: nowrap; }
  .compare {
    margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap, 12px);
  }
  .box { border: 1px solid #ecebe7; border-radius: var(--r, 12px); padding: 18px; text-align: center; }
  .box small { font-size: 12px; color: #8a8a85; }
  .box h3 { margin-top: 10px; font-size: var(--normal-fs, 15px); font-weight: 600; color: var(--mute, #6f6a5e); }
  .box .b {
    margin-top: 10px; display: inline-block; font-size: 12.5px;
    border: 1px solid #ddd8ce; color: var(--mute, #6f6a5e);
    padding: 8px 18px; border-radius: 10px;
  }
  /* 主角版：字号更大更粗 + 强调色 + 阴影，三个「重量」杠杆一起上 */
  .box.strong h3 { font-size: var(--hero-fs, 22px); font-weight: 900; color: var(--ink, #1a1a1a); }
  .box.strong .b {
    background: var(--ink, #1a1a1a); color: var(--solid-t, #fff);
    border-color: var(--ink, #1a1a1a); font-weight: 700;
    box-shadow: 0 8px 18px color-mix(in srgb, var(--ink, #1a1a1a) var(--shadow, 18%), transparent);
  }
</style>
</head>
<body>
  <div class="plan">
    <h1>视觉重量</h1>
    <p class="aim">目的：让页面上最重要的东西，第一眼就被看见</p>
    <div class="steps">
      <div class="step"><b>1.</b> 先定主角：这一页你最想让用户看什么</div>
      <div class="step"><b>2.</b> 给主角加 2-3 个「重量」：变大加粗 / 颜色对比 / 周围留白 / 悬停会动</div>
      <div class="step"><b>3.</b> 验证：闭眼再睁开，第一眼必须落在主角上，不是就不够重</div>
    </div>
    <div class="compare">
      <div class="box">
        <small>普通版（重量不够）</small>
        <h3>试试我们的产品</h3>
        <span class="b">了解更多</span>
      </div>
      <div class="box strong">
        <small>主角版（加了重量）</small>
        <h3>把灵感变成弹药</h3>
        <span class="b">立即开始</span>
      </div>
    </div>
  </div>
  <script>
    // 默认参数（父页面详情页可调）
    const state = {
      accent: "#1a1a1a", accentText: "#ffffff", muteColor: "#6f6a5e",
      bg: "#ffffff", cardBg: "#faf9f6", heroSize: 22, normalSize: 15,
      radius: 12, gap: 12, shadow: 18
    };

    // 参数变了：全部走 CSS 变量，字号对比/颜色/阴影实时变
    function apply() {
      const s = document.documentElement.style;
      s.setProperty("--ink", state.accent);
      s.setProperty("--solid-t", state.accentText);
      s.setProperty("--mute", state.muteColor);
      s.setProperty("--page", state.bg);
      s.setProperty("--card", state.cardBg);
      s.setProperty("--hero-fs", state.heroSize + "px");
      s.setProperty("--normal-fs", state.normalSize + "px");
      s.setProperty("--r", state.radius + "px");
      s.setProperty("--gap", state.gap + "px");
      s.setProperty("--shadow", state.shadow + "%");
    }

    // 接收父页面（index.html 详情页）传来的参数
    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || d.type !== "param") return;
      state[d.key] = d.value;
      apply();
    });
    apply();
  </script>
</body>
</html>
