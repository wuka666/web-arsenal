<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>横滑故事卡组</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  .wrap{
    position:relative;width:100%;height:100vh;overflow:hidden;background:var(--page);
    font:500 13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;
    -webkit-user-select:none;user-select:none;
  }
  .seg{
    position:absolute;left:0;top:calc(var(--topY));width:100%;display:flex;gap:3px;padding:0 var(--pad);
    z-index:4;
  }
  .seg i{flex:1;height:2.5px;border-radius:2px;background:var(--segBg);overflow:hidden}
  .seg i b{display:block;height:100%;width:var(--p);background:var(--segOn);border-radius:2px}
  .rail{
    position:absolute;top:0;left:0;height:100%;width:100%;
    display:flex;align-items:center;gap:var(--gap);
    padding:0 var(--pad);will-change:transform;
    transition:transform var(--dur) var(--ease);
  }
  .card{
    flex:none;width:var(--w);border-radius:var(--radius);overflow:hidden;
    background:var(--cardBg);box-shadow:0 2px 10px rgba(10,10,20,.16);
    transition:transform var(--dur) var(--ease);
  }
  .art{width:100%;height:var(--h);background:var(--a1);position:relative;overflow:hidden}
  .art .g{position:absolute;inset:0;background:radial-gradient(90% 70% at 30% 20%,var(--accent) 0%,transparent 60%)}
  .body{padding:9px 11px 11px}
  .body b{display:block;font-weight:500;font-size:13px;margin-bottom:2px}
  .body span{font-size:11px;opacity:.62}
  .dot{
    position:absolute;left:var(--pad);bottom:calc(var(--topY) + 14px);
    width:44px;height:44px;border-radius:50%;border:2px solid var(--ring);z-index:4;
    background:var(--a2);
  }
  .hint{
    position:absolute;right:var(--pad);bottom:calc(var(--topY) + 18px);z-index:4;
    font-size:11px;opacity:.55;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="seg" id="seg"></div>
  <div class="dot"></div>
  <div class="hint">左滑</div>
  <div class="rail" id="rail"></div>
</div>
<script>
var state={page:"#101014",cardBg:"#1c1c22",accent:"#5ac8fa",segOn:"#ffffff",segBg:"rgba(255,255,255,.28)",ring:"#ffffff",a1:"#2a2a34",a2:"#3a3a48",fg:"#ffffff",w:196,h:250,gap:12,pad:16,topY:16,radius:14,dur:0.4,stagger:0,p:0};
var UNIT={w:"px",h:"px",gap:"px",pad:"px",topY:"px",radius:"px",dur:"s",p:"%"};
var root=document.documentElement;
function apply(){for(var k in state){root.style.setProperty("--"+k,state[k]+(UNIT[k]||""));}}
apply();
var NAMES=["海边两日","城市切片","苔庭","旧巷","夜行","晒台"];
var rail=document.getElementById("rail"),seg=document.getElementById("seg");
var k=0;
NAMES.forEach(function(n,i){
  var d=document.createElement("div");
  d.className="card";
  d.innerHTML='<div class="art"><div class="g"></div></div><div class="body"><b>'+n+'</b><span>第 '+(i+1)+' / '+NAMES.length+' 组</span></div>';
  rail.appendChild(d);
  var s=document.createElement("i");
  s.innerHTML="<b></b>";seg.appendChild(s);
});
var cur=0;
function go(i){
  cur=Math.max(0,Math.min(i,NAMES.length-1));
  var total=namesLen();
  rail.style.transform="translateX("+(-cur*(state.w+state.gap))+"px)";
  [].forEach.call(seg.children,function(e,j){
    e.firstChild.style.width=(j<cur?100:(j===cur?state.p:0))+"%";
  });
}
function namesLen(){return document.querySelectorAll(".card").length;}
rail.addEventListener("click",function(e){if(e.target.closest(".card"))go(cur+1);});
var sx=0,dx=0,drag=false,wrap=document.getElementById("wrap");
wrap.addEventListener("touchstart",function(e){drag=true;sx=e.touches[0].clientX;dx=0;},{passive:true});
wrap.addEventListener("touchmove",function(e){if(drag)dx=e.touches[0].clientX-sx;},{passive:true});
wrap.addEventListener("touchend",function(){if(drag){var t=-(dx-8);go(cur+Math.round(t/(state.w+state.gap)));drag=false;}});
wrap.addEventListener("mousedown",function(e){drag=true;sx=e.clientX;dx=0;});
window.addEventListener("mouseup",function(e){if(drag){var t=-(e.clientX-sx-8);go(cur+Math.round(t/(state.w+state.gap)));drag=false;}});
/* 长按暂停：把「播放中」的推进停住，是 stories 类容器的标志性手势反馈 */
var paused=false;
wrap.addEventListener("touchstart",function(){paused=true;},{passive:true});
wrap.addEventListener("touchend",function(){paused=false;});
setInterval(function(){if(paused)return;state.p=state.p>92?4:state.p+4;apply();seg.children[cur].firstChild.style.width=state.p+"%";},260);
go(0);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
