<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素交换</title>
<style>
:root{--c:#5eead4;--c2:#818cf8;--bg:#070a12;--cols:22;--rows:14;--sp:0.18;--size:8}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const state={"c":"#5eead4","c2":"#818cf8","bg":"#070a12","cols":22,"rows":14,"sp":0.18,"size":8};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }

}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H,grid,timer;
function build(){W=cv.width=innerWidth;H=cv.height=innerHeight;grid=[];for(let y=0;y<state.rows;y++)for(let x=0;x<state.cols;x++)grid.push({x,y,c:Math.random()<0.5?state.c:state.c2});}
function draw(){ctx.fillStyle=state.bg;ctx.fillRect(0,0,W,H);const cw=W/state.cols,ch=H/state.rows;const s=Math.min(state.size,cw,ch)*0.82;for(const p of grid){ctx.fillStyle=p.c;ctx.fillRect(p.x*cw+(cw-s)/2,p.y*ch+(ch-s)/2,s,s);}}
function swap(){if(grid.length>1){const a=(Math.random()*grid.length)|0,b=(Math.random()*grid.length)|0;const t=grid[a].c;grid[a].c=grid[b].c;grid[b].c=t;}draw();timer=setTimeout(swap,state.sp*1000);}
build();draw();swap();addEventListener('resize',()=>{clearTimeout(timer);build();draw();swap();});
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
