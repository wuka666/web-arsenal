<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻页动画演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #fff; overflow: hidden; font-family: system-ui, "Microsoft YaHei", sans-serif; }
  .page {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    background: var(--page-a, #fff);
  }
  .page.b { background: var(--page-b, #f6f4ee); }
  .page h1 { font-size: 32px; font-weight: 800; color: var(--text-c, #1b1b1b); }
  .page button {
    border: 1.5px solid var(--text-c, #1b1b1b); background: transparent; color: var(--text-c, #1b1b1b);
    padding: 10px 24px; border-radius: var(--btn-r, 10px); cursor: pointer; font-size: 14px;
    transition: background .15s ease, color .15s ease;
  }
  .page button:hover { background: var(--accent, #1b1b1b); color: #fff; }

  .page.leave { animation: pageLeave var(--leave-dur, .32s) var(--ease, ease-in) forwards; }
  .page.enter { animation: pageEnter var(--enter-dur, .5s) var(--ease, ease-out) forwards; }
  @keyframes pageLeave {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(var(--out-x, -36px)); }
  }
  @keyframes pageEnter {
    from { opacity: 0; transform: translateX(var(--in-x, 36px)); }
    to   { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>
<section class="page a" id="pa">
  <h1>页面 A</h1>
  <button id="goB">切到页面 B →</button>
</section>
<section class="page b" id="pb" style="display:none">
  <h1>页面 B</h1>
  <button id="goA">← 切回页面 A</button>
</section>
<script>

  const state = {
    leave: 0.32, enter: 0.5, dist: 36, ease: "ease-out", dir: "left",
    colorA: "#ffffff", colorB: "#f6f4ee", textColor: "#1b1b1b", accent: "#1b1b1b", radius: 10
  };

  function apply() {
    const s = document.documentElement.style;
    s.setProperty("--leave-dur", state.leave + "s");
    s.setProperty("--enter-dur", state.enter + "s");
    s.setProperty("--ease", state.ease);

    const d = state.dir === "right" ? 1 : -1;
    s.setProperty("--out-x", state.dist * d + "px");
    s.setProperty("--in-x", -state.dist * d + "px");
    s.setProperty("--page-a", state.colorA);
    s.setProperty("--page-b", state.colorB);
    s.setProperty("--text-c", state.textColor);
    s.setProperty("--accent", state.accent);
    s.setProperty("--btn-r", state.radius + "px");
  }

  function switchTo(from, to) {
    if (from.dataset.busy) return;
    from.dataset.busy = "1";
    from.classList.add("leave");
    const dur = state.leave * 1000;
    setTimeout(() => {
      from.style.display = "none";
      from.classList.remove("leave");
      delete from.dataset.busy;
      to.style.display = "";
      to.classList.add("enter");
      setTimeout(() => to.classList.remove("enter"), state.enter * 1000 + 100);
    }, dur);
  }

  document.getElementById("goB").addEventListener("click", () => switchTo(pa, pb));
  document.getElementById("goA").addEventListener("click", () => switchTo(pb, pa));

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });
  apply();
</script>
</body>
</html>
