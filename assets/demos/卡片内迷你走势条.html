<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡片内迷你走势条</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  .wrap{
    width:100%;height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--page);padding:16px;
    font:500 13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);
  }
  .card{
    width:100%;max-width:340px;min-height:44px;
    background:var(--cardBg);border-radius:var(--radius);
    padding:14px 14px 12px;box-shadow:var(--shadow);cursor:pointer;
  }
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .top .lab{font-size:12px;color:var(--dim)}
  .top .val{font-size:22px;font-weight:500;letter-spacing:-.02em}
  .top .val em{font-style:normal;font-size:12px;color:var(--dim);margin-left:4px}
  /* 离散小条：用逐条 scaleY 生长代替 SVG path 折线，尺寸小到只占卡片一行的高度 */
  .bars{display:flex;align-items:flex-end;gap:var(--gap);height:var(--h)}
  .bars i{
    flex:1;border-radius:var(--barR);
    background:var(--bar);
    height:var(--bh);
    transform-origin:bottom;
    transform:scaleY(var(--grow));
    transition:transform var(--dur) var(--ease);
    transition-delay:calc(var(--i) * var(--stagger) / 1000);
  }
  .bars i.hi{background:var(--barHi)}
  .sub{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="top"><span class="lab">近 9 周活跃</span><span class="val" id="val">0<em>次</em></span></div>
    <div class="bars" id="bars"></div>
    <div class="sub"><span>03/09</span><span id="peak">峰值 —</span></div>
  </div>
</div>
<script>
var state={page:"#eef0f4",cardBg:"#ffffff",fg:"#1c1c1e",dim:"#9b9ba4",bar:"#d8dce5",barHi:"#4a8cff",radius:16,gap:5,h:46,bh:26,barR:3,dur:0.62,stagger:55,shadow:"0 2px 8px rgba(20,24,40,.06)"};
var UNIT={radius:"px",gap:"px",h:"px",bh:"px",barR:"px",dur:"s",stagger:"ms"};
var root=document.documentElement;
var DATA=[.42,.58,.36,.72,.5,.88,.66,.94,.61];
function apply(){
  for(var k in state){root.style.setProperty("--"+k,state[k]+(UNIT[k]||""));}
  root.style.setProperty("--grow",grown?1:0);
}
var grown=false,card=document.getElementById("card");
var bars=document.getElementById("bars");
DATA.forEach(function(v,i){
  var b=document.createElement("i");
  b.style.height=(state.bh*(0.34+v*0.66)).toFixed(1)+"px";
  b.style.setProperty("--i",i);
  if(i===DATA.length-1)b.className="hi";
  bars.appendChild(b);
});
var val=document.getElementById("val"),peak=document.getElementById("peak");
var mx=Math.round(Math.max.apply(null,DATA)*1380);
var raf=0;
function toggle(){
  growNow();
  grown=!grown;apply();
  var t0=null;
  var step=function(t){
    if(!t0)t0=t;
    var p=Math.min(1,(t-t0)/700);
    val.innerHTML=Math.round(mx*p)+"<em>次</em>";
    if(p<1)raf=requestAnimationFrame(step);
  };
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(step);
}
function growNow(){val.innerHTML="0<em>次</em>";}
card.addEventListener("click",toggle);
peak.textContent="峰值 "+mx;
/* 初始即展开态：缩略图与 headless 截图直接看到长完的样子，不必等点击 */
toggle();
setInterval(toggle,2800);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
