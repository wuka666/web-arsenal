<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>路径装配</title>
<style>
*{box-sizing:border-box;margin:0}
body{position:relative;height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0b1020);font-family:system-ui,"Segoe UI",Arial,sans-serif}
:root{--bg:#0b1020;--shell:#2b6cb0;--core:#ffce5a;--dist:95;--dur:7;--spin:20;--radius:10;--stepW:32}
.scene{width:200px;height:200px;transform-style:preserve-3d;transform:perspective(900px)}
.box{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:calc(var(--radius)*1px);background:color-mix(in srgb,var(--shell) 80%,transparent);border:1px solid rgba(255,255,255,.25)}
.core{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:10px;background:var(--core,#ffce5a);box-shadow:0 0 28px var(--core,#ffce5a)}
/* 装配步骤条：装配是分序动作（内核→上下壳→左右壳→前后壳），不标出来就看不出先后顺序 */
.steps{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;display:flex;flex-direction:column;align-items:center;gap:8px}
.steps .row{display:flex;gap:7px}
.steps .step{width:calc(var(--stepW)*1px);height:3px;border-radius:2px;background:rgba(255,255,255,.20);transition:background .3s}
.steps .step.on{background:var(--core)}
.steps .cur{font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.72)}
</style>
</head>
<body>
<div class="scene"><div class="box" id="box">
<div class="face" data-r=""></div>
<div class="face" data-r="rotateY(180deg)"></div>
<div class="face" data-r="rotateY(90deg)"></div>
<div class="face" data-r="rotateY(-90deg)"></div>
<div class="face" data-r="rotateX(90deg)"></div>
<div class="face" data-r="rotateX(-90deg)"></div>
<div class="core" id="core"></div>
</div></div>
<div class="steps" id="steps">
  <span class="cur" id="cur">装入内核</span>
  <span class="row" id="row"></span>
</div>
<script>
const state={"bg":"#0b1020","shell":"#2b6cb0","core":"#ffce5a","dist":95,"dur":7,"spin":20,"radius":10,"stepW":32};
function apply(){const r=document.documentElement.style;for(const k in state){r.setProperty("--"+k,state[k]);}}
const box=document.getElementById("box"),core=document.getElementById("core");const faces=[].slice.call(document.querySelectorAll(".face"));const half=60;let ang=0;
const PHASE=["装入内核","合上下壳","合左右壳","合前后壳"];
const row=document.getElementById("row"),cur=document.getElementById("cur");
PHASE.forEach(function(){const i=document.createElement("i");i.className="step";row.appendChild(i);});
const steps=[].slice.call(row.children);
function phaseOf(t){return t<0.5?0:t<0.65?1:t<0.85?2:3;}
function draw(t){
  let coreS,e;
  if(t<0.2){coreS=0;e=1;}else if(t<0.5){coreS=(t-0.2)/0.3;e=1;}else if(t<0.85){coreS=1;e=1-(t-0.5)/0.35;}else{coreS=1;e=0;}
  ang+=state.spin/60;const tz=half+e*state.dist;
  faces.forEach(function(f){f.style.transform=f.dataset.r+" translateZ("+tz+"px)";});
  core.style.transform="scale("+coreS+")";
  box.style.transform="rotateX(-18deg) rotateY("+ang+"deg)";
  const p=phaseOf(t);
  steps.forEach(function(s,i){s.className=i<=p?"step on":"step";});
  cur.textContent=PHASE[p];
}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now){const t=(now/1000/state.dur)%1;draw(t);if(!reduce)requestAnimationFrame(frame);}
apply();if(reduce)draw(0.5);else requestAnimationFrame(frame);
addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
