<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>按压回弹演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #1a1a1a;
  }

  .btn {
    cursor: pointer; user-select: none; outline: none; border: none;
    background: var(--bg, #1a1a1a); color: var(--tc, #fff);
    font-size: var(--fs, 17px); font-weight: 700; letter-spacing: 3px;
    padding: 18px 56px; border-radius: var(--r, 14px);
    box-shadow: var(--sh, none);
    transition: box-shadow .25s ease;
  }

  .btn.down { transform: scale(var(--press, .88)); transition: transform .06s ease; }

  .btn.pop { animation: pressPop var(--dur, .3s) ease-out forwards; }
  @keyframes pressPop {
    0%   { transform: scale(var(--press, .88)); }
    55%  { transform: scale(var(--over, 1.05)); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
<button class="btn" id="btn">提交</button>

<script>

  const state = {
    press: 0.88, over: 1.05, dur: 0.3,
    radius: 14, fontSize: 17, bg: "#1a1a1a", color: "#ffffff",
    glow: false, glowColor: "#1a1a1a", text: "提交"
  };
  const btn = document.getElementById("btn");
  const root = document.documentElement;

  function apply() {
    const s = root.style;
    s.setProperty("--press", state.press);
    s.setProperty("--over", state.over);
    s.setProperty("--dur", state.dur + "s");
    s.setProperty("--r", state.radius + "px");
    s.setProperty("--fs", state.fontSize + "px");
    s.setProperty("--bg", state.bg);
    s.setProperty("--tc", state.color);

    s.setProperty("--sh", state.glow ? "0 12px 32px " + state.glowColor + "55" : "none");
    btn.textContent = state.text;
  }

  btn.addEventListener("pointerdown", () => {
    btn.classList.remove("pop");
    btn.classList.add("down");
  });
  btn.addEventListener("pointerup", () => {
    btn.classList.remove("down");
    btn.classList.add("pop");
    setTimeout(() => btn.classList.remove("pop"), state.dur * 1000 + 30);
  });
  btn.addEventListener("pointerleave", () => btn.classList.remove("down"));

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });
  apply();
</script>
</body>
</html>
