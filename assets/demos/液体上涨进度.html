<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>液体上涨进度演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #1a1a1a;
  }
  .container {
    position: relative; width: var(--w, 180px); height: var(--h, 180px);
    background: var(--bg, #f1f5f9); border-radius: var(--radius, 18px); overflow: hidden;
  }
  .liquid {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: var(--liquid, #3b82f6);
  }
  .wave {
    position: absolute; left: 0; top: 0; width: 200%; height: 100%;
    transform: translateY(-50%); animation: flow var(--waveSpeed, 2s) linear infinite;
  }
  .wave svg { width: 100%; height: 100%; display: block; }
  @keyframes flow { from { transform: translate(-50%, -50%); } to { transform: translate(-100%, -50%); } }
  .pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--pctColor, #1e3a8a); mix-blend-mode: normal; z-index: 2;
  }
  .btn {
    cursor: pointer; user-select: none; border: none; outline: none;
    background: #1a1a1a; color: #fff; font-size: 14px; font-weight: 700;
    padding: 9px 22px; border-radius: 8px;
  }
</style>
</head>
<body>
<div class="container" id="box">
  <div class="liquid" id="liquid"><div class="wave" id="wave"></div></div>
  <div class="pct" id="pct">0%</div>
</div>
<button class="btn" id="btn">重新上涨</button>

<script>
  const state = {
    dur: 3,
    level: 70,
    waveAmp: 5,
    waveSpeed: 2,
    radius: 18,
    w: 180,
    h: 180,
    liquid: "#3b82f6",
    bg: "#f1f5f9",
    showPct: true,
    pctColor: "#1e3a8a"
  };
  const box = document.getElementById("box");
  const liquid = document.getElementById("liquid");
  const wave = document.getElementById("wave");
  const pct = document.getElementById("pct");

  function buildWave() {
    const amp = Math.max(0, state.waveAmp);
    const hh = Math.max(amp * 2 + 8, 12);
    wave.style.height = hh + "px";
    let d = "M0," + (hh / 2 - amp * Math.sin(0));
    for (let x = 0; x <= 200; x += 4) {
      const y = hh / 2 - amp * Math.sin((x / 200) * Math.PI * 2);
      d += " L" + x + "," + y;
    }
    d += " L200," + hh + " L0," + hh + " Z";
    wave.innerHTML = '<svg viewBox="0 0 200 ' + hh + '" preserveAspectRatio="none"><path d="' + d + '" fill="' + state.liquid + '"/></svg>';
  }

  function applyStyle() {
    const root = document.documentElement;
    root.style.setProperty("--w", state.w + "px");
    root.style.setProperty("--h", state.h + "px");
    root.style.setProperty("--radius", state.radius + "px");
    root.style.setProperty("--liquid", state.liquid);
    root.style.setProperty("--bg", state.bg);
    root.style.setProperty("--waveSpeed", state.waveSpeed + "s");
    root.style.setProperty("--pctColor", state.pctColor);
    liquid.style.background = state.liquid;
    pct.style.display = state.showPct ? "flex" : "none";
    buildWave();
  }

  let raf = 0;
  function run() {
    cancelAnimationFrame(raf);
    applyStyle();
    const start = performance.now();
    const dur = Math.max(state.dur, 0.3) * 1000;
    const target = Math.min(100, Math.max(0, state.level)) / 100;
    function tick(now) {
      const t = Math.min((now - start) / dur, 1);
      const e = 1 - Math.pow(1 - t, 3);
      liquid.style.height = (e * target * 100) + "%";
      pct.textContent = Math.round(e * target * 100) + "%";
      if (t < 1) raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
  }

  document.getElementById("btn").addEventListener("click", run);
  applyStyle();
  run();

  window.addEventListener("message", (e) => {
    const d = e.data; if (!d || d.type !== "param") return;
    state[d.key] = d.value; applyStyle();
    if (["dur","level","waveAmp","waveSpeed","radius","w","h","liquid","bg","showPct","pctColor"].includes(d.key)) run();
  });
</script>
</body>
</html>
