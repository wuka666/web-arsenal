<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手势方向锁定</title>
<style>
:root{--bg:#f2f2f7;--card:#ffffff;--ink:#1c1c1e;--accent:#007aff;--radius:16px;--imgH:260px;--dur:0.35s;--thr:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.stage{width:min(92vw,340px);background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12);position:relative;touch-action:none}
.img{height:calc(var(--imgH) * 1px);background:linear-gradient(135deg,var(--accent),#8e8e93 70%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:800;transition:transform calc(var(--dur) * 1s) ease}
.bar{padding:12px 14px;font-size:13px;display:flex;justify-content:space-between}
.hint{font-size:12px;opacity:.6}
</style>
</head>
<body>
<div class="stage" id="st"><div class="img" id="im">1 / 4</div><div class="bar"><span id="lb">横向拖动翻页</span><span class="hint" id="ax">方向：—</span></div></div>
<script>
var state={bg:"#f2f2f7",card:"#ffffff",ink:"#1c1c1e",accent:"#007aff",radius:16,imgH:260,dur:0.35,thr:12};
var r=document.documentElement.style;
function apply(){r.setProperty('--bg',state.bg);r.setProperty('--card',state.card);r.setProperty('--ink',state.ink);r.setProperty('--accent',state.accent);r.setProperty('--radius',state.radius+'px');r.setProperty('--imgH',state.imgH+'px');r.setProperty('--dur',state.dur+'s');r.setProperty('--thr',state.thr+'px');}
apply();
var st=document.getElementById("st"),im=document.getElementById("im"),ax=document.getElementById("ax"),lb=document.getElementById("lb");var i=1,locked=null,x0=0,y0=0,dx=0,dy=0,dragging=false;
function setImg(){im.textContent=i+" / 4";im.style.transform="translateX(0) scale(1)";}
st.addEventListener("pointerdown",function(e){dragging=true;locked=null;x0=e.clientX;y0=e.clientY;dx=0;dy=0;ax.textContent="方向：判定中";st.setPointerCapture(e.pointerId);});
st.addEventListener("pointermove",function(e){if(!dragging)return;dx=e.clientX-x0;dy=e.clientY-y0;
if(locked===null){if(Math.abs(dx)>state.thr||Math.abs(dy)>state.thr){locked=Math.abs(dx)>Math.abs(dy)?"横":"纵";ax.textContent="方向："+locked;}}
if(locked==="横"){im.style.transition="none";im.style.transform="translateX("+(dx*0.6)+"px)";}
else if(locked==="纵"){im.style.transition="none";im.style.transform="translateY("+Math.max(0,dy*0.5)+"px) scale("+(1-Math.min(.25,Math.abs(dy)/800))+")";}});
function end(){if(!dragging)return;dragging=false;im.style.transition="transform calc(var(--dur) * 1s) ease";
if(locked==="横"){if(Math.abs(dx)>80&&i<4){i++;lb.textContent="已翻到 "+i;}else if(Math.abs(dx)>80&&i>1){i--;lb.textContent="已翻到 "+i;}}
else if(locked==="纵"){if(dy>120){lb.textContent="下拉关闭（已触发）";}}
setImg();}
st.addEventListener("pointerup",end);st.addEventListener("pointercancel",end);
setInterval(function(){if(locked===null){ax.textContent="方向：待手势";}},1200);
setTimeout(function(){ax.textContent="方向：横（自动演示）";i=2;setImg();lb.textContent="已翻到 2";},900);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
