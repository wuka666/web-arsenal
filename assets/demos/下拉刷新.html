<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下拉刷新</title>
<style>
:root{
  --pullMax:90; --triggerDist:60; --spinSize:34; --spinColor:#007aff;
  --spinSpeed:0.8; --listBg:#f5f5f7; --rowColor:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--listBg);display:flex;justify-content:center;min-height:100vh}
.phone{width:340px;max-width:100%;height:100vh;max-height:680px;background:var(--listBg);overflow:hidden;position:relative;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.12);display:flex;flex-direction:column}
.top{flex:0 0 auto;height:46px;position:relative}
.spin{position:absolute;top:8px;left:50%;margin-left:calc(var(--spinSize)*-0.5px);width:calc(var(--spinSize)*1px);height:calc(var(--spinSize)*1px);border:3px solid rgba(0,0,0,.12);border-top-color:var(--spinColor);border-radius:50%;opacity:0;transform:scale(.6)}
.scroller{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .25s ease;will-change:transform}
.list{padding:10px;display:flex;flex-direction:column;gap:10px}
.row{background:var(--rowColor);border-radius:12px;padding:14px 16px;font-size:15px;color:#222;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.hint{text-align:center;color:#999;font-size:13px;padding:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="phone">
  <div class="top"><div class="spin" id="spin"></div></div>
  <div class="scroller" id="sc"><div class="list" id="list"></div><div class="hint" id="hint">下拉刷新</div></div>
</div>
<script>
var state={pullMax:90,triggerDist:60,spinSize:34,spinColor:"#007aff",spinSpeed:0.8,listBg:"#f5f5f7",rowColor:"#ffffff"};
var UNIT={pullMax:"px",triggerDist:"px",spinSize:"px",spinSpeed:"s"};
var root=document.documentElement;
function apply(){for(var k in state){root.style.setProperty("--"+k,state[k]+(UNIT[k]||""));}}
apply();
var sc=document.getElementById("sc"),spin=document.getElementById("spin"),list=document.getElementById("list"),hint=document.getElementById("hint");
for(var i=0;i<12;i++){var d=document.createElement("div");d.className="row";d.textContent="列表项 "+(i+1);list.appendChild(d);}
var pulling=false,startY=0,pull=0,refreshing=false;
function setPull(p){pull=p;sc.style.transform="translateY("+p+"px)";var r=Math.min(1,p/state.pullMax);spin.style.opacity=r;spin.style.transform="scale("+(0.6+0.4*r)+") rotate("+(p*3)+"deg)";hint.textContent=p>=state.triggerDist?"松开刷新":"下拉刷新";}
function start(y){if(sc.scrollTop<=0&&!refreshing){pulling=true;startY=y;}}
function move(y){if(pulling){var dy=y-startY;if(dy>0)setPull(Math.min(dy,state.pullMax));}}
function end(){if(pulling){pulling=false;if(pull>=state.triggerDist)doRefresh();else setPull(0);}}
sc.addEventListener("touchstart",function(e){start(e.touches[0].clientY);},{passive:true});
sc.addEventListener("touchmove",function(e){move(e.touches[0].clientY);},{passive:true});
sc.addEventListener("touchend",end);
sc.addEventListener("mousedown",function(e){start(e.clientY);});
window.addEventListener("mousemove",function(e){move(e.clientY);});
window.addEventListener("mouseup",end);
function doRefresh(){refreshing=true;setPull(state.triggerDist);spin.style.animation="spin "+state.spinSpeed+"s linear infinite";hint.textContent="刷新中…";setTimeout(function(){spin.style.animation="";setPull(0);refreshing=false;hint.textContent="已更新 · 下拉刷新";},1200);}
setInterval(function(){if(!refreshing&&!pulling&&sc.scrollTop<=0)doRefresh();},3800);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
