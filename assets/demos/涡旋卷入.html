<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>涡旋卷入演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0e1116; }
  canvas { display: block; width: min(520px, 94vw); height: min(520px, 88vh); border-radius: 16px; }

</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
  const state = { count: 320, spin: 0.05, pull: 0.6, core: 8, size: 2.4, color: "#ffb24d", bg: "#0e1116" };
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, ps = [];
  function resize() { W = canvas.width = canvas.clientWidth * devicePixelRatio; H = canvas.height = canvas.clientHeight * devicePixelRatio; }
  function build() {
    ps = [];
    for (let i = 0; i < state.count; i++) {
      const ang = Math.random() * 7, r = (40 + Math.random() * Math.min(W, H) * 0.45) * devicePixelRatio;
      ps.push({ a: ang, r: r });
    }
  }
  function apply() { resize(); build(); document.body.style.background = state.bg; }
  function frame() {
    ctx.fillStyle = state.bg; ctx.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    ctx.fillStyle = state.color;
    for (const p of ps) {
      p.a += state.spin;
      p.r -= state.pull * devicePixelRatio * (1 - p.r / (Math.min(W, H) * 0.45 * devicePixelRatio));
      if (p.r < state.core * devicePixelRatio) { p.r = (40 + Math.random() * Math.min(W, H) * 0.45) * devicePixelRatio; p.a = Math.random() * 7; }
      const x = cx + Math.cos(p.a) * p.r;
      const y = cy + Math.sin(p.a) * p.r;
      const size = Math.max(0.6, (p.r / (Math.min(W, H) * 0.45)) * state.size) * devicePixelRatio;
      ctx.beginPath(); ctx.arc(x, y, size, 0, 7); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener("message", e => { const d = e.data; if (!d || d.type !== "param") return; state[d.key] = d.value; apply(); });
  apply(); frame();
</script>
</body>
</html>
