<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二级下拉导航演示</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --theme:#2563eb; --bg:#ffffff; --text:#1f2937; --hover:#eff6ff; --subBg:#ffffff; --dur:.2s; --fs:15px; --radius:10px; --shadow:.14; }
  body { font-family:system-ui,"Microsoft YaHei",sans-serif; background:#f5f6f8; color:var(--text); }
  #nav { display:flex; align-items:center; gap:4px; padding:14px 26px; background:var(--bg); box-shadow:0 2px 10px rgba(0,0,0,.05); position:relative; z-index:20; }
  .brand { font-weight:800; color:var(--theme); margin-right:18px; }
  .top { position:relative; }
  .top>.label { padding:9px 14px; border-radius:10px; font-size:var(--fs); cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:background .15s,color .15s; }
  .top:hover>.label { background:var(--hover); color:var(--theme); }
  .top .caret { transition:transform var(--dur) ease; }
  .top:hover .caret { transform:rotate(180deg); }
  .sub { position:absolute; top:calc(100% + 8px); left:0; min-width:200px; background:var(--subBg); border:1px solid #e5e7eb; border-radius:var(--radius); box-shadow:0 12px 30px rgba(0,0,0,var(--shadow)); padding:6px; opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity var(--dur) ease,transform var(--dur) ease; }
  .top:hover .sub { opacity:1; transform:translateY(0); pointer-events:auto; }
  .sub .sitem { padding:9px 12px; border-radius:8px; font-size:var(--fs); cursor:pointer; }
  .sub .sitem:hover { background:var(--hover); color:var(--theme); }
  .content { padding:50px 26px; max-width:880px; margin:0 auto; }
  .content h1 { color:#111827; margin-bottom:10px; }
  .content p { color:#6b7280; line-height:1.9; }
</style>
</head>
<body>
  <nav id="nav"><div class="brand">站点</div><div id="tops"></div></nav>
  <div class="content"><h1>二级下拉导航</h1><p>主导航项悬停弹出子菜单，适合在主导航下挂大量子分类，兼顾空间利用率与层级收纳。把鼠标移到主导航项上看子菜单展开。</p></div>
<script>
  const CARET='<svg class="caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>';
  const state = {
    theme:"#2563eb", bg:"#ffffff", text:"#1f2937", hover:"#eff6ff", subBg:"#ffffff",
    dur:0.2, fontSize:15, radius:10, shadow:0.14, arrow:true,
    topItems:"产品,解决方案,资源,关于", subItems:"设计工具,开发套件,素材市场,模板"
  };
  const topsEl=document.getElementById("tops");
  function apply(){
    const R=document.documentElement.style;
    R.setProperty("--theme",state.theme); R.setProperty("--bg",state.bg); R.setProperty("--text",state.text);
    R.setProperty("--hover",state.hover); R.setProperty("--subBg",state.subBg);
    R.setProperty("--dur",state.dur+"s"); R.setProperty("--fs",state.fontSize+"px"); R.setProperty("--radius",state.radius+"px"); R.setProperty("--shadow",state.shadow);
    const tops=state.topItems.split(","), subs=state.subItems.split(",");
    topsEl.innerHTML="";
    tops.forEach((t,i)=>{
      const d=document.createElement("div"); d.className="top";
      const sub=subs[i]||"";
      d.innerHTML='<span class="label">'+t+(state.arrow?' '+CARET:'')+'</span>'+
        (sub?'<div class="sub">'+sub.split(",").map(s=>'<div class="sitem">'+s+'</div>').join('')+'</div>':'');
      topsEl.appendChild(d);
    });
  }
  window.addEventListener("message", e=>{ const d=e.data; if(!d||d.type!=="param")return; state[d.key]=d.value; apply(); });
  apply();
</script>
</body>
</html>
