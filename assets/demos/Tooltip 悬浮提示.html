<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tooltip 悬浮提示</title>
<style>
:root{--bg:#f8fafc;--ink:#0f172a;--tipBg:#0f172a;--tipInk:#ffffff;--radius:6px;--pad:8px;--fs:13px;--offset:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.row{display:flex;gap:14px;align-items:center}
.btn{position:relative;padding:10px 14px;border:1px solid #cbd5e1;background:#fff;border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--ink)}
.btn:focus{outline:2px solid #38bdf8}
.tip{position:absolute;left:50%;bottom:calc(100% + var(--offset));transform:translateX(-50%) translateY(4px);background:var(--tipBg);color:var(--tipInk);padding:var(--pad) calc(var(--pad) * 1.4);border-radius:var(--radius);font-size:calc(var(--fs) * 1px);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--tipBg)}
.btn.on .tip{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<style>
/* 合规补齐：宪法附录B B1 —— 移动端可点元素命中区须 ≥44（WCAG 判命中区不判视觉尺寸，故用 min 尺寸撑开，视觉不变） */
.btn{min-width:44px;min-height:44px}
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
var state={bg:"#f8fafc",ink:"#0f172a",tipBg:"#0f172a",tipInk:"#ffffff",radius:6,pad:8,fs:13,offset:8};
var r=document.documentElement.style;
function apply(){r.setProperty('--bg',state.bg);r.setProperty('--ink',state.ink);r.setProperty('--tipBg',state.tipBg);r.setProperty('--tipInk',state.tipInk);r.setProperty('--radius',state.radius+'px');r.setProperty('--pad',state.pad+'px');r.setProperty('--fs',state.fs+'px');r.setProperty('--offset',state.offset+'px');}
apply();
var row=document.getElementById("row");
var items=[["保存","把当前编辑存到云端"],["分享","生成一个只读链接"],["删除","移除后不可恢复"]];
items.forEach(function(it){var b=document.createElement("button");b.className="btn";b.innerHTML=it[0]+'<span class="tip">'+it[1]+'</span>';
b.addEventListener("mouseenter",function(){b.classList.add("on");});
b.addEventListener("mouseleave",function(){b.classList.remove("on");});
b.addEventListener("focus",function(){b.classList.add("on");});
b.addEventListener("blur",function(){b.classList.remove("on");});
row.appendChild(b);});
setTimeout(function(){var b=row.children[1];if(b)b.classList.add("on");},300);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
