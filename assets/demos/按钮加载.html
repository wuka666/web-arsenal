<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>按钮加载演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #1a1a1a;
  }

  .btn {
    position: relative; cursor: pointer; user-select: none; border: none; outline: none;
    background: var(--color, #1a1a1a); color: var(--txtColor, #fff);
    font-size: var(--fontSize, 16px); font-weight: 700; letter-spacing: var(--letter, 2px);
    min-width: var(--minW, 180px); height: var(--height, 48px);
    border-radius: var(--radius, 12px);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background .2s ease, opacity .2s ease;
  }
  .btn:active:not(.loading) { transform: scale(.97); }
  .btn.loading { opacity: .75; cursor: default; pointer-events: none; }
  .spinner {
    display: none; width: var(--sSize, 16px); height: var(--sSize, 16px); border-radius: 50%;
    border: var(--sThick, 2px) solid var(--sTrack, rgba(255,255,255,.35));
    border-top-color: var(--sHead, #fff);
    animation: spin var(--dur, .9s) linear infinite;
  }
  .btn.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<button class="btn" id="btn">
  <span class="spinner"></span>
  <span class="txt" id="txt">提交</span>
</button>

<script>

  const state = {
    dur: 0.9,
    wait: 1.8,
    label: "提交",
    loadingLabel: "处理中",
    doneLabel: "已提交 ✓",
    radius: 12,
    height: 48,
    minW: 180,
    fontSize: 16,
    letter: 2,
    sSize: 16,
    sThick: 2,
    color: "#1a1a1a",
    txtColor: "#ffffff",
    sTrack: "rgba(255,255,255,.35)",
    sHead: "#ffffff"
  };
  const btn = document.getElementById("btn");
  const txt = document.getElementById("txt");

  function apply() {
    const root = document.documentElement;
    root.style.setProperty("--dur", state.dur + "s");
    root.style.setProperty("--color", state.color);
    root.style.setProperty("--txtColor", state.txtColor);
    root.style.setProperty("--radius", state.radius + "px");
    root.style.setProperty("--height", state.height + "px");
    root.style.setProperty("--minW", state.minW + "px");
    root.style.setProperty("--fontSize", state.fontSize + "px");
    root.style.setProperty("--letter", state.letter + "px");
    root.style.setProperty("--sSize", state.sSize + "px");
    root.style.setProperty("--sThick", state.sThick + "px");
    root.style.setProperty("--sTrack", state.sTrack);
    root.style.setProperty("--sHead", state.sHead);
    if (!btn.classList.contains("loading")) txt.textContent = state.label;
  }

  btn.addEventListener("click", () => {
    if (btn.classList.contains("loading")) return;
    btn.classList.add("loading");
    txt.textContent = state.loadingLabel;
    setTimeout(() => {
      txt.textContent = state.doneLabel;
      setTimeout(() => {
        btn.classList.remove("loading");
        txt.textContent = state.label;
      }, 900);
    }, state.wait * 1000);
  });

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });
  apply();
</script>
</body>
</html>
