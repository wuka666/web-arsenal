<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>档位吸附演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #1a1a1a;
    overflow: hidden;
  }
  .hint { font-size: 13px; color: #999; }
  .btn {
    cursor: pointer; user-select: none; border: none; outline: none;
    background: #1a1a1a; color: #fff; font-size: 15px; font-weight: 700;
    padding: 12px 28px; border-radius: 10px;
  }
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0); pointer-events: none;
    transition: background .3s ease;
  }
  .mask.show { background: var(--maskbg, rgba(0,0,0,.3)); pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: var(--h, 35vh); border-radius: var(--radius, 20px) var(--radius, 20px) 0 0;
    background: var(--sheet, #fff); box-shadow: 0 -8px 30px rgba(0,0,0,var(--shadow, .12));
    transform: translateY(105%);
    transition: height var(--dur, .28s) cubic-bezier(.32,.72,0,1), transform var(--dur, .28s) cubic-bezier(.32,.72,0,1);
  }
  .sheet.show { transform: translateY(0); }
  .sheet.dragging { transition: none; }
  .grab { padding: 14px 0 6px; cursor: grab; touch-action: none; user-select: none; }
  .grab:active { cursor: grabbing; }
  .handle { width: 40px; height: 4px; border-radius: 4px; background: var(--handlec, #ddd); margin: 0 auto; }
  .sheet-title { text-align: center; font-weight: 800; margin-top: 10px; }
  .mark { text-align: center; font-size: 12px; color: var(--markc, #999); margin-top: 6px; }
</style>
</head>
<body>
<button class="btn" id="open">打开弹层</button>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab" id="grab"><div class="handle"></div></div>
  <div class="sheet-title">拖我上下走</div>
  <p class="mark" id="mark">当前档位：35%</p>
</div>
<p class="hint">按住抓手上下拖：松手自动吸附最近档位</p>
<script>
  // 默认参数（父页面详情页可调）
  const state = {
    dur: 0.28,         // 吸附动画时长（秒）
    snap: 3,           // 档位数量（2~5）
    magnet: 1,         // 磁吸范围（0-1，越接近 1 越远也能吸）
    marks: true,       // 显示档位标签
    sheetH: 35,        // 初始档位高度（vh，取最近档位）
    radius: 20,        // 顶部圆角（px）
    minH: 120,         // 最小可拖高度（px）
    mask: 0.3,         // 遮罩浓度
    maskColor: "#000000",  // 遮罩颜色
    sheetBg: "#ffffff",    // 弹层底色
    handleColor: "#dddddd",// 手柄颜色
    markColor: "#999999"   // 档位标签颜色
  };
  const mask = document.getElementById("mask");
  const sheet = document.getElementById("sheet");
  const grab = document.getElementById("grab");
  const mark = document.getElementById("mark");

  // 十六进制转 rgba
  function rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
  }
  // 根据档位数量生成档位表（均分 0~100%）
  const snaps = () => {
    const n = Math.max(2, Math.round(state.snap));
    return Array.from({ length: n }, (_, i) => (i + 1) / n);
  };

  function apply() {
    const R = document.documentElement.style;
    R.setProperty("--dur", state.dur + "s");
    R.setProperty("--h", nearest(state.sheetH / 100) * 100 + "vh"); // 初始高度吸附到最近档位
    R.setProperty("--radius", state.radius + "px");
    R.setProperty("--maskbg", rgba(state.maskColor, state.mask));
    R.setProperty("--sheet", state.sheetBg);
    R.setProperty("--handlec", state.handleColor);
    R.setProperty("--markc", state.markColor);
    mark.style.display = state.marks ? "block" : "none";
    // 拖拽逻辑参数：档位数量先归一（经 nearest() 生效），磁吸范围/最小高度在松手与拖动时读 state
    state.snap = Math.max(2, Math.round(+state.snap));
    state.magnet = +state.magnet;
    state.minH = +state.minH;
    if (state.marks) mark.textContent = "当前档位：" + Math.round(nearest(parseFloat(sheet.style.height || state.sheetH + "vh") / innerHeight) * 100) + "%";
  }
  // 找最近档位
  function nearest(cur) {
    let best = snaps()[0];
    snaps().forEach(s => { if (Math.abs(s - cur) < Math.abs(best - cur)) best = s; });
    return best;
  }

  let startY = 0, dragging = false;
  const vh = () => window.innerHeight;

  grab.addEventListener("pointerdown", (e) => {
    dragging = true;
    startY = e.clientY;
    grab.setPointerCapture(e.pointerId);
    sheet.classList.add("dragging");
  });
  grab.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dy = e.clientY - startY;
    const h = Math.max(state.minH, vh() - dy);
    sheet.style.height = h + "px";
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove("dragging");
    // 松手：距离最近档位在磁吸范围内 → 吸附；否则停在原地
    const cur = parseFloat(sheet.style.height || sheet.offsetHeight) / vh();
    const best = nearest(cur);
    if (Math.abs(best - cur) <= state.magnet) {
      sheet.style.height = (best * 100) + "vh";
      if (state.marks) mark.textContent = "当前档位：" + Math.round(best * 100) + "%";
    }
  }
  grab.addEventListener("pointerup", endDrag);
  grab.addEventListener("pointercancel", endDrag);

  function open() { sheet.classList.add("show"); mask.classList.add("show"); }
  function close() { sheet.classList.remove("show"); mask.classList.remove("show"); }
  document.getElementById("open").addEventListener("click", open);
  mask.addEventListener("click", close);

  // 接收父页面（index.html 详情页）传来的参数
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });
  apply();
</script>
</body>
</html>
