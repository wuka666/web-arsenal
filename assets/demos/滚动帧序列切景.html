<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>滚动帧序列切景</title>
<style>
:root{
  --bg:#0b0e14;
  --fg:#e8eefc;
  --accent:#7ee7ff;
  --hue:200;
  --scene:0;
  --speed:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,"PingFang SC",sans-serif;overflow-x:hidden}
.stage{position:sticky;top:0;height:100vh;width:100vw;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:rgba(10,12,18,.7);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:9px 16px;font-size:13px;letter-spacing:.02em;
  backdrop-filter:blur(8px);white-space:nowrap}
.hud b{color:var(--accent)}
.tip{position:fixed;left:50%;top:22px;transform:translateX(-50%);
  font-size:12px;opacity:.55;text-align:center}
.scroller{height:600vh}
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv"></canvas>
  <div class="tip">向下滚动＝逐帧推进场景（滚动驱动帧序列）</div>
  <div class="hud">场景 <b id="sName">日出</b> · 帧 <b id="fNo">0</b>/<b id="fTot">60</b></div>
</div>
<div class="scroller"></div>
<script>
// 全部参数集中于此，与上方 :root 一一对应（键=CSS 变量名）
var state={bg:'#0b0e14',fg:'#e8eefc',accent:'#7ee7ff',hue:200,scene:'日出',speed:1};
var FRAMES=60;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var sName=document.getElementById('sName'), fNo=document.getElementById('fNo'), fTot=document.getElementById('fTot');
fTot.textContent=FRAMES;
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize); resize();
function hsl(h,s,l,a){return 'hsla('+h+','+s+'%,'+l+'%,'+(a==null?1:a)+')';}
// 按滚动进度 t(0~1) 绘制当前帧对应的场景；场景随帧连续变化，形成"电影分镜式"逐帧切景
function drawScene(t){
  var W=innerWidth,H=innerHeight;
  ctx.clearRect(0,0,W,H);
  var sc=state.scene;
  if(sc==='日出'){
    var top=hsl(state.hue,40,Math.round(8+34*t));      // 夜→昼 天顶渐亮
    var bot=hsl((state.hue+30)%360,55,Math.round(20+30*t));
    var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,top); g.addColorStop(1,bot);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    var sy=H*(1-0.08-t*0.84), r=Math.max(40,W*0.07);   // 太阳从地平线升到顶
    ctx.fillStyle=state.accent; ctx.globalAlpha=0.9;
    ctx.beginPath(); ctx.arc(W/2,sy,r,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle=hsl(state.hue,30,Math.round(6+10*t)); ctx.fillRect(0,H*0.82,W,H*0.18);
  } else if(sc==='星轨'){
    ctx.fillStyle=state.bg; ctx.fillRect(0,0,W,H);
    var cx=W/2,cy=H/2, ang=t*Math.PI*2;
    for(var i=0;i<120;i++){
      var rr=(i/120)*(Math.min(W,H)*0.45), a0=i*0.7;
      ctx.strokeStyle=hsl(state.hue,70,60,0.5); ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(cx,cy,rr,a0,a0+ang); ctx.stroke();
    }
    ctx.fillStyle=state.accent; ctx.beginPath(); ctx.arc(cx,cy,6,0,7); ctx.fill();
  } else { // 海浪
    var g2=ctx.createLinearGradient(0,0,0,H);
    g2.addColorStop(0,hsl(state.hue,40,12)); g2.addColorStop(1,hsl(state.hue,45,22));
    ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
    for(var k=0;k<4;k++){
      ctx.beginPath(); ctx.moveTo(0,H);
      for(var x=0;x<=W;x+=8){
        var y=H*0.55+k*18+Math.sin(x*0.02+t*Math.PI*2+k)*18*(1-k*0.12);
        ctx.lineTo(x,y);
      }
      ctx.lineTo(W,H); ctx.closePath();
      ctx.fillStyle=hsl(state.hue+k*10,60,40+k*8,0.25+k*0.12); ctx.fill();
    }
  }
}
var auto=true, vp=0, dir=1, lastScroll=0;
function apply(){
  var t;
  if(auto){ t=vp; }
  else {
    var max=document.body.scrollHeight-innerHeight;
    t=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
  }
  var frame=Math.floor(t*FRAMES);
  drawScene(t);
  fNo.textContent=frame; sName.textContent=state.scene;
}
addEventListener('scroll',function(){
  if(performance.now()-lastScroll>400){ auto=false; }   // 真人滚动后切到滚动驱动
  lastScroll=performance.now(); apply();
},{passive:true});
function loop(){
  if(auto){ vp+=0.004*state.speed*dir; if(vp>=1){vp=1;dir=-1;} if(vp<=0){vp=0;dir=1;} apply(); }
  requestAnimationFrame(loop);
}
loop();
// 外部调参契约：只接受 type==='param' 且 key 在 state 内的消息
window.addEventListener('message',function(e){
  var d=e.data;
  if(!d||d.type!=='param')return;
  if(!(d.key in state))return;
  state[d.key]=d.value; apply();
});
apply();
</script>
</body>
</html>
