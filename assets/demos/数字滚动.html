<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字滚动演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #1a1a1a;
  }
  .hint { font-size: 13px; color: #999; }
  .num { font-size: var(--fs, 56px); font-weight: 800; font-variant-numeric: tabular-nums; min-width: 200px; text-align: center; color: var(--nc, #1a1a1a); }
  .btn {
    cursor: pointer; user-select: none; border: none; outline: none;
    background: var(--bb, #1a1a1a); color: var(--bc, #fff);
    font-size: 15px; font-weight: 700; letter-spacing: 2px;
    padding: 12px 32px; border-radius: 10px;
  }
</style>
</head>
<body>
<div class="num" id="num">0</div>
<button class="btn" id="btn">重新滚动</button>
<p class="hint">数字从 0 滚到目标，最后缓慢停下——不是突然刹停</p>
<script>
  // 默认参数（父页面详情页可调）
  const state = {
    target: 8848, dur: 1.6, easing: "先快后慢", prefix: "",
    fontSize: 56, numColor: "#1a1a1a", btnBg: "#1a1a1a", btnColor: "#ffffff"
  };
  const num = document.getElementById("num");
  const root = document.documentElement;
  let raf = 0;

  // 三种停法：先快后慢 / 匀速 / 回弹过头
  const EASE = {
    "先快后慢": t => 1 - Math.pow(1 - t, 5),
    "匀速": t => t,
    "回弹过头": t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  };

  function roll() {
    cancelAnimationFrame(raf);
    const start = performance.now();
    const from = 0, to = state.target, dur = state.dur * 1000;
    const ease = EASE[state.easing] || EASE["先快后慢"];
    function tick(now) {
      const t = Math.min((now - start) / dur, 1);
      num.textContent = state.prefix + Math.round(from + (to - from) * ease(t));
      if (t < 1) raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
  }

  function apply() {
    const s = root.style;
    s.setProperty("--fs", state.fontSize + "px");
    s.setProperty("--nc", state.numColor);
    s.setProperty("--bb", state.btnBg);
    s.setProperty("--bc", state.btnColor);
    roll(); // 数字相关参数变了就重滚一遍，立刻看到效果
  }

  document.getElementById("btn").addEventListener("click", roll);
  roll();

  // 接收父页面（index.html 详情页）传来的参数
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });
</script>
</body>
</html>
