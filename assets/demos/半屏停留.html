<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>半屏停留演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #1a1a1a;
    overflow: hidden;
  }

  .btn {
    cursor: pointer; user-select: none; border: none; outline: none;
    background: #1a1a1a; color: #fff; font-size: 15px; font-weight: 700;
    padding: 12px 28px; border-radius: 10px;
  }

  .bg { position: fixed; inset: 0; padding: 60px 40px; }
  .bg-card {
    background: #f5f5f5; border-radius: 16px; padding: 24px;
    max-width: 320px; margin: 0 auto;
  }
  .bg-card h3 { font-size: 16px; margin-bottom: 10px; }
  .bg-card p { font-size: 13px; color: #666; line-height: 1.7; }
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0); pointer-events: none;
    transition: background .3s ease;
  }
  .mask.show { background: var(--maskbg, rgba(0,0,0,.25)); pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: var(--h, 50vh); border-radius: var(--radius, 20px) var(--radius, 20px) 0 0;
    background: var(--sheet, #fff); box-shadow: 0 -8px 30px rgba(0,0,0,var(--shadow, .12));
    transform: translateY(105%); transition: transform var(--dur, .35s) cubic-bezier(.32,.72,0,1);
  }
  .sheet.show { transform: translateY(0); }
  .handle { width: 40px; height: 4px; border-radius: 4px; background: var(--handlec, #ddd); margin: 10px auto 0; }
  .sheet-title { text-align: center; font-weight: 800; margin-top: 12px; color: var(--titlec, #1a1a1a); }
</style>
</head>
<body>
<div class="bg">
  <div class="bg-card">
    <h3>底层页面</h3>
    <p>弹层只盖住一半，底下的内容始终露着——用户知道自己在哪层，层级感不丢。</p>
  </div>
</div>
<button class="btn" id="open">打开半屏弹层</button>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="handle" id="handle"></div>
  <div class="sheet-title">半屏停留</div>
  <p style="text-align:center;font-size:13px;color:#666;margin-top:8px">重点保留底层可见区域</p>
</div>

<script>

  const state = {
    height: 50,
    mask: 0.25,
    dur: 0.35,
    radius: 20,
    shadow: 0.12,
    handle: true,
    maskColor: "#000000",
    sheetBg: "#ffffff",
    handleColor: "#dddddd",
    titleColor: "#1a1a1a"
  };
  const mask = document.getElementById("mask");
  const sheet = document.getElementById("sheet");
  const handle = document.getElementById("handle");

  function rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
  }

  function apply() {
    const R = document.documentElement.style;
    R.setProperty("--h", state.height + "vh");
    R.setProperty("--dur", state.dur + "s");
    R.setProperty("--radius", state.radius + "px");
    R.setProperty("--shadow", state.shadow);
    R.setProperty("--maskbg", rgba(state.maskColor, state.mask));
    R.setProperty("--sheet", state.sheetBg);
    R.setProperty("--handlec", state.handleColor);
    R.setProperty("--titlec", state.titleColor);
    handle.style.display = state.handle ? "block" : "none";
  }

  function open() { sheet.classList.add("show"); mask.classList.add("show"); }
  function close() { sheet.classList.remove("show"); mask.classList.remove("show"); }
  document.getElementById("open").addEventListener("click", open);
  mask.addEventListener("click", close);

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });
  apply();
</script>
</body>
</html>
