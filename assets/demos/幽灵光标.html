<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幽灵光标</title>
<style>
:root{--c:#7fe9d0;--bg:#070a12;--count:14;--sp:0.35;--size:14;--op:0.85}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const state={"c":"#7fe9d0","bg":"#070a12","count":14,"sp":0.35,"size":14,"op":0.85};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }

}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
const g=[];for(let i=0;i<state.count;i++)g.push({x:mx,y:my});
function loop(){for(let i=0;i<g.length;i++){g[i].x+=( (i===0?mx:g[i-1].x) -g[i].x)*state.sp;g[i].y+=( (i===0?my:g[i-1].y) -g[i].y)*state.sp;}
 ctx.fillStyle=state.bg;ctx.fillRect(0,0,W,H);for(let i=0;i<g.length;i++){ctx.globalAlpha=(1-i/g.length)*state.op;ctx.fillStyle=state.c;ctx.beginPath();ctx.arc(g[i].x,g[i].y,state.size*(1-i/g.length*0.5),0,7);ctx.fill();}requestAnimationFrame(loop);}loop();
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
