<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>局部剖开</title>
<style>
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0b1020);font-family:system-ui,"Segoe UI",Arial,sans-serif}
:root{--bg:#0b1020;--shell:#2b6cb0;--inner:#ffce5a;--door:#7aa7ff;--open:115;--dur:6;--radius:10}
.scene{width:200px;height:200px;transform-style:preserve-3d;transform:perspective(900px) rotateX(-12deg) rotateY(-22deg)}
.box{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:calc(var(--radius)*1px);background:color-mix(in srgb,var(--shell) 82%,transparent);border:1px solid rgba(255,255,255,.25)}
.door{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:calc(var(--radius)*1px);background:var(--door,#7aa7ff);border:1px solid rgba(255,255,255,.4);transform-origin:left center}
.module{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:8px;background:var(--inner,#ffce5a);box-shadow:0 0 26px var(--inner,#ffce5a)}
</style>
</head>
<body>
<div class="scene"><div class="box" id="box">
<div class="face" style="transform:rotateY(180deg) translateZ(60px)"></div>
<div class="face" style="transform:rotateY(90deg) translateZ(60px)"></div>
<div class="face" style="transform:rotateY(-90deg) translateZ(60px)"></div>
<div class="face" style="transform:rotateX(90deg) translateZ(60px)"></div>
<div class="face" style="transform:rotateX(-90deg) translateZ(60px)"></div>
<div class="module" id="module"></div>
<div class="door" id="door" style="transform:translateZ(60px)"></div>
</div></div>
<script>
const state={"bg":"#0b1020","shell":"#2b6cb0","inner":"#ffce5a","door":"#7aa7ff","open":115,"dur":6,"radius":10};
function apply(){const r=document.documentElement.style;r.setProperty("--bg",state.bg);r.setProperty("--shell",state.shell);r.setProperty("--inner",state.inner);r.setProperty("--door",state.door);r.setProperty("--open",state.open);r.setProperty("--dur",state.dur);r.setProperty("--radius",state.radius);}
const door=document.getElementById("door");
function draw(t){const o=t<0.35?t/0.35:t<0.7?1:1-(t-0.7)/0.3;const deg=o*state.open;door.style.transform="translateZ(60px) rotateY("+(-deg)+"deg)";}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now){const t=(now/1000/state.dur)%1;draw(t);if(!reduce)requestAnimationFrame(frame);}
apply();if(reduce)draw(0.5);else requestAnimationFrame(frame);
addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
