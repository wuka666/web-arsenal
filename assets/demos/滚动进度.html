<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>滚动进度指示</title>
<style>

  :root{ --ease: cubic-bezier(.44,0,.56,1); }
  body{margin:0;min-height:220vh;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg,#fff);color:#333;}

  #bar{position:fixed;left:0;width:100%;height:var(--h,4px);background:var(--todo,#e5e5e5);z-index:var(--z,9999);box-shadow:var(--shadow,0 0 0 transparent);}

  #fill{height:100%;width:0;background:var(--done,#111);border-radius:var(--radius,0);transition:width var(--dur,.3s) var(--ease);}

  #pct{position:fixed;right:8px;font-size:12px;font-weight:700;color:var(--pct,#111);display:var(--showpct,none);font-variant-numeric:tabular-nums;z-index:var(--z,9999);}

  .content{padding:60px 24px;max-width:680px;margin:0 auto;line-height:1.9;font-size:15px;}
  .content h2{margin-top:40px;font-size:22px}
</style></head>
<body>
  <div id="bar"><div id="fill"></div></div>
  <div id="pct">0%</div>

  <div class="content">
    <h2>滚动进度指示</h2>
    <p>这是一段占位长文。向下滚动页面，顶部细条会随阅读进度从左到右填充，让你随时知道“读到了哪里”。</p>
    <p>进度条常驻在页面边缘，不抢内容视觉重心，只做轻量提示，是典型的克制简约导航元素。</p>
    <h2>用法场景</h2>
    <p>长文阅读、多页网站、文档站都适合：用户滚动时无需回头看地址栏，一眼就能判断剩余篇幅。</p>
    <p>可把它当成“阅读温度计”——已完成部分上色，未完成部分留浅底，比例一目了然。</p>
    <h2>可调什么</h2>
    <p>进度条高度、已完成色、未完成色、位置（顶/底）、圆角、过渡时长、末端百分比、阴影、底色、叠放层级都能在右侧面板微调。</p>
    <p>继续向下滚动，看细条走到 100% 时的收尾状态。</p>
  </div>
  <script>

  const state = {
    h: 4,
    done: "#111111",
    todo: "#e5e5e5",
    pos: "顶部",
    radius: 0,
    dur: 0.3,
    showPct: false,
    pctColor: "#111111",
    shadow: false,
    bg: "#ffffff",
    z: "顶层"
  };
  const bar=document.getElementById("bar"), fill=document.getElementById("fill"), pct=document.getElementById("pct");

  function apply(){
    const root=document.documentElement;
    root.style.setProperty("--h", state.h+"px");
    root.style.setProperty("--done", state.done);
    root.style.setProperty("--todo", state.todo);
    root.style.setProperty("--radius", state.radius+"px");
    root.style.setProperty("--dur", state.dur+"s");
    root.style.setProperty("--pct", state.pctColor);
    root.style.setProperty("--shadow", state.shadow ? "0 1px 6px rgba(0,0,0,.25)" : "0 0 0 transparent");
    root.style.setProperty("--bg", state.bg);
    root.style.setProperty("--z", state.z==="顶层" ? "9999" : "1");
    root.style.setProperty("--showpct", state.showPct ? "block" : "none");

    if(state.pos==="底部"){ bar.style.top="auto"; bar.style.bottom="0"; }
    else { bar.style.top="0"; bar.style.bottom="auto"; }
    update();
  }

  function update(){
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const p = max>0 ? Math.min(window.scrollY/max, 1) : 0;
    const v = Math.round(p*100);
    fill.style.width = v+"%";
    pct.textContent = v+"%";

    if(state.pos==="底部"){ pct.style.top="auto"; pct.style.bottom=(state.h+4)+"px"; }
    else { pct.style.bottom="auto"; pct.style.top=(state.h+4)+"px"; }
  }
  window.addEventListener("scroll", update, {passive:true});
  window.addEventListener("resize", update);

  window.addEventListener("message",(e)=>{ const d=e.data; if(!d||d.type!=="param")return; state[d.key]=d.value; apply(); });
  apply();
  </script>
</body></html>
