<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>锚点导航演示</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --theme:#2563eb; --bg:#ffffff; --text:#6b7280; --active:#111827; --bar:#2563eb; --dur:.3s; --fs:15px; --radius:10px; --barH:3px; }
  body { font-family:system-ui,"Microsoft YaHei",sans-serif; color:var(--text); }
  #nav { position:sticky; top:0; z-index:40; display:flex; gap:4px; padding:14px 26px; background:var(--bg); box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .aitem { position:relative; padding:10px 16px; border-radius:var(--radius); font-size:var(--fs); cursor:pointer; color:var(--text); transition:color .2s; }
  .aitem.active { color:var(--active); font-weight:700; }
  .aitem::after { content:""; position:absolute; left:16px; right:16px; bottom:-14px; height:var(--barH); background:var(--bar); border-radius:2px; transform:scaleX(0); transform-origin:left; transition:transform var(--dur) ease; }
  .aitem.active::after { transform:scaleX(1); }
  .sec { height:90vh; display:flex; align-items:center; padding:0 26px; max-width:880px; margin:0 auto; }
  .sec h2 { color:#111827; font-size:30px; }
  .sec p { color:#6b7280; margin-top:10px; line-height:1.9; }
</style>
</head>
<body>
  <nav id="nav"><div id="aitems"></div></nav>
  <div id="sections"></div>
<script>
  const state = {
    theme:"#2563eb", bg:"#ffffff", text:"#6b7280", active:"#111827", barColor:"#2563eb",
    threshold:0, dur:0.3, fontSize:15, radius:10, barH:3, pos:"顶",
    items:"首页,特性,价格,联系"
  };
  const nav=document.getElementById("nav"), aitems=document.getElementById("aitems"), sectionsEl=document.getElementById("sections");
  let secs=[];
  function build(){
    const parts=state.items.split(",");
    aitems.innerHTML=""; sectionsEl.innerHTML=""; secs=[];
    parts.forEach((t,i)=>{
      const a=document.createElement("div"); a.className="aitem"; a.textContent=t; a.dataset.i=i;
      a.onclick=()=> secs[i].scrollIntoView({behavior:"smooth"});
      aitems.appendChild(a);
      const s=document.createElement("div"); s.className="sec"; s.innerHTML='<div><h2>'+t+'</h2><p>这是「'+t+'」区块。滚动页面，对应导航项会自动高亮，让你随时知道自己读到哪。</p></div>';
      sectionsEl.appendChild(s); secs.push(s);
    });
  }
  function spy(){
    let idx=0;
    secs.forEach((s,i)=>{ if(s.offsetTop-120 <= window.scrollY) idx=i; });
    [...aitems.children].forEach((c,i)=> c.classList.toggle("active", i===idx));
  }
  function apply(){
    const R=document.documentElement.style;
    R.setProperty("--theme",state.theme); R.setProperty("--bg",state.bg); R.setProperty("--text",state.text);
    R.setProperty("--active",state.active); R.setProperty("--bar",state.barColor);
    R.setProperty("--dur",state.dur+"s"); R.setProperty("--fs",state.fontSize+"px"); R.setProperty("--radius",state.radius+"px"); R.setProperty("--barH",state.barH+"px");
    nav.style.top = state.pos==="底" ? "auto" : "0";
    nav.style.bottom = state.pos==="底" ? "0" : "auto";
    build(); spy();
  }
  window.addEventListener("scroll", spy);
  window.addEventListener("message", e=>{ const d=e.data; if(!d||d.type!=="param")return; state[d.key]=d.value; apply(); });
  apply();
</script>
</body>
</html>
