<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汉堡菜单导航演示</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --theme:#2563eb; --menuBg:#111827; --text:#f9fafb; --hover:#374151; --bar:#111827; --ov:.5; --dur:.3s; --sideW:280px; --fs:16px; }
  body { font-family:system-ui,"Microsoft YaHei",sans-serif; background:#f3f4f6; }
  .bar { height:60px; display:flex; align-items:center; padding:0 20px; }
  .ham { width:42px; height:42px; display:flex; flex-direction:column; justify-content:center; gap:5px; cursor:pointer; }
  .ham span { height:3px; background:var(--bar); border-radius:2px; transition:.3s; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,var(--ov)); opacity:0; pointer-events:none; transition:opacity var(--dur) ease; z-index:40; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; bottom:0; width:var(--sideW); background:var(--menuBg); color:var(--text); padding:80px 24px; z-index:50; transition:transform var(--dur) cubic-bezier(.16,1,.3,1); display:flex; flex-direction:column; gap:6px; }
  .drawer.right { right:0; transform:translateX(100%); }
  .drawer.left { left:0; transform:translateX(-100%); }
  .drawer.open.right, .drawer.open.left { transform:translateX(0); }
  .ditem { padding:14px 16px; border-radius:12px; font-size:var(--fs); cursor:pointer; transition:background .15s; }
  .ditem:hover { background:var(--hover); }
  .brand { position:fixed; top:22px; left:20px; font-weight:800; color:var(--theme); z-index:60; }
  .content { padding:80px 26px; max-width:880px; margin:0 auto; }
  .content h1 { color:#111827; margin-bottom:10px; }
  .content p { color:#6b7280; line-height:1.9; }
</style>
</head>
<body>
  <div class="bar"><div class="ham" id="ham"><span></span><span></span><span></span></div></div>
  <div class="brand" id="brand">Menu</div>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer right" id="drawer"><div id="ditems"></div></aside>
  <div class="content"><h1>汉堡菜单导航</h1><p>移动端经典的三条杠样式，点击后侧边滑出菜单，适配屏幕较窄的移动端场景。点左上角汉堡按钮试试。</p></div>
<script>
  const state = {
    theme:"#2563eb", menuBg:"#111827", text:"#f9fafb", hover:"#374151", barColor:"#111827",
    overlayOpacity:0.5, dur:0.3, sideW:280, fontSize:16, from:"右",
    brand:"Menu", items:"首页,作品,关于,联系"
  };
  const ham=document.getElementById("ham"), overlay=document.getElementById("overlay"), drawer=document.getElementById("drawer"), ditems=document.getElementById("ditems"), brandEl=document.getElementById("brand");
  function render(){ ditems.innerHTML=""; state.items.split(",").forEach(t=>{ const d=document.createElement("div"); d.className="ditem"; d.textContent=t; ditems.appendChild(d); }); }
  function setOpen(o){ overlay.classList.toggle("open",o); drawer.classList.toggle("open",o); }
  ham.onclick=()=> setOpen(!drawer.classList.contains("open"));
  overlay.onclick=()=> setOpen(false);
  function apply(){
    const R=document.documentElement.style;
    R.setProperty("--theme",state.theme); R.setProperty("--menuBg",state.menuBg); R.setProperty("--text",state.text);
    R.setProperty("--hover",state.hover); R.setProperty("--bar",state.barColor);
    R.setProperty("--ov",state.overlayOpacity); R.setProperty("--dur",state.dur+"s"); R.setProperty("--sideW",state.sideW+"px"); R.setProperty("--fs",state.fontSize+"px");
    drawer.classList.remove("left","right"); drawer.classList.add(state.from==="左"?"left":"right");
    brandEl.textContent=state.brand; render();
  }
  window.addEventListener("message", e=>{ const d=e.data; if(!d||d.type!=="param")return; state[d.key]=d.value; apply(); });
  apply();
</script>
</body>
</html>
