<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>统计页脚条 · 单文件 demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { height: 100vh; display: flex; flex-direction: column; justify-content: flex-end;
         background: var(--di); font-family: "Inter", system-ui, "Microsoft YaHei", sans-serif; }
  .demo-copy { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
               color: var(--zi); font-size: clamp(26px, 4vw, 44px); font-weight: 500; letter-spacing: -.03em;
               opacity: .35; padding: 0 24px; }
  .stats { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--jiange)*1px);
           padding: 22px var(--hbian) 26px; color: var(--zi); }
  .stat { display: inline-flex; align-items: center; gap: 14px;
          font-size: calc(var(--zihao)*1px); letter-spacing: -.015em; white-space: nowrap;
          opacity: 0; transform: translateY(20px);
          animation: in-stat var(--donghua) cubic-bezier(.16,1,.3,1) both;
          animation-delay: calc(var(--i) * var(--xuhao) * 1s + .2s); }
  @keyframes in-stat { to { opacity: 1; transform: none; } }
  .stat svg { width: 20px; height: 20px; flex: none; }
  .stat .wide { width: 38px; height: 21px; }
  @media (max-width: 760px){
    .stats { flex-direction: column; align-items: center; gap: 16px; }
    .stat { white-space: normal; }
  }
</style>
</head>
<body>
  <div class="demo-copy">页面主张占位<br>统计压在页脚</div>
  <footer class="stats">
    <div class="stat" style="--i:0">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="sa" x1="3" y1="2" x2="14" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/><stop offset="1" stop-color="#3a3a3a" stop-opacity=".62"/>
          </linearGradient>
          <linearGradient id="sb" x1="3" y1="2" x2="14" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3a3a3a" stop-opacity=".38"/><stop offset="1" stop-color="#ffffff" stop-opacity=".62"/>
          </linearGradient>
        </defs>
        <rect x="3.4" y="2.6" width="7.2" height="18.8" rx="3.6" fill="url(#sa)"/>
        <rect x="13.4" y="2.6" width="7.2" height="18.8" rx="3.6" fill="url(#sb)"/>
        <rect x="9.2" y="10.9" width="5.6" height="2.2" rx="1.1" fill="#4a4a4a"/>
      </svg>
      <span>4.2M+ workflows automated</span>
    </div>
    <div class="stat" style="--i:1">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.4" y="2.4" width="19.2" height="19.2" rx="6.2" fill="var(--tubiao)"/>
        <path d="M12 7.1v7.4" stroke="#111" stroke-width="1.85" stroke-linecap="round"/>
        <path d="M8.15 12.35L12 16.2l3.85-3.85" stroke="#111" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span>92% reduction in manual operations</span>
    </div>
    <div class="stat" style="--i:2">
      <svg class="wide" viewBox="0 0 40 22" aria-hidden="true">
        <circle cx="10.2" cy="11" r="9.2" fill="#2b2b2b"/>
        <ellipse cx="10.2" cy="12.1" rx="4.15" ry="3.7" fill="#f4f4f4"/>
        <path d="M4.9 8.6l2.4 1.7-2.5 1.2z" fill="#2b2b2b"/><path d="M15.5 8.6l-2.4 1.7 2.5 1.2z" fill="#2b2b2b"/>
        <circle cx="8.9" cy="11.6" r="0.7" fill="#1a1a1a"/><circle cx="11.5" cy="11.6" r="0.7" fill="#1a1a1a"/>
        <circle cx="20.2" cy="11" r="9.2" fill="#ffffff"/>
        <circle cx="17.6" cy="9.8" r="1.7" fill="#111"/><circle cx="22.8" cy="9.8" r="1.7" fill="#111"/>
        <ellipse cx="20.2" cy="13.4" rx="1.2" ry="0.9" fill="#111"/>
        <path d="M17.8 15.6q2.4 2 4.8 0" stroke="#111" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <circle cx="30.2" cy="11" r="9.2" fill="var(--qiang)"/>
        <text x="30.2" y="15.1" font-family="Inter,system-ui,sans-serif" font-weight="700" font-size="12.5" fill="#fff" text-anchor="middle">e</text>
      </svg>
      <span>180+ operational teams onboarded</span>
    </div>
  </footer>
<script>
const state = { di:'#050505', zi:'#d8d8d8', tubiao:'#e8e8e8', qiang:'#f26b1d',
                zihao:13.5, jiange:24, hbian:72, donghua:1.05, xuhao:0.16 };
function apply(){
  const R = document.documentElement.style;
  R.setProperty('--di', state.di); R.setProperty('--zi', state.zi);
  R.setProperty('--tubiao', state.tubiao); R.setProperty('--qiang', state.qiang);
  R.setProperty('--zihao', state.zihao); R.setProperty('--jiange', state.jiange);
  R.setProperty('--hbian', state.hbian + 'px'); R.setProperty('--donghua', state.donghua + 's');
  R.setProperty('--xuhao', state.xuhao);
}
addEventListener('message', e => {
  const d = e.data; if (!d || d.type !== 'param') return;
  if (!(d.key in state)) return; state[d.key] = d.value; apply();
});
apply();
</script>
</body>
</html>
