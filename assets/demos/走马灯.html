<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>走马灯演示</title><style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.stage{width:var(--w,320px)}
.vp{position:relative;width:var(--w,320px);height:var(--h,180px);overflow:hidden;border-radius:var(--r,14px);background:var(--panel,#f5f6f8)}
.track{display:flex;height:100%;transition:transform var(--spd,.5s) cubic-bezier(.4,1,.3,1)}
.slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;letter-spacing:1px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dot{width:var(--dot,10px);height:var(--dot,10px);border-radius:50%;background:#d2d6dd;transition:transform .25s,background .25s}
.dot.on{background:var(--ac,#2f6bff);transform:scale(1.35)}
</style></head><body>
<div class="stage">
<div class="vp" id="vp"><div class="track" id="track"></div></div>
<div class="dots" id="dots"></div>
</div>
<script>
const vp=document.getElementById('vp'),track=document.getElementById('track'),dots=document.getElementById('dots');
const palette=['#2f6bff','#7c4dff','#2bb673','#e0993d','#e0533d','#1aa0a0'];
// 自动轮播：headless 截图也能抓到非首屏帧
const state={count:4,interval:3,r:14,dot:10,ac:'#2f6bff',panel:'#f5f6f8',auto:true,spd:.5,w:320,h:180};
let idx=0,timer=null;
function applyStyle(){
  const root=document.documentElement.style;
  root.setProperty('--w',state.w+'px');root.setProperty('--h',state.h+'px');root.setProperty('--r',state.r+'px');
  root.setProperty('--dot',state.dot+'px');root.setProperty('--ac',state.ac);root.setProperty('--panel',state.panel);
  root.setProperty('--spd',state.spd+'s');
}
function build(){
  track.innerHTML='';dots.innerHTML='';
  for(let i=0;i<state.count;i++){
    const s=document.createElement('div');s.className='slide';s.style.background=palette[i%palette.length];s.textContent='第 '+(i+1)+' 屏';track.appendChild(s);
    const d=document.createElement('div');d.className='dot';d.onclick=()=>{idx=i;paint();restart();};dots.appendChild(d);
  }
  paint();
}
function paint(){[...dots.children].forEach((d,i)=>d.className='dot'+(i===idx?' on':''));track.style.transform='translateX('+(-idx*100)+'%)';}
function tick(){idx=(idx+1)%state.count;paint();}
function restart(){if(timer)clearInterval(timer);if(state.auto)timer=setInterval(tick,state.interval*1000);}
function apply(){applyStyle();build();restart();}
apply();
// 父页面详情页调参契约：只接受本 demo state 已有的键
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script></body></html>
