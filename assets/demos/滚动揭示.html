<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{ --ease: cubic-bezier(.44,0,.56,1); }
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:220vh;background:#fafafa;}

  .replay{position:fixed;right:12px;top:12px;z-index:9;padding:6px 12px;border:0;border-radius:8px;background:#111;color:#fff;font-size:13px;cursor:pointer}
  .wrap{width:var(--width);max-width:92vw;margin:0 auto;padding:14vh 16px;display:flex;flex-direction:column;gap:16vh;}

  .block{background:var(--bg);color:var(--fg);border-radius:var(--radius);padding:46px 40px;
    text-align:var(--align);line-height:1.6;font-size:17px;
    opacity:var(--opStart);transform:translateY(var(--dist));
    transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),filter var(--dur) var(--ease);}
  .block.in{opacity:1;transform:translateY(0);}
  .block.bf{filter:blur(12px);} .block.in.bf{filter:blur(0);}
  .block b{font-size:22px;display:block;margin-bottom:8px}
</style></head>
<body>
  <button class="replay" id="rp">重播</button>
  <div class="wrap" id="wrap">
    <div class="block"><b>产品介绍</b>一句话说清产品能为用户解决什么问题，越具体越好。</div>
    <div class="block"><b>核心能力</b>把最关键的几项能力按重要性排列，次要信息往后放。</div>
    <div class="block"><b>客户案例</b>用真实场景说明价值，比罗列功能更有说服力。</div>
    <div class="block"><b>开始使用</b>给一个明确的下一步动作，让用户知道从哪里开始。</div>
  </div>

  <script>
  const state = {
    dist: 40, dur: 0.8, opStart: 0, blur: false, thresh: 0.2, stagger: 0.12,
    bg: "#0e0e0e", fg: "#f5f5f5", radius: 16, width: 560, align: "左"
  };
  const root = document.documentElement;
  const wrap = document.getElementById("wrap");
  const blocks = [...wrap.children];
  function apply(){

    root.style.setProperty("--dist", state.dist + "px");
    root.style.setProperty("--dur", state.dur + "s");
    root.style.setProperty("--opStart", state.opStart);
    root.style.setProperty("--bg", state.bg);
    root.style.setProperty("--fg", state.fg);
    root.style.setProperty("--radius", state.radius + "px");
    root.style.setProperty("--width", state.width + "px");
    root.style.setProperty("--align", state.align === "左" ? "left" : state.align === "右" ? "right" : "center");

    blocks.forEach((b,i)=>{
      b.classList.toggle("bf", state.blur);
      b.style.transitionDelay = (i * state.stagger) + "s";
    });
  }
  let io;
  function reset(){
    blocks.forEach(b=>b.classList.remove("in"));
    if(io) io.disconnect();
    io = new IntersectionObserver((es)=>{
      es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("in"); });
    }, { threshold: state.thresh });
    blocks.forEach(b=>io.observe(b));
  }
  document.getElementById("rp").onclick = reset;
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply(); reset();
  });
  apply(); reset();
  </script>
</body></html>
