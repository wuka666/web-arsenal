<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光柱背景</title>
<style>
:root{--c:#7fd1ff;--c2:#a78bfa;--bg:#070a12;--count:7;--dur:5;--w:60;--blur:18;--op:0.5}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
.stage{position:fixed;inset:0;background:var(--bg);overflow:hidden;display:block}
.beam{position:absolute;top:-20%;width:calc(var(--w)*1px);height:140%;background:linear-gradient(180deg,var(--c),var(--c2),transparent);filter:blur(calc(var(--blur)*1px));opacity:0;animation:rise calc(var(--dur)*1s) ease-in-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(20%)}50%{opacity:var(--op)}100%{opacity:0;transform:translateY(-20%)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const state={"c":"#7fd1ff","c2":"#a78bfa","bg":"#070a12","count":7,"dur":5,"w":60,"blur":18,"op":0.5};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }
const st=document.getElementById('stage');const n=state.count|0;st.innerHTML='';for(let i=0;i<n;i++){const b=document.createElement('div');b.className='beam';b.style.left=(i*100/n)+'%';b.style.animationDuration=(state.dur*(0.6+Math.random()*0.8))+'s';b.style.animationDelay='-'+(Math.random()*state.dur).toFixed(2)+'s';st.appendChild(b);}
}

apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
