<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞溅光标</title>
<style>
:root{--c:#ffd166;--c2:#ef476f;--bg:#070a12;--count:24;--size:4;--speed:6;--gravity:0.18}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const state={"c":"#ffd166","c2":"#ef476f","bg":"#070a12","count":24,"size":4,"speed":6,"gravity":0.18};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }

}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H,ps=[];function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
addEventListener('pointerdown',e=>{for(let i=0;i<state.count;i++){const a=Math.random()*7,sp=state.speed*(0.4+Math.random());ps.push({x:e.clientX,y:e.clientY,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,r:state.size*(0.6+Math.random()),c:Math.random()<0.5?state.c:state.c2});}});
function loop(){ctx.fillStyle=state.bg;ctx.fillRect(0,0,W,H);for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.vy+=state.gravity;p.x+=p.vx;p.y+=p.vy;p.r*=0.98;if(p.r<0.4||p.y>H+20){ps.splice(i,1);continue;}ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}requestAnimationFrame(loop);}loop();
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
