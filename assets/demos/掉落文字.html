<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>掉落文字</title>
<style>
:root{--c:#ffe08a;--c2:#000000;--bg:#0a0e16;--fs:96;--dur:2.4;--gap:0.12}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
.row{display:flex;flex-wrap:wrap;justify-content:center;font-weight:900;font-size:calc(var(--fs)*1px);color:var(--c);text-shadow:0 calc(var(--fs)*0.04px) 0 var(--c2)}
.row span{display:inline-block;transform:translateY(-140%);opacity:0;animation:drop calc(var(--dur)*1s) cubic-bezier(.2,1.3,.4,1) infinite}
@keyframes drop{0%{transform:translateY(-140%);opacity:0}18%{opacity:1}55%,100%{transform:translateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
const state={"text":"FALLING","c":"#ffe08a","c2":"#000000","bg":"#0a0e16","fs":96,"dur":2.4,"gap":0.12};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }
const row=document.getElementById('row');row.innerHTML=[...state.text].map((ch,idx)=>'<span style="animation-delay:'+(idx*state.gap)+'s">'+(ch===' '?'&nbsp;':ch)+'</span>').join('');
}

apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
