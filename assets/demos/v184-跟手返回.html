<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跟手返回演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: var(--di); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .stage { position: relative; width: min(420px, 92vw); height: 280px; border-radius: 18px; overflow: hidden; background: #fff; border: 1px solid color-mix(in srgb, var(--accent) 16%, transparent); touch-action: none; }
  .page { position: absolute; inset: 0; background: var(--accent); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; will-change: transform; }
  .page h3 { font-size: 18px; }
  .page p { font-size: 12.5px; opacity: .85; }
  .arrow { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; opacity: 0; transition: opacity .1s; }
  .edge { position: absolute; left: 0; top: 0; bottom: 0; width: var(--edge); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="page" id="page"><h3>当前页面</h3><p>从左侧边缘右滑返回上一页</p></div>
  <div class="arrow" id="arrow">‹</div>
  <div class="edge" id="edge"></div>
  
</div>

<script>
  const state = { edge: 24, thresh: 40, spring: 0.4, accent: "#5E6AD2", di: "#fafafa", text: "#ffffff" };
  const stage = document.getElementById("stage");
  const page = document.getElementById("page");
  const arrow = document.getElementById("arrow");
  function apply() {
    document.documentElement.style.setProperty("--accent", state.accent);
    document.documentElement.style.setProperty("--di", state.di);
    document.documentElement.style.setProperty("--text", state.text);
    document.documentElement.style.setProperty("--edge", state.edge + "px");
  }
  let drag = false, startX = 0, lastX = 0, lastT = 0, vel = 0;
  stage.addEventListener("pointerdown", e => {
    const r = stage.getBoundingClientRect();
    if (e.clientX - r.left > state.edge) return;
    drag = true; startX = e.clientX; lastX = e.clientX; lastT = performance.now(); vel = 0;
    page.style.transition = "none"; stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", e => {
    if (!drag) return;
    let dx = e.clientX - startX; if (dx < 0) dx *= 0.3; // 向左有边界阻尼，不能拖出屏幕
    const w = stage.clientWidth;
    page.style.transform = "translateX(" + dx + "px)";
    arrow.style.opacity = Math.min(dx / (w * 0.4), 1);
    const now = performance.now(), dt = now - lastT || 16; vel = (e.clientX - lastX) / dt; lastX = e.clientX; lastT = now;
  });
  stage.addEventListener("pointerup", e => {
    if (!drag) return; drag = false;
    const w = stage.clientWidth, dx = e.clientX - startX;
    const go = dx > w * state.thresh / 100 || (vel > 0.6 && dx > 20);
    page.style.transition = "transform " + state.spring + "s cubic-bezier(.4,0,.2,1)";
    if (go) {
      page.style.transform = "translateX(" + w + "px)";
      setTimeout(() => {
        page.querySelector("h3").textContent = "已返回上一页"; page.querySelector("p").textContent = "（演示：回到上一级）";
        page.style.transition = "none"; page.style.transform = "translateX(0)";
        setTimeout(() => { page.querySelector("h3").textContent = "当前页面"; page.querySelector("p").textContent = "从左侧边缘右滑返回上一页"; }, 700);
      }, state.spring * 1000);
    } else {
      page.style.transform = "translateX(0)";
    }
    arrow.style.opacity = 0;
  });
  window.addEventListener("message", e => { const d = e.data; if (!d || d.type !== "param") return; state[d.key] = d.value; apply(); });
  apply();
</script>
</body>
</html>
