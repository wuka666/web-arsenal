<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机框</title>
<style>
:root{--frame:#111111;--screen:#f5f3ee;--ink:#1c1c1c;--accent:#d98a3d;--radius:50px;--w:300;--pad:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9e6df;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.phone{width:min(calc(var(--w)*1px),calc(100vw - 32px));aspect-ratio:375/780;background:var(--frame);border-radius:calc(var(--radius) + 8px);padding:var(--pad);box-shadow:0 20px 50px #00000033}
.screen{width:100%;height:100%;border-radius:var(--radius);background:var(--screen);overflow:hidden;position:relative;color:var(--ink);padding:18px}
.screen .tag{display:inline-block;background:var(--accent);color:#ffffff;font-size:12px;padding:4px 10px;border-radius:20px}
.screen h2{margin-top:12px;font-size:22px}
.screen p{margin-top:8px;font-size:13px;opacity:.7}
</style>
</head>
<body>
<div class="phone"><div class="screen"><span class="tag">手机框</span><h2>内容放这里</h2><p>支持 375:780 与 393:852 比例，改 --w 与 aspect-ratio 即可复用。</p></div></div>
</body>
</html>
