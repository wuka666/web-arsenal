<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>无限滚动</title>
<style>
:root{
  --itemH:18; --gap:10; --threshold:80; --spinColor:#007aff;
  --rowBg:#ffffff; --pageBg:#f5f5f7; --radius:10;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--pageBg);display:flex;justify-content:center;min-height:100vh}
.phone{width:340px;max-width:100%;height:100vh;max-height:680px;background:var(--pageBg);overflow:hidden;position:relative;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.12);display:flex;flex-direction:column}
.head{flex:0 0 auto;height:46px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#222;font-weight:600}
.scroller{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px}
.row{background:var(--rowBg);border-radius:calc(var(--radius)*1px);height:calc(var(--itemH)*1px);margin-bottom:calc(var(--gap)*1px);display:flex;align-items:center;padding:0 14px;font-size:13px;color:#555;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.loader{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;color:#999;font-size:13px}
.ld{width:18px;height:18px;border:3px solid rgba(0,0,0,.12);border-top-color:var(--spinColor);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="phone">
  <div class="head">商品列表</div>
  <div class="scroller" id="sc"><div id="list"></div><div class="loader" id="loader"><div class="ld"></div>加载中…</div></div>
</div>
<script>
var state={itemH:18,gap:10,threshold:80,spinColor:"#007aff",rowBg:"#ffffff",pageBg:"#f5f5f7",radius:10};
var UNIT={itemH:"px",gap:"px",threshold:"px",radius:"px"};
var root=document.documentElement;
function apply(){for(var k in state){root.style.setProperty("--"+k,state[k]+(UNIT[k]||""));}}
apply();
var sc=document.getElementById("sc"),list=document.getElementById("list"),loader=document.getElementById("loader");
var n=0,loading=false;
function add(){for(var i=0;i<6;i++){var d=document.createElement("div");d.className="row";d.textContent="第 "+(++n)+" 条内容";list.appendChild(d);}}
add();
function loadMore(){if(loading)return;loading=true;loader.style.visibility="visible";setTimeout(function(){add();loading=false;},700);}
sc.addEventListener("scroll",function(){if(sc.scrollHeight-sc.scrollTop-sc.clientHeight<state.threshold)loadMore();});
// 自动演示：缓慢滚到底触发加载，保证画廊/截图非空
var auto=setInterval(function(){if(!loading&&sc.scrollTop+sc.clientHeight<sc.scrollHeight-2){sc.scrollTop+=40;}else if(!loading){sc.scrollTop=0;}},1600);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
