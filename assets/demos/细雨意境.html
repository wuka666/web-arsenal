<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>细雨演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #17171c; overflow: hidden; }
  #rain { position: fixed; inset: 0; display: block; }
  .card {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(380px, 80vw); padding: 60px 24px; text-align: center;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    border-radius: 16px; backdrop-filter: blur(6px);
    font-family: system-ui, "Microsoft YaHei", sans-serif; color: rgba(255,255,255,.85);
    font-size: 20px; font-weight: 700; letter-spacing: 2px;
  }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="card">内容区<br><span style="font-size:13px;font-weight:400;color:rgba(255,255,255,.6)">雨会避开这里</span></div>
<script>
  // 默认参数（父页面详情页可调）
  const state = {
    rain: 1, speed: 7, wind: 0, len: 1, width: 1.5,
    opacity: 0.5, color: "#ffffff", bg: "#17171c"
  };
  const canvas = document.getElementById("rain");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DROPS = [];
  const pointer = { x: -9999, y: -9999 };
  const CARD = { x: 0, y: 0, w: 0, h: 0 };
  // 降级条件：只在触摸设备上不画雨（省电），桌面端不管窗口多窄都画——
  // 因为演示常被嵌在 iframe 里（宽度小于屏幕），按宽度判断会把雨全禁掉
  const isTouch = window.matchMedia && window.matchMedia("(hover: none)").matches;
  // hex → rgba 字符串
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  };

  function makeDrop(randomY) {
    return {
      x: Math.random() * W,
      y: randomY ? Math.random() * H : -20,
      len: (12 + Math.random() * 18) * state.len, // 雨丝长度按参数缩放
      v: 5 + Math.random() * 6,
      bend: 0
    };
  }

  function rebuild() {
    // 保底 24 根：iframe 缩略图很小，按面积算会只剩几根，看不清
    const n = Math.round(Math.max(24, W * H / 6000 * state.rain));
    DROPS = Array.from({ length: n }, () => makeDrop(true));
  }

  function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
    // 避让区按视口比例缩放（iframe 缩略图很小，固定 400x280 会盖住整个视口）
    CARD.w = Math.min(420, W * 0.76);
    CARD.h = Math.min(280, H * 0.6);
    CARD.x = W / 2 - CARD.w / 2;
    CARD.y = H / 2 - CARD.h / 2;
    rebuild();
  }

  function frame() {
    if (!isTouch) {
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = rgba(state.color, state.opacity); // 雨色 + 透明度实时读 state
      ctx.lineWidth = state.width;
      for (const d of DROPS) {
        d.y += d.v * state.speed / 7;
        d.x += state.wind * 0.3; // 风偏移：每帧横向漂移
        d.bend *= 0.92;
        const dx = d.x - pointer.x, dy = d.y - pointer.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 10000) {
          const dist = Math.sqrt(d2) || 1;
          d.bend += (dx / dist) * 1.5;
        }
        if (d.y > H + 20) Object.assign(d, makeDrop(false));
        if (d.x > W + 30) d.x = -20;
        if (d.x < -30) d.x = W + 20;
        if (d.x > CARD.x && d.x < CARD.x + CARD.w && d.y > CARD.y && d.y < CARD.y + CARD.h) continue;
        ctx.beginPath();
        ctx.moveTo(d.x + d.bend, d.y - d.len);
        ctx.lineTo(d.x, d.y);
        ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }

  // 参数变了：雨量/雨长重新生成，其余每帧直接读 state
  function apply() {
    document.body.style.background = state.bg;
    rebuild();
  }

  canvas.addEventListener("mousemove", e => { pointer.x = e.clientX; pointer.y = e.clientY; });
  canvas.addEventListener("mouseleave", () => { pointer.x = -9999; pointer.y = -9999; });
  canvas.addEventListener("touchmove", e => {
    pointer.x = e.touches[0].clientX;
    pointer.y = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener("resize", () => resize());

  // 接收父页面（index.html 详情页）传来的参数
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });

  resize();
  requestAnimationFrame(frame);
</script>
</body>
</html>
