<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标签选择演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: #fafafa; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
  .row { width: min(560px, 94vw); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
  .tag { padding: 10px 18px; border-radius: 999px; background: var(--sub); color: #555; font-size: 14px; cursor: pointer; user-select: none; border: 1px solid #e0e0e4; transition: transform .35s cubic-bezier(.34,1.5,.5,1), margin .35s cubic-bezier(.34,1.5,.5,1), background .25s, color .25s, box-shadow .25s; }
  .tag.on { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 6px 18px rgba(61,95,214,.35); }
  .hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: #999; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<div class="hint">点标签：选中放大，其余标签主动挤开腾出空间</div>
<script>
  const state = { count: 7, scale: 1.25, gap: 10, radius: 999, accent: "#3d5fd6", sub: "#ffffff" };
  const row = document.getElementById("row");
  const labels = ["全部", "前端", "动效", "AI", "设计", "后端", "数据", "产品", "运营"];
  let sel = 0;
  function build() {
    row.innerHTML = "";
    for (let i = 0; i < state.count; i++) {
      const t = document.createElement("div");
      t.className = "tag" + (i === sel ? " on" : "");
      t.textContent = labels[i % labels.length];
      t.addEventListener("click", () => { sel = i; apply(); });
      row.appendChild(t);
    }
  }
  function apply() {
    document.documentElement.style.setProperty("--accent", state.accent);
    document.documentElement.style.setProperty("--sub", state.sub);
    [...row.children].forEach((t, i) => {
      t.style.borderRadius = state.radius + "px";
      if (i === sel) {
        t.classList.add("on");
        t.style.transform = "scale(" + state.scale + ")";
        t.style.margin = "0 " + (state.gap + 6) + "px";
      } else {
        t.classList.remove("on");
        t.style.transform = "scale(1)";
        t.style.margin = "0 " + (state.gap / 2) + "px";
      }
    });
  }
  window.addEventListener("message", e => { const d = e.data; if (!d || d.type !== "param") return; state[d.key] = d.value; build(); apply(); });
  build(); apply();
</script>
</body>
</html>
