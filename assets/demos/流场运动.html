<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流场运动演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0e1116; }
  canvas { display: block; width: min(560px, 94vw); height: min(420px, 80vh); border-radius: 16px; }

</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
  const state = { count: 240, speed: 1.4, field: 0.004, trail: 0.06, size: 1.6, color: "#5ad1ff", bg: "#0e1116" };
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, ps = [];
  function resize() { W = canvas.width = canvas.clientWidth * devicePixelRatio; H = canvas.height = canvas.clientHeight * devicePixelRatio; }
  function angle(x, y, t) { return (Math.cos(x * state.field + t) + Math.sin(y * state.field * 1.3 - t)) * Math.PI; }
  function build() {
    ps = [];
    for (let i = 0; i < state.count; i++) ps.push({ x: Math.random() * W, y: Math.random() * H });
  }
  function apply() { resize(); build(); document.body.style.background = state.bg; }
  let t = 0;
  function frame() {
    t += 0.005;
    ctx.fillStyle = state.bg; ctx.globalAlpha = state.trail; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    ctx.fillStyle = state.color;
    for (const p of ps) {
      const a = angle(p.x, p.y, t);
      p.x += Math.cos(a) * state.speed * devicePixelRatio;
      p.y += Math.sin(a) * state.speed * devicePixelRatio;
      if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) { p.x = Math.random() * W; p.y = Math.random() * H; }
      ctx.beginPath(); ctx.arc(p.x, p.y, state.size * devicePixelRatio, 0, 7); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener("message", e => { const d = e.data; if (!d || d.type !== "param") return; state[d.key] = d.value; apply(); });
  apply(); frame();
</script>
</body>
</html>
