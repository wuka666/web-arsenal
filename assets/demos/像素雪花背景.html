<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素雪花背景</title>
<style>
:root{--c:#eaf6ff;--c2:#9fd0ff;--bg:#070b14;--n:140;--sp:0.6;--size:5}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const state={"c":"#eaf6ff","c2":"#9fd0ff","bg":"#070b14","n":140,"sp":0.6,"size":5};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }

}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H,fl;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;fl=[];for(let i=0;i<state.n;i++)fl.push({x:Math.random()*W,y:Math.random()*H,r:state.size*(0.5+Math.random()),s:state.sp*(0.5+Math.random()),d:Math.random()*7});}
rs();addEventListener('resize',rs);
function loop(){ctx.fillStyle=state.bg;ctx.fillRect(0,0,W,H);for(const f of fl){f.y+=f.s;f.x+=Math.sin(f.y/60+f.d)*0.3;if(f.y>H){f.y=-f.r;f.x=Math.random()*W;}ctx.fillStyle=Math.random()<0.5?state.c:state.c2;ctx.fillRect(f.x|0,f.y|0,f.r,f.r);}requestAnimationFrame(loop);}loop();
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
