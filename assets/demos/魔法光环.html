<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魔法光环</title>
<style>
:root{--c:#9b8cff;--bg:#070a12;--rings:5;--lag:0.18;--size:26;--trail:0.12}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const state={"c":"#9b8cff","bg":"#070a12","rings":5,"lag":0.18,"size":26,"trail":0.12};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }

}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
let cx=mx,cy=my;const ring=[];for(let i=0;i<state.rings;i++)ring.push({x:mx,y:my});
function loop(){cx+=(mx-cx)*state.lag;cy+=(my-cy)*state.lag;for(let i=0;i<ring.length;i++){ring[i].x+=(cx-ring[i].x)*state.lag;ring[i].y+=(cy-ring[i].y)*state.lag;}
 ctx.fillStyle=state.bg;ctx.globalAlpha=1;ctx.fillRect(0,0,W,H);ctx.globalAlpha=state.trail;ctx.strokeStyle=state.c;ctx.lineWidth=2;
 for(let i=0;i<ring.length;i++){const r=(i+1)*state.size;ctx.beginPath();ctx.arc(ring[i].x,ring[i].y,r,0,7);ctx.stroke();}requestAnimationFrame(loop);}loop();
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
