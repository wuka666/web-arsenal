<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Discovery Hero（整站方案 · 可调参）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { font-family: 'Inter', system-ui, sans-serif; background: #000; }
  .font-playfair { font-family: 'Playfair Display', serif; }

  @keyframes heroReveal { 0% { opacity: 0; transform: translateY(28px); filter: blur(12px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
  @keyframes heroFadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes heroZoom { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .hero-anim { opacity: 0; animation-fill-mode: forwards; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
  .hero-reveal { animation-name: heroReveal; animation-duration: 1.1s; }
  .hero-fade { animation-name: heroFadeUp; animation-duration: 1s; }
  .hero-zoom { animation: heroZoom 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @media (prefers-reduced-motion: reduce) { .hero-anim, .hero-zoom { animation: none; opacity: 1; } }

  #hero { position: relative; width: 100%; height: 100dvh; overflow: hidden; background: #000; }
  .layer { position: absolute; inset: 0; background-position: center; background-size: cover; background-repeat: no-repeat; }
  #base { z-index: 10; }
  #reveal { z-index: 30; pointer-events: none; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
  #mask { position: absolute; inset: 0; pointer-events: none; display: none; }

  #heading { position: absolute; top: 14%; left: 0; right: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 20px; pointer-events: none; }
  #heading h1 { color: #fff; line-height: 0.95; }
  #heading .l1 { display: block; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 400; font-size: 48px; letter-spacing: -0.05em; }
  #heading .l2 { display: block; font-weight: 400; font-size: 48px; letter-spacing: -0.08em; margin-top: -4px; }

  #leftCopy { position: absolute; bottom: 56px; left: 40px; z-index: 50; max-width: 260px; display: none; }
  #leftCopy p { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.6; }

  #rightBlock { position: absolute; bottom: 40px; left: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; align-items: flex-start; gap: 20px; }
  #rightBlock p { font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.6; max-width: 260px; }
  #cta { border: none; cursor: pointer; color: #fff; font-size: 14px; font-weight: 500; padding: 12px 28px; border-radius: 999px; transition: all .25s; }
  #cta:hover { transform: scale(1.03); }
  #cta:active { transform: scale(0.95); }

  #nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; }
  #nav .logo { display: flex; align-items: center; gap: 8px; }
  #nav .word { color: #fff; font-size: 24px; font-family: 'Playfair Display', serif; font-style: italic; }
  #nav .pill { display: none; position: absolute; left: 50%; transform: translateX(-50%); align-items: center; gap: 4px; padding: 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); }
  #nav .pill button { border: none; background: transparent; color: rgba(255,255,255,0.8); font-size: 14px; font-weight: 500; padding: 6px 16px; border-radius: 999px; cursor: pointer; }
  #nav .pill button.active { color: #fff; }
  #nav .pill button:hover { background: rgba(255,255,255,0.2); color: #fff; }
  #nav .signup { display: none; background: #fff; color: #111; font-size: 14px; font-weight: 600; padding: 10px 24px; border-radius: 999px; cursor: pointer; }
  #nav .burger { display: block; background: transparent; border: none; color: #fff; cursor: pointer; }

  @media (min-width: 768px) {
    #heading .l1, #heading .l2 { font-size: 80px; }
    #leftCopy { display: block; bottom: 56px; left: 56px; }
    #rightBlock { left: auto; right: 56px; bottom: 96px; align-items: flex-end; }
    #rightBlock p { font-size: 14px; }
    #nav .pill { display: flex; }
    #nav .signup { display: block; }
    #nav .burger { display: none; }
  }
  @media (min-width: 1024px) {
    #heading .l1, #heading .l2 { font-size: 96px; }
  }
</style>
</head>
<body>
<section id="hero">
  <div id="base" class="layer"></div>
  <div id="reveal" class="layer"></div>
  <canvas id="mask"></canvas>

  <div id="heading">
    <h1>
      <span class="l1 hero-anim hero-reveal" id="t1" style="animation-delay:.25s;color:#fff"></span>
      <span class="l2 hero-anim hero-reveal" id="t2" style="animation-delay:.42s;color:#fff"></span>
    </h1>
  </div>

  <div id="leftCopy" class="hero-anim hero-fade" style="animation-delay:.7s"><p id="lc"></p></div>

  <div id="rightBlock" class="hero-anim hero-fade" style="animation-delay:.85s">
    <p id="rc">Our interactive maps let you peel back the crust to trace how stones, fossils, and deep time combine to shape the ground beneath your feet.</p>
    <button id="cta">Start Digging</button>
  </div>

  <nav id="nav">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 256 256" fill="#ffffff" aria-hidden="true"><path d="M 256 256 L 128 256 L 0 128 L 128 128 Z M 256 128 L 128 128 L 0 0 L 128 0 Z" /></svg>
      <span class="word">Lithos</span>
    </div>
    <div class="pill" id="pill">
      <button class="active">Course</button>
      <button>Field Guides</button>
      <button>Geology</button>
      <button>Plans</button>
      <button>Live Tour</button>
    </div>
    <button class="signup">Sign Up</button>
    <button class="burger" aria-label="menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
    </button>
  </nav>
</section>

<script>
  const state = {
    baseImg: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_195923_b0ba8ace-1d1d-4f2c-9a28-1ab84b330680.png&w=1280&q=85",
    revealImg: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_201152_bba90a12-bf12-459f-91f0-51f237dbaf3b.png&w=1280&q=85",
    accent: "#e8702a",
    headingColor: "#ffffff",
    navBg: "#ffffff",
    baseTint: "#1b1206",
    revealTint: "#3a2a12",
    titleText: "Layers hold",
    subText: "tales of time",
    btnText: "Start Digging",
    leftCopy: "Every layer of sediment records a chapter of our planet, from ancient seabeds to drifting ash, layered across millions of years beneath us.",
    radius: 260
  };

  const hero = document.getElementById('hero');
  const base = document.getElementById('base');
  const reveal = document.getElementById('reveal');
  const mask = document.getElementById('mask');
  const t1 = document.getElementById('t1');
  const t2 = document.getElementById('t2');
  const lc = document.getElementById('lc');
  const cta = document.getElementById('cta');
  const pill = document.getElementById('pill');

  function hexToRgba(hex, a) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  // 鼠标平滑：原始坐标 + 缓动坐标 + RAF
  const mouse = { x: -999, y: -999 };
  const smooth = { x: -999, y: -999 };
  const EASE = 0.1;
  let raf = null;

  function apply() {
    base.style.backgroundImage = 'linear-gradient(' + hexToRgba(state.baseTint, 0.4) + ',' + hexToRgba(state.baseTint, 0.4) + '), url("' + state.baseImg + '")';
    reveal.style.backgroundImage = 'linear-gradient(' + hexToRgba(state.revealTint, 0.35) + ',' + hexToRgba(state.revealTint, 0.35) + '), url("' + state.revealImg + '")';
    t1.textContent = state.titleText;
    t2.textContent = state.subText;
    t1.style.color = state.headingColor;
    t2.style.color = state.headingColor;
    lc.textContent = state.leftCopy;
    cta.textContent = state.btnText;
    cta.style.background = state.accent;
    pill.style.background = hexToRgba(state.navBg, 0.2);
  }

  function drawMask() {
    const w = window.innerWidth, h = window.innerHeight;
    if (mask.width !== w || mask.height !== h) { mask.width = w; mask.height = h; }
    const ctx = mask.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    const r = state.radius;
    const g = ctx.createRadialGradient(smooth.x, smooth.y, 0, smooth.x, smooth.y, r);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.4, 'rgba(255,255,255,1)');
    g.addColorStop(0.6, 'rgba(255,255,255,0.75)');
    g.addColorStop(0.75, 'rgba(255,255,255,0.4)');
    g.addColorStop(0.88, 'rgba(255,255,255,0.12)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(smooth.x, smooth.y, r, 0, Math.PI * 2);
    ctx.fill();
    const url = mask.toDataURL();
    reveal.style.webkitMaskImage = 'url(' + url + ')';
    reveal.style.maskImage = 'url(' + url + ')';
  }

  function loop() {
    smooth.x += (mouse.x - smooth.x) * EASE;
    smooth.y += (mouse.y - smooth.y) * EASE;
    drawMask();
    raf = requestAnimationFrame(loop);
  }

  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('resize', () => { mask.width = window.innerWidth; mask.height = window.innerHeight; });

  apply();
  loop();

  // 详情页调参契约
  window.addEventListener('message', ev => {
    if (ev.data && ev.data.type === 'param' && ev.data.key in state) {
      state[ev.data.key] = ev.data.value;
      apply();
    }
  });
</script>
</body>
</html>
