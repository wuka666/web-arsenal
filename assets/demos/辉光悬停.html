<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>辉光悬停</title>
<style>
:root{--c:#ffffff;--card:#1b2440;--bg:#0a0e1a;--glare:220;--op:0.5;--txt:#cdd6ff}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
.wrap{height:100vh;display:grid;place-items:center}
.card{position:relative;width:min(80vw,420px);height:260px;border-radius:18px;background:var(--card);overflow:hidden;display:grid;place-items:center;color:var(--txt,#cdd6ff);font-weight:800;font-size:28px;cursor:pointer}
.card .gl{position:absolute;inset:0;background:radial-gradient(circle calc(var(--glare)*1px) at var(--gx,50%) var(--gy,50%), color-mix(in srgb,var(--c) calc(var(--op)*100%), transparent), transparent 70%);opacity:0;transition:opacity .2s;pointer-events:none}
.card:hover .gl{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card"><div class="gl" id="gl"></div><span>HOVER ME</span></div></div>
<script>
const state={"c":"#ffffff","card":"#1b2440","bg":"#0a0e1a","glare":220,"op":0.5,"txt":"#cdd6ff"};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }

}
const card=document.getElementById('card'),gl=document.getElementById('gl');
card.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect();const x=((e.clientX-r.left)/r.width*100).toFixed(1),y=((e.clientY-r.top)/r.height*100).toFixed(1);gl.style.setProperty('--gx',x+'%');gl.style.setProperty('--gy',y+'%');});
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
