<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>底部操作菜单演示</title><style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.phone{position:relative;width:280px;height:520px;background:#fff;border:9px solid #1c1c22;border-radius:34px;overflow:hidden}
.screen{position:absolute;inset:0;background:#fff}
.av{position:absolute;top:90px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:#e9edf3;color:#9aa0a6;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer}
.mask{position:absolute;inset:0;background:rgba(0,0,0,var(--mk,.4));opacity:0;pointer-events:none;transition:opacity var(--dur,.3s);z-index:5}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sc,#fff);border-radius:var(--sr,16px) var(--sr,16px) 0 0;padding:10px;transform:translateY(110%);transition:transform var(--dur,.3s) cubic-bezier(.4,1,.5,1);z-index:6}
.sheet.on{transform:translateY(0)}
.op{height:var(--oh,46px);display:flex;align-items:center;justify-content:center;font-size:15px;color:#222;border-radius:10px;cursor:pointer}
.op:active{background:#f4f5f7}
.cancel{margin-top:6px;color:var(--cc,#ef4444);font-weight:600;border-top:1px solid #eee}
</style></head><body>
<div class="phone"><div class="screen" id="sc">
<div class="av" id="av">☻</div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
</div></div>
<script>
const av=document.getElementById('av'),mask=document.getElementById('mask'),sheet=document.getElementById('sheet');
const opts=['拍照','从相册选择','删除头像'];
const state={ac:'#2f6bff',sc:'#ffffff',n:3,sr:16,dur:.3,cc:'#ef4444',oh:46,mk:.4};
function build(){sheet.innerHTML='';for(let i=0;i<state.n;i++){const o=document.createElement('div');o.className='op'+(i===state.n-1?' cancel':'');o.textContent=opts[i]||('选项'+(i+1));o.onclick=close;sheet.appendChild(o);}const c=document.createElement('div');c.className='op cancel';c.textContent='取消';c.onclick=close;sheet.appendChild(c);}
function applyStyle(){document.documentElement.style.setProperty('--ac',state.ac);document.documentElement.style.setProperty('--sc',state.sc);document.documentElement.style.setProperty('--cc',state.cc);document.documentElement.style.setProperty('--sr',state.sr+'px');document.documentElement.style.setProperty('--oh',state.oh+'px');document.documentElement.style.setProperty('--mk',state.mk);sheet.style.transition='transform '+state.dur+'s cubic-bezier(.4,1,.5,1)';mask.style.transition='opacity '+state.dur+'s';}
function open(){build();sheet.classList.add('on');mask.classList.add('on');}
function close(){sheet.classList.remove('on');mask.classList.remove('on');}
av.onclick=open;mask.onclick=close;
applyStyle();open();
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;state[d.key]=d.value;if(['ac','sc','n','sr','dur','cc','oh','mk'].includes(d.key)){applyStyle();if(sheet.classList.contains('on'))build();}});
</script></body></html>
