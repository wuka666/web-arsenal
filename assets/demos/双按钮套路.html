<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双按钮方案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--page, #fff); font-family: system-ui, "Microsoft YaHei", sans-serif; padding: 20px;
  }
  .plan { width: min(560px, 94vw); }
  .plan h1 { font-size: 26px; font-weight: 800; color: var(--ink, #1a1a1a); }
  .aim { margin-top: 6px; font-size: 14px; color: #8a8a85; }
  .steps { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .step {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--card, #faf9f6); border: 1px solid #ecebe7;
    border-radius: var(--r, 12px); padding: 12px 14px;
    font-size: 14px; line-height: 1.7; color: #555;
  }
  .step b { color: var(--ink, #1a1a1a); white-space: nowrap; }
  .demo {
    margin-top: 20px; border: 1px dashed #dcdad2; border-radius: var(--r, 12px);
    padding: 22px; text-align: center;
  }
  .demo h2 { font-size: 18px; font-weight: 700; color: var(--ink, #1a1a1a); }
  .demo p { margin-top: 6px; font-size: 12.5px; color: #8a8a85; }
  .btns { margin-top: 14px; display: flex; justify-content: center; gap: var(--gap, 12px); }
  .btn { font-size: var(--fs, 14px); padding: 11px 26px; border-radius: var(--btn-r, 12px); }
  .btn.ghost { border: 1.5px solid var(--ghost-bd, #ddd8ce); color: var(--ghost-t, #6f6a5e); }
  .btn.solid {
    background: var(--solid, #1a1a1a); color: var(--solid-t, #fff); font-weight: 700;
    box-shadow: 0 8px 18px color-mix(in srgb, var(--solid, #1a1a1a) var(--shadow, 18%), transparent);
  }
</style>
</head>
<body>
  <div class="plan">
    <h1>双按钮</h1>
    <p class="aim">目的：让访客先了解，再行动——转化页的标准开头</p>
    <div class="steps">
      <div class="step"><b>1.</b> 放一个大标题，说清你是干嘛的</div>
      <div class="step"><b>2.</b> 标题下放两个按钮：<br>「虚」描边按钮 = 先给信息（进一步了解）<br>「实」实心按钮 = 要行动（立即使用）</div>
      <div class="step"><b>3.</b> 实按钮永远比虚按钮显眼（大/颜色深/带阴影）</div>
    </div>
    <div class="demo">
      <h2>把灵感变成可复用的弹药</h2>
      <p>示意：左边虚、右边实</p>
      <div class="btns">
        <span class="btn ghost">进一步了解</span>
        <span class="btn solid">立即使用</span>
      </div>
    </div>
  </div>
  <script>
    // 默认参数（父页面详情页可调）
    const state = {
      solidColor: "#1a1a1a", solidText: "#ffffff", ghostBorder: "#ddd8ce", ghostText: "#6f6a5e",
      bg: "#ffffff", cardBg: "#faf9f6", radius: 12, btnRadius: 12, fontSize: 14,
      gap: 12, shadow: 18
    };

    // 参数变了：全部走 CSS 变量，颜色/圆角/字号/间距实时变
    function apply() {
      const s = document.documentElement.style;
      s.setProperty("--solid", state.solidColor);
      s.setProperty("--solid-t", state.solidText);
      s.setProperty("--ghost-bd", state.ghostBorder);
      s.setProperty("--ghost-t", state.ghostText);
      s.setProperty("--page", state.bg);
      s.setProperty("--card", state.cardBg);
      s.setProperty("--ink", state.solidColor);
      s.setProperty("--r", state.radius + "px");
      s.setProperty("--btn-r", state.btnRadius + "px");
      s.setProperty("--fs", state.fontSize + "px");
      s.setProperty("--gap", state.gap + "px");
      s.setProperty("--shadow", state.shadow + "%");
    }

    // 接收父页面（index.html 详情页）传来的参数
    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || d.type !== "param") return;
      state[d.key] = d.value;
      apply();
    });
    apply();
  </script>
</body>
</html>
