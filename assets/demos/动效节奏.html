<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动效节奏演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #fafafa; color: #1a1a1a; padding: 20px; }
  h1 { font-size: 17px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #888; margin-bottom: 16px; }
  h2 { font-size: 13px; color: #555; margin: 18px 0 10px; }
  /* 三种转场模式并排 */
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .panel { background: var(--panel); border: 1px solid #ececec; border-radius: 10px; padding: 10px; }
  .panel h3 { font-size: 12px; margin-bottom: 8px; }
  .demo { position: relative; height: 84px; border-radius: 8px; background: var(--track); overflow: hidden; }
  /* 容器转场：小胶囊变形成大卡片 */
  .chip { position: absolute; left: 10px; top: 28px; width: 40%; height: 28px; border-radius: 14px; background: var(--color);
    transform: scale(calc(1 - var(--scale)));
    transition: width var(--dur) var(--ease), height var(--dur) var(--ease), top var(--dur) var(--ease), border-radius var(--dur) var(--ease), transform var(--dur) var(--ease); }
  .demo.play .chip { width: calc(100% - 20px); height: 62px; top: 11px; border-radius: 10px; transform: scale(1); }
  /* 位移：从左滑入 */
  .slider { position: absolute; left: 10px; top: 11px; width: calc(100% - 20px); height: 62px; border-radius: 10px; background: var(--color);
    transform: translateX(var(--dist-neg)); transition: transform var(--dur) var(--ease); }
  .demo.play .slider { transform: translateX(0); }
  /* 淡入淡出：纯透明度 */
  .fader { position: absolute; inset: 10px; border-radius: 10px; background: var(--color); opacity: 0;
    transition: opacity var(--dur) var(--ease); }
  .demo.play .fader { opacity: 1; }
  /* 缓动曲线赛跑 */
  .lane { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
  .lane .name { font-size: 12px; color: #555; }
  .lane .name code { display: block; font-size: 10px; color: #999; font-family: Consolas, monospace; }
  .track { position: relative; height: 26px; border-radius: 13px; background: var(--track); }
  .ball { position: absolute; left: 4px; top: 50%; border-radius: 50%; background: var(--color);
    transform: translateY(-50%); }
  .curve { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); opacity: .9; }
  .btn { cursor: pointer; border: none; background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 700;
    padding: 8px 22px; border-radius: 8px; margin-bottom: 6px; }
  .hint { font-size: 12px; color: #999; margin-top: 14px; }
</style>
</head>
<body>
<h1>动效节奏规范</h1>
<div class="sub">三种转场模式 × 四种缓动曲线——全站统一时长与缓动，动效才有一致的「呼吸」</div>
<button class="btn" id="btn">重播全部</button>

<h2>三种转场模式</h2>
<div class="modes">
  <div class="panel"><h3>① 容器转场（就地变形）</h3><div class="demo" id="m1"><div class="chip"></div></div></div>
  <div class="panel"><h3>② 位移（滑入）</h3><div class="demo" id="m2"><div class="slider"></div></div></div>
  <div class="panel"><h3>③ 淡入淡出</h3><div class="demo" id="m3"><div class="fader"></div></div></div>
</div>

<h2>四种缓动曲线赛跑（同一时长）</h2>
<div id="lanes"></div>

<div class="hint">减速度曲线出自 QQ 空间相册转场：起步快、收尾慢，符合物体运动直觉</div>
<script>
  // 默认参数（父页面详情页可调）
  const state = {
    dur: 0.8,          // 时长（秒）
    dist: 120,         // 位移距离（px）
    scale: 0.12,       // 缩放幅度
    ease: "减速度曲线",  // 转场模式用的缓动
    color: "#2b6cff",  // 强调色
    track: "#eef1f5",  // 轨道色
    bg: "#fafafa",     // 背景色
    panel: "#ffffff",  // 面板底色
    ballSize: 14,      // 小球大小（px）
    labelShow: true,   // 显示曲线名称
    showCurve: true,   // 显示曲线图
    loop: false        // 自动循环
  };
  // 缓动库：名字 → cubic-bezier
  const EASES = {
    "匀速": "linear",
    "先快后慢": "cubic-bezier(.25,.8,.35,1)",
    "减速度曲线": "cubic-bezier(0,0,.15,1)",   // QQ 空间相册同款
    "回弹": "cubic-bezier(.34,1.56,.64,1)"
  };
  const lanesBox = document.getElementById("lanes");
  const demos = [document.getElementById("m1"), document.getElementById("m2"), document.getElementById("m3")];

  // 画一条迷你曲线图（SVG path 近似贝塞尔）
  function curveSvg(bezier) {
    const m = bezier.match(/cubic-bezier\(([\d.]+),\s*([\d.-]+),\s*([\d.]+),\s*([\d.-]+)\)/);
    let d;
    if (!m) { d = "M2,18 L58,2"; } // linear 直线
    else {
      const [, x1, y1, x2, y2] = m.map(Number);
      const X = v => 2 + v * 56, Y = v => 20 - v * 18;
      d = "M2,20 C" + X(x1) + "," + Y(y1) + " " + X(x2) + "," + Y(y2) + " 58,2";
    }
    return '<svg class="curve" width="60" height="24" viewBox="0 0 60 24">' +
      '<path d="' + d + '" fill="none" stroke="var(--color)" stroke-width="1.5" stroke-linecap="round"/></svg>';
  }

  // 生成四条赛跑道
  function build() {
    lanesBox.innerHTML = "";
    Object.entries(EASES).forEach(([name, bz]) => {
      const lane = document.createElement("div");
      lane.className = "lane";
      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.innerHTML = name + (name === "减速度曲线" ? "<code>cubic-bezier(0,0,.15,1)</code>" : "");
      const track = document.createElement("div");
      track.className = "track";
      track.innerHTML = '<div class="ball" data-bz="' + bz + '"></div>' + (state.showCurve ? curveSvg(bz) : "");
      lane.append(nameEl, track);
      lanesBox.appendChild(lane);
    });
    apply();
  }

  // 参数落地
  function apply() {
    const root = document.documentElement.style;
    root.setProperty("--dur", state.dur + "s");
    root.setProperty("--ease", EASES[state.ease] || EASES["减速度曲线"]);
    root.setProperty("--dist-neg", -state.dist + "px");
    root.setProperty("--scale", state.scale);
    root.setProperty("--color", state.color);
    root.setProperty("--track", state.track);
    root.setProperty("--panel", state.panel);
    document.body.style.background = state.bg;
    document.querySelectorAll(".name").forEach(n => n.style.display = state.labelShow ? "" : "none");
    document.querySelectorAll(".ball").forEach(b => {
      b.style.width = b.style.height = state.ballSize + "px";
    });
    document.querySelectorAll(".curve").forEach(c => c.style.display = state.showCurve ? "" : "none");
    // 回弹球允许飞出轨道一点，视觉上看到「过头」
    document.querySelectorAll(".track").forEach(t => t.style.overflow = "visible");
  }

  // 重播：先归零，强制回流，再播放
  function play() {
    demos.forEach(d => { d.classList.remove("play"); });
    document.querySelectorAll(".ball").forEach(b => { b.style.transition = "none"; b.style.transform = "translateY(-50%) translateX(0)"; });
    void document.body.offsetWidth; // 强制回流，重置过渡
    demos.forEach(d => d.classList.add("play"));
    document.querySelectorAll(".ball").forEach(b => {
      b.style.transition = "transform var(--dur) " + b.dataset.bz;
      // 滚动距离 = 轨道宽 - 球宽 - 边距
      const track = b.parentElement;
      const dist = track.clientWidth - state.ballSize - 8;
      b.style.transform = "translateY(-50%) translateX(" + dist + "px)";
    });
  }
  document.getElementById("btn").addEventListener("click", play);

  // 自动循环
  let timer = null;
  function setLoop() {
    clearInterval(timer);
    if (state.loop) timer = setInterval(play, (state.dur + 0.6) * 1000);
  }

  build();
  play();
  // 接收父页面（index.html 详情页）传来的参数
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    if (d.key === "loop") { setLoop(); return; }
    build();
    play();
  });
</script>
</body>
</html>
