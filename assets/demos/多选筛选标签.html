<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多选筛选标签</title>
<style>
:root{--accent:#ff6b35;--ink:#333333;--chipbg:#eef0f3;--onink:#ffffff;--radius:14;--pad:10;--gap:8;--dur:0.28}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f6f8;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
.box{width:340px;background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top b{font-size:15px;color:var(--ink)}
.badge{background:var(--accent);color:var(--onink);min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;transition:transform calc(var(--dur)*1s) cubic-bezier(.3,1.6,.5,1)}
.badge.jump{transform:scale(1.35)}
.tags{display:flex;flex-wrap:wrap;gap:var(--gap)px}
.tag{position:relative;display:flex;align-items:center;background:var(--chipbg);color:var(--ink);border-radius:var(--radius)px;padding:var(--pad)px calc(var(--pad)*1.4)px;font-size:14px;cursor:pointer;border:none;font-family:inherit;overflow:hidden;transition:all calc(var(--dur)*1s) cubic-bezier(.4,0,.2,1)}
.tag .ck{width:0;opacity:0;margin-right:0;transition:all calc(var(--dur)*1s) ease}
.tag.on{background:var(--accent);color:var(--onink);padding-left:calc(var(--pad)*1.1)px;padding-right:calc(var(--pad)*1.7)px}
.tag.on .ck{width:14px;opacity:1;margin-right:4px}
</style>
<style>
/* 合规补齐：宪法附录B B1 —— 移动端可点元素命中区须 ≥44（WCAG 判命中区不判视觉尺寸，故用 min 尺寸撑开，视觉不变） */
.tag{min-width:44px;min-height:44px}
</style>
</head>
<body>
<div class="box">
  <div class="top"><b>筛选</b><div class="badge" id="badge">0</div></div>
  <div class="tags" id="tags">
    <button class="tag"><span class="ck">✓</span>全部</button>
    <button class="tag"><span class="ck">✓</span>已购</button>
    <button class="tag"><span class="ck">✓</span>降价</button>
    <button class="tag"><span class="ck">✓</span>包邮</button>
    <button class="tag"><span class="ck">✓</span>新品</button>
    <button class="tag"><span class="ck">✓</span>直播</button>
  </div>
</div>
<script>
var state={accent:'#ff6b35',ink:'#333333',chipbg:'#eef0f3',onink:'#ffffff',radius:14,pad:10,gap:8,dur:0.28};
var root=document.documentElement;
var UNIT={radius:'px',pad:'px',gap:'px',dur:'s'};
function apply(){for(var k in state){root.style.setProperty('--'+k,state[k]+(UNIT[k]||''));}}
apply();
var tags=document.getElementById('tags').querySelectorAll('.tag');
var badge=document.getElementById('badge');
var count=0;
tags.forEach(function(t){
  t.addEventListener('click',function(){
    t.classList.toggle('on');
    count=tags_filtered();
    badge.textContent=count;
    badge.classList.add('jump');
    setTimeout(function(){badge.classList.remove('jump');},220);
  });
});
function tags_filtered(){var n=0;tags.forEach(function(t){if(t.classList.contains('on'))n++;});return n;}

window.addEventListener('message', function(e){
  var d = e.data;
  if(!d || d.type !== 'param') return;
  if(!(d.key in state)) return;
  state[d.key] = d.value;
  apply();
});
</script>
</body>
</html>
