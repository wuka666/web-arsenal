<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跟手放大图标</title>
<style>
:root{--c1:#7c3aed;--c2:#ffffff;--c3:#1f2937;--bg:#eef0f4;--rad:24px;--sz:84px;--mag:1.8;--maxd:160;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.stage{position:relative;width:min(90vw,320px);height:260px;display:grid;place-items:center;touch-action:none}
.big{width:var(--sz);height:var(--sz);border-radius:var(--rad);background:var(--c1);color:var(--c2);display:grid;place-items:center;font-weight:800;font-size:30px;transition:transform .08s linear;will-change:transform}
.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;opacity:.5}
</style></head><body>
<div class="stage" id="stage"><div class="big" id="big">★</div><div class="hint">把光标靠近图标，它会跟着放大</div></div>
<script>
const state={c1:"#7c3aed",c2:"#ffffff",c3:"#1f2937",bg:"#eef0f4",rad:24,sz:84,mag:1.8,maxd:160};
const r=document.documentElement.style;
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--rad',state.rad+'px');r.setProperty('--sz',state.sz+'px');r.setProperty('--mag',state.mag);r.setProperty('--maxd',state.maxd);}
apply();
const stage=document.getElementById('stage'),big=document.getElementById('big');
function move(e){const b=big.getBoundingClientRect();const cx=b.left+b.width/2,cy=b.top+b.height/2;const x=(e.touches?e.touches[0].clientX:e.clientX),y=(e.touches?e.touches[0].clientY:e.clientY);const d=Math.hypot(x-cx,y-cy);const s=1+Math.max(0,(1-Math.min(d,state.maxd)/state.maxd))*(state.mag-1);big.style.transform='scale('+s.toFixed(3)+')';}
stage.addEventListener('mousemove',move);stage.addEventListener('touchmove',move,{passive:true});
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
