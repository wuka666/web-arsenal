<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分步弹窗</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  .wrap{
    position:relative;width:100%;height:100vh;overflow:hidden;background:var(--page);
    font:500 13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
  }
  .hint{padding:28px var(--pad)}
  .hint h2{font-size:15px;font-weight:500}
  .hint p{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.7}
  .scrim{
    position:absolute;inset:0;background:var(--scrim);z-index:4;
    opacity:0;transition:opacity var(--dur) var(--ease);pointer-events:none;
  }
  .wrap.on .scrim{opacity:1;pointer-events:auto}
  .sheet{
    position:absolute;left:var(--gapEdge);right:var(--gapEdge);bottom:var(--gapEdge);
    z-index:5;background:var(--card);border-radius:var(--radius);overflow:hidden;
    height:0;opacity:0;transform:translateY(var(--rise));
    transition:height var(--dur) var(--ease),opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
  }
  .wrap.on .sheet{opacity:1;transform:translateY(0)}
  .sheet .head{
    display:flex;align-items:center;gap:10px;padding:0 var(--pad);height:var(--headH);
    border-bottom:1px solid var(--edge);
  }
  .sheet .head b{flex:1;font-size:14px;font-weight:500}
  .sheet .head .x{
    width:44px;height:44px;border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;
  }
  .steps{display:flex;gap:5px;padding:0 var(--pad)}
  .steps i{flex:1;height:3px;border-radius:2px;background:var(--edge)}
  .steps i.on{background:var(--accent)}
  /* 轨道按 100%×步数铺开，靠 translateX 换页：内容横向滑动而不是淡入淡出 */
  .track{
    display:flex;width:calc(100% * var(--n));
    transform:translateX(calc(var(--i) * -100% / var(--n)));
    transition:transform var(--dur) var(--ease);
  }
  .page{
    flex:0 0 calc(100% / var(--n));padding:var(--pad);
  }
  .page h3{font-size:var(--fs);font-weight:500;letter-spacing:-.01em}
  .page p{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.6}
  .field{
    margin-top:12px;display:flex;align-items:center;min-height:48px;padding:0 12px;
    border:1px solid var(--edge);border-radius:calc(var(--radius) - 4px);background:var(--field);
  }
  .field span{font-size:13px;color:var(--ink)}
  .foot{
    display:flex;gap:10px;padding:0 var(--pad) var(--pad);
  }
  .foot button{
    flex:1;min-height:44px;border:none;border-radius:calc(var(--radius) - 4px);
    font-size:13px;font-weight:500;cursor:pointer;
  }
  .foot .back{background:transparent;border:1px solid var(--edge);color:var(--ink);flex:0 0 var(--backW)}
  .foot .next{background:var(--accent);color:#fff}
  .open{
    position:absolute;left:var(--pad);top:calc(28px + 120px);
    min-height:44px;padding:0 18px;border:none;border-radius:var(--radius);
    background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="hint">
    <h2>分步弹窗</h2>
    <p>切步骤时内容横向滑动，弹窗高度跟着当前步的内容平滑过渡——不是每步一个固定高度。</p>
  </div>
  <button class="open" id="open">打开弹窗</button>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="head"><b id="ttl">选择套餐</b><button class="x" id="x" aria-label="关闭">×</button></div>
    <div class="steps" id="steps"></div>
    <div class="track" id="track"></div>
    <div class="foot"><button class="back" id="back">上一步</button><button class="next" id="next">下一步</button></div>
  </div>
</div>
<script>
var state={
  page:"#f2f2f5",ink:"#1c1c1e",muted:"#6b7280",card:"#ffffff",field:"#f7f7f9",edge:"#e4e4ea",
  scrim:"rgba(20,22,28,.38)",accent:"#2f6bff",
  radius:16,pad:16,gapEdge:14,headH:54,fs:16,dur:.38,rise:24,backW:96,extra:0
};
var UNIT={radius:"px",pad:"px",gapEdge:"px",headH:"px",fs:"px",dur:"s",rise:"px",backW:"px",extra:"px"};
var root=document.documentElement;
var EASE="cubic-bezier(.22,.61,.36,1)";
var i=0;
var DATA=[
  ["选择套餐","三档里挑一档，随时可升可降。","月度 · ¥39"],
  ["填写信息","只留必要的一栏，其余系统补齐。","手机号"],
  ["确认支付","确认后即时生效，发票可在订单里开。","微信支付"]
];
var wrap=document.getElementById("wrap"),sheet=document.getElementById("sheet");
var track=document.getElementById("track"),steps=document.getElementById("steps");
function apply(){
  for(var k in state){root.style.setProperty("--"+k,state[k]+(UNIT[k]||""));}
  root.style.setProperty("--ease",EASE);
  root.style.setProperty("--n",DATA.length);
  root.style.setProperty("--i",i);
  fit();
}
DATA.forEach(function(d,n){
  var p=document.createElement("div");
  p.className="page";
  p.innerHTML='<h3>'+d[0]+'</h3><p>'+d[1]+'</p><div class="field"><span>'+d[2]+'</span></div>';
  track.appendChild(p);
  var s=document.createElement("i");steps.appendChild(s);
});
/* 高度跟着「当前这一页」走：先量出该页实际高度再写回 sheet，
   固定高度会让短步骤下面留一大块空白、长步骤被裁掉 */
function fit(){
  var pages=track.children;
  if(!pages.length)return;
  sheet.style.height="auto";
  var h=pages[i].offsetHeight;
  sheet.style.height=(state.headH+3+8+h+44+state.pad+state.extra)+"px";
}
function go(n){
  i=Math.max(0,Math.min(DATA.length-1,n));
  apply();
  document.getElementById("ttl").textContent=DATA[i][0];
  document.getElementById("next").textContent=i===DATA.length-1?"完成":"下一步";
  [].forEach.call(steps.children,function(e,j){e.className=j<=i?"on":"";});
}
function show(v){wrap.classList.toggle("on",v);if(v)setTimeout(fit,20);}
document.getElementById("next").addEventListener("click",function(){go(i===DATA.length-1?0:i+1);});
document.getElementById("back").addEventListener("click",function(){go(i-1);});
document.getElementById("x").addEventListener("click",function(){show(false);});
document.getElementById("scrim").addEventListener("click",function(){show(false);});
document.getElementById("open").addEventListener("click",function(){go(0);show(true);});
apply();
go(0);
show(true);
setInterval(function(){go(i>=DATA.length-1?0:i+1);},3200);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
