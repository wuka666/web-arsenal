<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>球面排布</title>
<style>
:root{--bg:#0b1220;--card:#ffffff;--ink:#0f172a;--accent:#22d3ee;--radius:8px;--size:46px;--count:26;--speed:0.3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.scene{width:min(94vw,520px);height:320px;perspective:900px;display:flex;align-items:center;justify-content:center}
.globe{position:relative;width:220px;height:220px;transform-style:preserve-3d;transform:rotateY(var(--R,0deg)) rotateX(-12deg)}
.it{position:absolute;left:50%;top:50%;width:calc(var(--size) * 1px);height:calc(var(--size) * 1px);margin-left:calc(var(--size) * -0.5px);margin-top:calc(var(--size) * -0.5px);background:var(--card);border:2px solid var(--accent);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<div class="scene"><div class="globe" id="gl"></div></div>
<script>
var state={bg:"#0b1220",card:"#ffffff",ink:"#0f172a",accent:"#22d3ee",radius:8,size:46,count:26,speed:0.3};
var r=document.documentElement.style;
function apply(){r.setProperty('--bg',state.bg);r.setProperty('--card',state.card);r.setProperty('--ink',state.ink);r.setProperty('--accent',state.accent);r.setProperty('--radius',state.radius+'px');r.setProperty('--size',state.size+'px');r.setProperty('--count',state.count);r.setProperty('--speed',state.speed);}
apply();
var gl=document.getElementById("gl");
function build(){gl.innerHTML="";var n=Math.round(state.count),R=110;
for(var i=0;i<n;i++){var phi=Math.acos(-1+(2*i+1)/n),theta=Math.PI*(1+Math.sqrt(5))*i;
var x=R*Math.sin(phi)*Math.cos(theta),y=R*Math.sin(phi)*Math.sin(theta),z=R*Math.cos(phi);
var d=document.createElement("div");d.className="it";d.textContent="•";d.style.transform="translate3d("+x.toFixed(1)+"px,"+y.toFixed(1)+"px,"+z.toFixed(1)+"px)";gl.appendChild(d);}}
build();
var r=0;
window.__spin=function(dr){r+=dr;gl.style.setProperty("--R",r+"deg");};
setInterval(function(){window.__spin(parseFloat(state.speed)*2);},40);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
