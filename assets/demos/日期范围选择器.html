<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日期范围选择器</title>
<style>
:root{--c1:#007aff;--c2:#ffffff;--c3:#1f2937;--bg:#f2f2f7;--bd:#d1d1d6;--rad:12px;--w:340px;--pad:14px;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:min(94vw,360px);background:var(--c2);border-radius:var(--rad);padding:16px;box-shadow:0 6px 18px rgba(20,20,40,.08)}
.dr{display:flex;align-items:center;gap:8px}
.dr input{flex:1;min-width:0;padding:var(--pad);border:1px solid var(--bd);border-radius:var(--rad);background:var(--c2);color:var(--c3);font:inherit;outline:none}
.dr input:focus{border-color:var(--c1)}
.dr span{opacity:.5}
.out{margin-top:14px;text-align:center;font-weight:700;color:var(--c1)}
</style></head><body>
<div class="box"><div class="dr"><input type="date" id="a" value="2026-09-20"><span>至</span><input type="date" id="b" value="2026-09-24"></div><div class="out" id="out">共 4 天</div></div>
<script>
const state={c1:"#007aff",c2:"#ffffff",c3:"#1f2937",bg:"#f2f2f7",bd:"#d1d1d6",rad:12,w:340,pad:14};
const r=document.documentElement.style;
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--bd',state.bd);r.setProperty('--rad',state.rad+'px');r.setProperty('--w',state.w+'px');r.setProperty('--pad',state.pad+'px');}
apply();
const a=document.getElementById('a'),b=document.getElementById('b'),out=document.getElementById('out');
function diff(){let d0=new Date(a.value),d1=new Date(b.value);if(isNaN(d0)||isNaN(d1)){out.textContent='请选择日期';return;}if(d1<d0){const t=a.value;a.value=b.value;b.value=t;d0=new Date(a.value);d1=new Date(b.value);}const n=Math.round((d1-d0)/864e5)+1;out.textContent='共 '+n+' 天';}
a.addEventListener('change',diff);b.addEventListener('change',diff);diff();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
