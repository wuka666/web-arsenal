<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>横幅联动演示</title><style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#fff;min-height:100vh;overflow:hidden}
.status{height:28px;background:#f4f5f7;color:#888;font-size:12px;display:flex;align-items:center;justify-content:center}
.banner{position:fixed;top:28px;left:0;right:0;height:0;background:var(--cc,#2f6bff);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:height .4s ease;z-index:10}
.banner.on{height:40px}
.page{transition:transform .4s ease;padding:30px;color:#444;font-size:14px;line-height:1.8}
.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
button{background:var(--cc,#2f6bff);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer}
</style></head><body>
<div class="status">状态栏</div>
<div class="banner" id="bn">新版本已发布，点击查看更新内容</div>
<div class="page" id="pg">新版本已经发布，带来了更快的加载速度、更稳定的同步能力，以及全新的主题外观。<br>我们会持续打磨细节，让每一次使用都更顺手。感谢你的支持。</div>
<div class="controls"><button id="tg">切换横幅</button></div>
<script>
const bn=document.getElementById('bn'),pg=document.getElementById('pg');
const state={cc:'#2f6bff',bh:40,h:.4,text:'新版本已发布，点击查看更新内容'};
function applyStyle(){document.documentElement.style.setProperty('--cc',state.cc);bn.textContent=state.text;bn.style.transition='height '+state.h+'s ease';pg.style.transition='transform '+state.h+'s ease';}
function toggle(on){bn.classList.toggle('on',on);pg.style.transform='translateY('+(on?state.bh:0)+'px)';}
document.getElementById('tg').onclick=()=>toggle(!bn.classList.contains('on'));
applyStyle();toggle(true);
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;state[d.key]=d.value;if(['cc','bh','h','text'].includes(d.key))applyStyle();});
</script></body></html>
