<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>步进器</title>
<style>
:root{--c1:#007aff;--c2:#ffffff;--c3:#1f2937;--bg:#f2f2f7;--bd:#d1d1d6;--rad:14px;--n:3;--min:0;--max:10;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.box{background:var(--c2);border-radius:var(--rad);padding:28px;box-shadow:0 6px 18px rgba(20,20,40,.08);text-align:center}
.step{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:var(--rad);overflow:hidden;background:var(--c2)}
.step button{width:52px;height:52px;border:0;background:var(--c2);color:var(--c1);font-size:26px;cursor:pointer;font-weight:600}
.step button:disabled{color:#c7c7cc}
.step .num{width:72px;text-align:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.cap{margin-top:14px;font-size:13px;opacity:.6}
</style></head><body>
<div class="box"><div class="step"><button id="minus">−</button><span class="num" id="num">3</span><button id="plus">+</button></div><div class="cap" id="cap">数量 0 – 10</div></div>
<script>
const state={c1:"#007aff",c2:"#ffffff",c3:"#1f2937",bg:"#f2f2f7",bd:"#d1d1d6",rad:14,n:3,min:0,max:10};
const r=document.documentElement.style;
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--bd',state.bd);r.setProperty('--rad',state.rad+'px');r.setProperty('--n',state.n);r.setProperty('--min',state.min);r.setProperty('--max',state.max);document.getElementById('num').textContent=state.n;document.getElementById('minus').disabled=state.n<=state.min;document.getElementById('plus').disabled=state.n>=state.max;document.getElementById('cap').textContent='数量 '+state.min+' – '+state.max;}
apply();
document.getElementById('minus').addEventListener('click',()=>{if(state.n>state.min){state.n--;apply();}});
document.getElementById('plus').addEventListener('click',()=>{if(state.n<state.max){state.n++;apply();}});
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
