<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>切面扫描</title>
<style>
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0b1020);font-family:system-ui,"Segoe UI",Arial,sans-serif}
:root{--bg:#0b1020;--slab:#22406b;--scan:#5fd0ff;--inner:#ffce5a;--speed:0.6;--dur:7;--radius:10}
.scene{width:300px;height:160px;transform-style:preserve-3d;transform:perspective(900px) rotateX(-8deg)}
.slab{position:absolute;left:0;top:0;width:300px;height:160px;border-radius:calc(var(--radius)*1px);background:color-mix(in srgb,var(--slab) 85%,transparent);border:1px solid rgba(255,255,255,.2);overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:24px 24px}
.scan{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--scan,#5fd0ff);box-shadow:0 0 18px var(--scan,#5fd0ff);left:0}
.section{position:absolute;left:0;top:50%;width:64px;height:64px;margin-top:-32px;margin-left:-32px;border:2px solid var(--inner,#ffce5a);border-radius:8px;box-shadow:0 0 16px var(--inner,#ffce5a)}
</style>
</head>
<body>
<div class="scene"><div class="slab" id="slab"><div class="grid"></div><div class="section" id="section"></div><div class="scan" id="scan"></div></div></div>
<script>
const state={"bg":"#0b1020","slab":"#22406b","scan":"#5fd0ff","inner":"#ffce5a","speed":0.6,"dur":7,"radius":10};
function apply(){const r=document.documentElement.style;r.setProperty("--bg",state.bg);r.setProperty("--slab",state.slab);r.setProperty("--scan",state.scan);r.setProperty("--inner",state.inner);r.setProperty("--speed",state.speed);r.setProperty("--dur",state.dur);r.setProperty("--radius",state.radius);}
const scan=document.getElementById("scan"),section=document.getElementById("section");const W=300;
function draw(t){const mf=Math.min(0.9,Math.max(0.1,state.speed));let x;if(t<mf){x=-20+(t/mf)*(W+40);}else{x=W/2;}scan.style.left=x+"px";section.style.left=x+"px";const d=Math.abs(x-W/2)/(W/2);const s=40+d*40;section.style.width=s+"px";section.style.height=s+"px";section.style.marginLeft=(-s/2)+"px";section.style.marginTop=(-s/2)+"px";}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now){const t=(now/1000/state.dur)%1;draw(t);if(!reduce)requestAnimationFrame(frame);}
apply();if(reduce)draw(0.5);else requestAnimationFrame(frame);
addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
