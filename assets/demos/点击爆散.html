<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点击爆散演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #1a1a1a;
  }

  .btn {
    position: relative; cursor: pointer; user-select: none; outline: none; border: none;
    background: var(--bg, #1a1a1a); color: var(--tc, #fff);
    font-size: 17px; font-weight: 700; letter-spacing: 3px;
    padding: 18px 56px; border-radius: var(--r, 14px);
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.94); }
  .burst-wrap { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .spark { position: absolute; background: var(--sc, #1a1a1a); pointer-events: none; }

  .spark.go { animation: sparkFly var(--dur, .5s) cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes sparkFly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    60%  { transform: translate(var(--dx), var(--dy)) scale(.7); opacity: 1; }
    100% { transform: translate(var(--dx), calc(var(--dy) + var(--g, 0px))) scale(.3); opacity: var(--fo, 0); }
  }
</style>
</head>
<body>
<button class="btn" id="btn">触发爆散</button>

<script>

  const state = {
    count: 10, dist: 90, dur: 0.5, size: 6, gravity: 60,
    color: "#1a1a1a", shape: "圆点", fade: true,
    btnBg: "#1a1a1a", btnColor: "#ffffff"
  };
  const btn = document.getElementById("btn");
  const root = document.documentElement;
  const wrap = document.createElement("div");
  wrap.className = "burst-wrap";
  document.body.appendChild(wrap);

  function apply() {
    const s = root.style;
    s.setProperty("--dur", state.dur + "s");
    s.setProperty("--g", state.gravity + "px");
    s.setProperty("--fo", state.fade ? 0 : 1);
    s.setProperty("--sc", state.color);
    s.setProperty("--bg", state.btnBg);
    s.setProperty("--tc", state.btnColor);
    s.setProperty("--r", "14px");
  }

  btn.addEventListener("click", (e) => {
    const cx = e.clientX, cy = e.clientY;
    for (let i = 0; i < state.count; i++) {
      const s = document.createElement("span");
      s.className = "spark";

      const sz = state.size * (0.7 + Math.random() * 0.6);
      if (state.shape === "线段") { s.style.width = sz * 3 + "px"; s.style.height = "2px"; s.style.borderRadius = "2px"; }
      else { s.style.width = s.style.height = sz + "px"; s.style.borderRadius = state.shape === "方块" ? "1px" : "50%"; }
      s.style.left = (cx - 2) + "px";
      s.style.top = (cy - 2) + "px";

      const angle = Math.random() * Math.PI * 2;
      const d = state.dist * (0.5 + Math.random());
      s.style.setProperty("--dx", Math.cos(angle) * d + "px");
      s.style.setProperty("--dy", Math.sin(angle) * d + "px");
      wrap.appendChild(s);
      s.classList.add("go");
      s.addEventListener("animationend", () => s.remove());
    }
  });

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });
  apply();
</script>
</body>
</html>
