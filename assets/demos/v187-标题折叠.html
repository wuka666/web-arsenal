<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标题折叠演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: var(--di); height: 100vh; overflow: hidden; }
  .scroll { height: 100vh; overflow-y: auto; }
  .head { position: sticky; top: 0; background: var(--headbg); padding: 22px 20px; will-change: transform, background-color; }
  .head h1 { font-size: var(--fs); color: var(--headc); transform: translateX(var(--tx)); line-height: 1.1; }
  .head .sub { margin-top: 6px; font-size: 13px; color: color-mix(in srgb, var(--headc) 70%, #999); transform: translateX(var(--tx)); }
  .body { padding: 20px; color: #444; font-size: 14px; line-height: 1.9; }
  .body p { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="scroll" id="scroll">
  <div class="head" id="head"><h1>产品设计中的留白</h1></div>
  <div class="body">
    <p>留白不是空缺，而是给内容留出呼吸的位置。信息一旦堆得太满，读者反而不知道从哪里看起。</p>
    <p>先把最重要的内容放到视觉重心上，其余元素主动退让，页面自然就有了层级。</p>
    <p>标题、副文、按钮构成第一屏的三段节奏，越往下越次要，视线不会被无谓的元素打断。</p>
    <p>当页面足够长时，让标题随滚动收起，可以把更多空间让给正文，阅读也更连贯。</p>
    <div style="height:60vh"></div>
  </div>
</div>

<script>
  const state = { scale: 0.6, rise: 80, radius: 14, accent: "#5E6AD2", di: "#fafafa", text: "#1a1a1a" };
  const scroll = document.getElementById("scroll");
  const head = document.getElementById("head");
  function apply() {
    document.documentElement.style.setProperty("--accent", state.accent);
    document.documentElement.style.setProperty("--di", state.di);
    document.documentElement.style.setProperty("--headc", state.text);
  }
  function onScroll() {
    const max = Math.max(scroll.scrollHeight - scroll.clientHeight, 1);
    const p = Math.min(scroll.scrollTop / 220, 1); // 0→1 的折叠进度
    const fs = 24 - (24 - 24 * state.scale) * p;
    const tx = -p * 40;
    const ry = -p * state.rise;
    head.style.setProperty("--fs", fs.toFixed(1) + "px");
    head.style.setProperty("--tx", tx.toFixed(1) + "px");
    head.style.transform = "translateY(" + ry.toFixed(1) + "px)";
    // 底色随进度从透明变为主色（折叠后像吸顶条）
    head.style.setProperty("--headbg", "color-mix(in srgb, var(--accent) " + Math.round(p * 14) + "%, var(--di))");
  }
  scroll.addEventListener("scroll", onScroll);
  window.addEventListener("message", e => { const d = e.data; if (!d || d.type !== "param") return; state[d.key] = d.value; apply(); onScroll(); });
  apply(); onScroll();
</script>
</body>
</html>
