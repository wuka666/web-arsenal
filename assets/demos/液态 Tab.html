<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>液态 Tab</title>
<style>
:root{--barBg:#ffffff;--tabBg:#e8f1ff;--ink:#1c1c1e;--accent:#007aff;--radius:22px;--h:64px;--dur:0.5s;--count:4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.bar{display:flex;align-items:center;gap:6px;height:calc(var(--h) * 1px);padding:0 10px;background:var(--barBg);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.t{position:relative;flex:1;height:calc(var(--h) * 0.66px);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink);border-radius:calc(var(--radius) * 0.8);cursor:pointer;z-index:1;transition:color .25s}
.t.on{color:var(--accent)}
.blob{position:absolute;top:0;height:100%;background:var(--tabBg);border-radius:calc(var(--radius) * 0.8);z-index:0;transition:left calc(var(--dur) * 1s) cubic-bezier(.34,1.56,.64,1),width calc(var(--dur) * 1s) cubic-bezier(.34,1.56,.64,1)}
</style>
<style>
/* 合规补齐：宪法附录B B1 —— 移动端可点元素命中区须 ≥44（WCAG 判命中区不判视觉尺寸，故用 min 尺寸撑开，视觉不变） */
.t{min-width:44px;min-height:44px}
</style>
</head>
<body>
<div class="bar" id="bar"><div class="blob" id="bl"></div></div>
<script>
var state={barBg:"#ffffff",tabBg:"#e8f1ff",ink:"#1c1c1e",accent:"#007aff",radius:22,h:64,dur:0.5,count:4};
var r=document.documentElement.style;
function apply(){r.setProperty('--barBg',state.barBg);r.setProperty('--tabBg',state.tabBg);r.setProperty('--ink',state.ink);r.setProperty('--accent',state.accent);r.setProperty('--radius',state.radius+'px');r.setProperty('--h',state.h+'px');r.setProperty('--dur',state.dur+'s');r.setProperty('--count',state.count);}
apply();
var bar=document.getElementById("bar"),bl=document.getElementById("bl");
var names=["首页","发现","消息","我的"];
function build(){Array.prototype.slice.call(bar.querySelectorAll(".t")).forEach(function(x){x.remove();});
var n=Math.round(state.count);for(var i=0;i<n;i++){var d=document.createElement("div");d.className="t"+(i===cur?" on":"");d.textContent=names[i%names.length];
(function(idx){d.addEventListener("click",function(){go(idx);});})(i);bar.appendChild(d);}}
var cur=0;
function go(i){cur=i;var ts=bar.querySelectorAll(".t");Array.prototype.forEach.call(ts,function(x,i2){x.classList.toggle("on",i2===i);});
var t=ts[i];if(t){var pad=10;var gap=6;var w=(bar.clientWidth-pad*2-gap*(ts.length-1))/ts.length;
bl.style.left=(t.offsetLeft)+"px";bl.style.width=t.offsetWidth+"px";}}
build();
setTimeout(function(){go(0);},50);
window.__go=go;
var ci=0;
setInterval(function(){var n=bar.querySelectorAll(".t").length;ci=(ci+1)%n;window.__go(ci);},1800);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
