<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>磁铁线条</title>
<style>
:root{--c:#b794f6;--bg:#070a12;--n:26;--len:120;--snap:160;--size:2.4}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const state={"c":"#b794f6","bg":"#070a12","n":26,"len":120,"snap":160,"size":2.4};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }

}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H,pts;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;pts=[];for(let i=0;i<state.n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,bx:Math.random()*W,by:Math.random()*H});}rs();addEventListener('resize',rs);
function loop(){ctx.fillStyle=state.bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle=state.c;ctx.lineWidth=1.4;
 for(const p of pts){const d=Math.hypot(p.bx-mx,p.by-my);const t=Math.min(1,state.snap/(d+1));const ex=p.bx+(mx-p.bx)*t,ey=p.by+(my-p.by)*t;
  p.x+=(ex-p.x)*0.2;p.y+=(ey-p.y)*0.2;ctx.globalAlpha=0.25+t*0.6;ctx.beginPath();ctx.moveTo(p.bx,p.by);ctx.lineTo(p.x,p.y);ctx.stroke();
  ctx.globalAlpha=0.8;ctx.beginPath();ctx.arc(p.x,p.y,state.size,0,7);ctx.fillStyle=state.c;ctx.fill();}requestAnimationFrame(loop);}loop();
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
