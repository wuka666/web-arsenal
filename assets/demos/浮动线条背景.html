<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浮动线条背景</title>
<style>
:root{--c:#7fd1ff;--c2:#f0a6ff;--bg:#060910;--n:60;--sp:0.4;--op:0.5}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const state={"c":"#7fd1ff","c2":"#f0a6ff","bg":"#060910","n":60,"sp":0.4,"op":0.5};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }

}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H,pts;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;pts=[];for(let i=0;i<state.n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*state.sp,vy:(Math.random()-.5)*state.sp});}
rs();addEventListener('resize',rs);
const col=a=>a<0.5?state.c:state.c2;
function loop(){ctx.fillStyle=state.bg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=state.op;ctx.lineWidth=1;
 for(let i=0;i<pts.length;i++){const p=pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.strokeStyle=col(i/pts.length);ctx.beginPath();ctx.moveTo(p.x,p.y);
  for(let j=i+1;j<pts.length;j++){const q=pts[j];const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<140){ctx.globalAlpha=state.op*(1-d/140);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}}
  ctx.globalAlpha=state.op;ctx.fillStyle=col(i/pts.length);ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,7);ctx.fill();}
 requestAnimationFrame(loop);}loop();
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
