<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可拖目标线柱状图</title>
<style>
:root{--c1:#22d3ee;--c2:#f59e0b;--c3:#64748b;--bg:#0f172a;--gap:14;--target:60;--n:9;--h:240;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:min(94vw,460px);background:#111827;border-radius:14px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
svg{width:100%;height:auto;display:block;touch-action:none}
.bar{fill:var(--c1)}
.base{stroke:var(--c3);opacity:.3}
.tgt{stroke:var(--c2);stroke-width:3;stroke-dasharray:6 4;cursor:ns-resize}
.tx{fill:var(--c2);font-size:13px;font-weight:700}
</style></head><body>
<div class="box"><svg viewBox="0 0 320 260" id="svg"></svg></div>
<script>
const state={c1:"#22d3ee",c2:"#f59e0b",c3:"#64748b",bg:"#0f172a",gap:14,target:60,n:9,h:240};
const r=document.documentElement.style;
function vals(){const a=[];for(let i=0;i<state.n;i++)a.push(30+Math.abs(Math.sin(i*1.3)*60)+(i%2)*10);return a;}
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--gap',state.gap+'px');r.setProperty('--target',state.target);r.setProperty('--n',state.n);r.setProperty('--h',state.h+'px');const W=320,H=260,p=24;const v=vals();const max=Math.max.apply(null,v);const bw=(W-p*2)/state.n-state.gap;let bars='';v.forEach((x,i)=>{const bh=x/max*(H-p*2-20);const bx=p+i*(bw+state.gap);bars+='<rect class="bar" x="'+bx.toFixed(1)+'" y="'+(H-p-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3"/>';});const ty=H-p-(state.target/100)*(H-p*2-20);const above=v.filter(x=>x>=state.target).length;document.getElementById('svg').innerHTML='<line class="base" x1="'+p+'" y1="'+(H-p)+'" x2="'+(W-p)+'" y2="'+(H-p)+'"/>'+bars+'<line class="tgt" id="tgt" x1="'+p+'" y1="'+ty.toFixed(1)+'" x2="'+(W-p)+'" y2="'+ty.toFixed(1)+'"/><text class="tx" id="tx" x="'+(W-p-2)+'" y="'+(ty-6).toFixed(1)+'" text-anchor="end">目标 '+state.target+' · 达标 '+above+'/'+state.n+'</text>';}
apply();
const svg=document.getElementById('svg');let drag=false;
function setT(y){const H=260,p=24;let t=(H-p-y)/(H-p*2-20)*100;t=Math.max(0,Math.min(100,t));state.target=Math.round(t);apply();}
svg.addEventListener('pointerdown',e=>{drag=true;svg.setPointerCapture(e.pointerId);setT(e.offsetY);});
svg.addEventListener('pointermove',e=>{if(drag)setT(e.offsetY);});
svg.addEventListener('pointerup',()=>drag=false);
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
