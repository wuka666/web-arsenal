<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文字玻璃扭曲</title>
<style>
  :root{
    --fs:96px; --warp:18; --freq:0.012; --speed:1;
    --c:#151b2e; --bg:#eef1f6; --pad:20px;
  }
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:var(--pad)}
  .stage{width:min(92vw,720px);aspect-ratio:3/1;display:grid;place-items:center;
    border-radius:18px;background:
      radial-gradient(120% 120% at 50% 0%, rgba(255,255,255,.7), rgba(255,255,255,0) 60%),
      color-mix(in srgb, var(--bg) 80%, #fff);
    box-shadow:0 10px 30px rgba(20,24,40,.10);overflow:hidden}
  svg{width:100%;height:100%;display:block}
  text{font-weight:800;letter-spacing:.02em;fill:var(--c)}
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 600 200" preserveAspectRatio="xMidYMid meet" id="svg">
      <defs>
        <!-- 玻璃扭曲：用分形噪声做位移图，把文字像素按噪声推挤，形成折射感 -->
        <filter id="warp" x="-25%" y="-25%" width="150%" height="150%">
          <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.012"
            numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap id="disp" in="SourceGraphic" in2="noise" scale="18"
            xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <text id="tx" x="300" y="118" text-anchor="middle" font-size="96"
        dominant-baseline="middle" filter="url(#warp)">玻璃扭曲</text>
    </svg>
  </div>
<script>
  const state={ text:"玻璃扭曲", fs:96, warp:18, freq:0.012, speed:1,
    c:"#151b2e", bg:"#eef1f6", pad:20 };
  const r=document.documentElement.style;
  const turb=document.getElementById('turb');
  const disp=document.getElementById('disp');
  const tx=document.getElementById('tx');
  function apply(){
    r.setProperty('--fs',state.fs+'px');
    r.setProperty('--warp',state.warp);
    r.setProperty('--freq',state.freq);
    r.setProperty('--speed',state.speed);
    r.setProperty('--c',state.c);
    r.setProperty('--bg',state.bg);
    r.setProperty('--pad',state.pad+'px');
    tx.textContent=state.text;
    tx.setAttribute('font-size',state.fs);
    disp.setAttribute('scale',state.warp);
  }
  apply();
  // 让噪声频率随时间轻微起伏，玻璃才有“活着”的流动感
  let t0=performance.now();
  (function loop(now){
    const t=(now-t0)/1000;
    const f=state.freq + Math.sin(t*0.8*state.speed)*0.004;
    turb.setAttribute('baseFrequency', f.toFixed(4)+' '+(f*1.15).toFixed(4));
    requestAnimationFrame(loop);
  })(t0);
  addEventListener('message',e=>{
    const d=e.data; if(!d||d.type!=='param'||!(d.key in state))return;
    state[d.key]=d.value; apply();
  });
</script>
</body>
</html>
