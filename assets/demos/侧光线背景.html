<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>侧光线背景</title>
<style>
:root{--c:#8ab4ff;--bg:#070a12;--w:40;--gap:90;--dur:6;--op:.28;}
*{box-sizing:border-box;margin:0}
body{height:100vh;overflow:hidden;background:var(--bg)}
.stage{position:fixed;inset:0;overflow:hidden}
.bars{position:absolute;top:0;bottom:0;left:calc(-1 * (var(--w) + var(--gap)) * 1px);
  width:calc(100% + (var(--w) + var(--gap)) * 1px);
  background:repeating-linear-gradient(90deg, var(--c) 0 calc(var(--w)*1px), transparent calc(var(--w)*1px) calc((var(--w) + var(--gap))*1px));
  opacity:var(--op);animation:sweep calc(var(--dur)*1s) linear infinite}
@keyframes sweep{to{transform:translateX(calc((var(--w) + var(--gap))*1px))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="stage"><div class="bars"></div></div>
<script>
// 等距平行光条整体横向扫过（平移一个"条宽+间距"即无缝循环），与放射状光线机制不同
const state={c:"#8ab4ff",bg:"#070a12",w:40,gap:90,dur:6,op:.28};
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }
}
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
