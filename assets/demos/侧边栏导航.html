<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>侧边栏导航演示</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --theme:#2563eb; --bg:#1f2937; --text:#e5e7eb; --hover:#374151; --active:#2563eb; --we:220px; --wc:64px; --dur:.3s; --ic:20px; --fs:14px; }
  body { font-family:system-ui,"Microsoft YaHei",sans-serif; display:flex; min-height:100vh; background:#f3f4f6; }
  #side {
    width:var(--we); background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; padding:18px 12px; gap:6px;
    transition:width var(--dur) cubic-bezier(.16,1,.3,1); overflow:hidden; flex:none;
  }
  #side.collapsed { width:var(--wc); }
  .top { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .toggle { cursor:pointer; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:var(--hover); color:#fff; font-size:20px; flex:none; }
  .brand { font-weight:800; font-size:16px; white-space:nowrap; color:#fff; }
  #side.collapsed .brand { display:none; }
  .item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:var(--fs); white-space:nowrap; transition:background .15s,color .15s; }
  .item:hover { background:var(--hover); }
  .item.active { background:var(--active); color:#fff; }
  .item svg { width:var(--ic); height:var(--ic); flex:none; }
  #side.collapsed .label { display:none; }
  .content { flex:1; padding:40px; }
  .content h1 { margin-bottom:10px; color:#111827; }
  .content p { color:#6b7280; line-height:1.9; }
  .hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); font-size:13px; color:#9ca3af; }
</style>
</head>
<body>
  <aside id="side">
    <div class="top">
      <div class="toggle" id="toggle">≡</div>
      <div class="brand" id="brand">Studio</div>
    </div>
    <div id="items"></div>
  </aside>
  <main class="content">
    <h1>侧边栏导航</h1>
    <p>左侧竖排布局，支持折叠展开：收起后仅显示图标，为后台、编辑器类页面释放内容空间。点左上角「≡」试试折叠。</p>
  </main>
  <p class="hint">点左上「≡」折叠 / 展开侧边栏</p>
<script>
  const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>';
  const state = {
    theme:"#2563eb", bg:"#1f2937", text:"#e5e7eb", hover:"#374151", active:"#2563eb",
    widthExpand:220, widthCollapse:64, dur:0.3, iconSize:20, fontSize:14,
    brand:"Studio", items:"概览,项目,素材,设置"
  };
  const side=document.getElementById("side"), itemsEl=document.getElementById("items"), brandEl=document.getElementById("brand");
  let activeIdx=0;
  function render(){
    itemsEl.innerHTML="";
    state.items.split(",").forEach((t,i)=>{
      const d=document.createElement("div"); d.className="item"+(i===activeIdx?" active":"");
      d.innerHTML=ICON+'<span class="label">'+t+'</span>';
      d.onclick=()=>{ activeIdx=i; render(); };
      itemsEl.appendChild(d);
    });
  }
  document.getElementById("toggle").onclick=()=> side.classList.toggle("collapsed");
  function apply(){
    const R=document.documentElement.style;
    R.setProperty("--theme",state.theme); R.setProperty("--bg",state.bg); R.setProperty("--text",state.text);
    R.setProperty("--hover",state.hover); R.setProperty("--active",state.active);
    R.setProperty("--we",state.widthExpand+"px"); R.setProperty("--wc",state.widthCollapse+"px");
    R.setProperty("--dur",state.dur+"s"); R.setProperty("--ic",state.iconSize+"px"); R.setProperty("--fs",state.fontSize+"px");
    brandEl.textContent=state.brand; render();
  }
  window.addEventListener("message", e=>{ const d=e.data; if(!d||d.type!=="param")return; state[d.key]=d.value; apply(); });
  apply();
</script>
</body>
</html>
