<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>捏合缩放</title>
<style>
:root{--accent:#007aff;--bg:#ffffff;--ink:#222222;--imgbg:#ffd9c2;--radius:12;--level:1;--dur:0.3;--fs:15}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding:16px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--ink)}
.lv{display:flex;gap:6px}
.lv button{width:34px;height:30px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer;font-family:inherit;color:var(--ink)}
.lv button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wrap{transition:all calc(var(--dur)*1s) ease}
.wrap.l0 .it{height:200px;margin-bottom:12px;font-size:18px}
.wrap.l1{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wrap.l1 .it{height:110px;font-size:13px}
.wrap.l2 .it{height:auto;padding:12px 4px;border-bottom:1px solid #eee;font-size:var(--fs)px;display:flex;align-items:center}
.it{background:var(--imgbg);border-radius:var(--radius)px;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
</style>
<style>
/* 合规补齐：宪法附录B B1 —— 移动端可点元素命中区须 ≥44（WCAG 判命中区不判视觉尺寸，故用 min 尺寸撑开，视觉不变） */
button{min-width:44px;min-height:44px}
</style>
</head>
<body>
<div class="head"><b>相册</b><div class="lv" id="lv"><button data-l="0">大</button><button data-l="1" class="on">中</button><button data-l="2">文</button></div></div>
<div class="wrap l1" id="wrap">
  <div class="it">照片1</div><div class="it">照片2</div><div class="it">照片3</div>
  <div class="it">照片4</div><div class="it">照片5</div><div class="it">照片6</div>
  <div class="it">照片7</div><div class="it">照片8</div><div class="it">照片9</div>
</div>
<script>
var state={accent:'#007aff',bg:'#ffffff',ink:'#222222',imgbg:'#ffd9c2',radius:12,level:1,dur:0.3,fs:15};
var root=document.documentElement;
var UNIT={radius:'px',level:'',dur:'s',fs:'px'};
function apply(){for(var k in state){root.style.setProperty('--'+k,state[k]+(UNIT[k]||''));if(k==='level')setLevel(state.level);}}
var wrap=document.getElementById('wrap'),lv=document.getElementById('lv');
function setLevel(l){wrap.className='wrap l'+l;lv.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.l===l);});}
lv.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.level=+b.dataset.l;apply();});

window.addEventListener('message', function(e){
  var d = e.data;
  if(!d || d.type !== 'param') return;
  if(!(d.key in state)) return;
  state[d.key] = d.value;
  apply();
});
</script>
</body>
</html>
