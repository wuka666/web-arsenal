<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>竖向整屏视频流</title>
<style>
  :root{--open:1}
  *{box-sizing:border-box;margin:0;padding:0}
  body{overflow:hidden}
  .wrap{
    position:relative;width:100%;height:100vh;overflow:hidden;background:var(--bg);
    font:500 13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;
    -webkit-user-select:none;user-select:none;
  }
  /* 竖向轨道：一屏一项，靠 translateY 走位；--open 是「是否已滑到该页」的连续量，供进度条插值 */
  .track{
    position:absolute;left:0;top:0;width:100%;
    will-change:transform;
    transition:transform var(--dur) var(--ease);
  }
  .slide{
    position:relative;width:100%;height:100vh;overflow:hidden;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 16px 0;
  }
  .art{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 20% 10%,var(--accent) 0%,transparent 55%),
      linear-gradient(160deg,#1b1b22 0%,#05050a 100%);
    transform:scale(var(--zoom));
    transition:transform 1.2s var(--ease);
  }
  .slide.on .art{transform:scale(1)}
  .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.72) 100%)}
  .meta{position:relative;z-index:2;padding-bottom:calc(var(--tabH) + 26px);opacity:calc(1 - var(--open) * .0);transition:opacity .3s}
  .meta h3{font-size:17px;font-weight:500;letter-spacing:.01em;margin-bottom:6px}
  .meta p{color:var(--metaFg);font-size:12px;opacity:.72}
  .bar{position:relative;z-index:2;height:calc(var(--tabH));display:flex;align-items:center;gap:14px;margin:0 -16px;padding:0 16px;background:var(--metaBg)}
  .av{width:34px;height:34px;border-radius:50%;background:var(--accent);flex:none}
  .bar .t{flex:1}
  .bar .t b{display:block;font-weight:500;font-size:12px}
  .bar .t span{font-size:11px;color:var(--metaFg);opacity:.7}
  .nav{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    width:44px;height:44px;border-radius:50%;border:none;
    background:var(--dotBg);color:var(--dot);font-size:16px;cursor:pointer;z-index:5;
  }
  .dots{position:absolute;right:16px;top:calc(50% + 40px);z-index:5;display:flex;flex-direction:column;gap:var(--gap)}
  .dots i{width:var(--dotW);height:3px;border-radius:2px;background:var(--dot);opacity:.32;transition:opacity .3s,width .3s}
  .dots i.on{opacity:1;width:calc(var(--dotW) + 6px)}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <button class="nav" id="nav" aria-label="下一项">›</button>
</div>
<script>
var state={bg:"#05050a",accent:"#ff375f",dur:0.46,gap:8,zoom:1.22,tabH:64,metaFg:"#ffffff",metaBg:"rgba(12,12,16,.72)",dot:"#ffffff",dotBg:"rgba(255,255,255,.16)",dotW:14};
var UNIT={dur:"s",gap:"px",zoom:"",tabH:"px",dotW:"px"};
var root=document.documentElement;
var idx=0,N=4;
function apply(){
  for(var k in state){root.style.setProperty("--"+k,state[k]+(UNIT[k]||""));}
  root.style.setProperty("--open",0);
}
var track=document.getElementById("track"),dots=document.getElementById("dots");
var DATA=[
  {h:"深夜厨房·一锅到底",p:"跟着做 3 道下饭菜 · 22:10"},
  {h:"骑行 40 公里看江",p:"第一视角 · 全程无剪辑"},
  {h:"旧书店的午后",p:"在城市里慢下来 · 治愈向"},
  {h:"手冲咖啡的三分钟",p:"器具与手法 · 新手向"}
];
DATA.forEach(function(d,i){
  var s=document.createElement("div");
  s.className="slide";
  s.innerHTML='<div class="art"></div><div class="veil"></div>'+
    '<div class="meta"><h3>'+d.h+'</h3><p>'+d.p+'</p></div>'+
    '<div class="bar"><div class="av"></div><div class="t"><b>账号 '+i+'</b><span>3.2 万 赞</span></div></div>';
  track.appendChild(s);
  var dot=document.createElement("i");dots.appendChild(dot);
});
function go(i){
  idx=(i+N)%N;
  track.style.transform="translateY("+(-idx*100)+"%)";
  [].forEach.call(track.children,function(e,j){e.className="slide"+(j===idx?" on":"");});
  [].forEach.call(dots.children,function(e,j){e.className=j===idx?"on":"";});
}
apply();
go(0);
function next(){go(idx+1);}
document.getElementById("nav").addEventListener("click",next);
dots.addEventListener("click",function(e){if(e.target.tagName==="I")go([].indexOf.call(dots.children,e));});
/* 拖动跟随：竖向拖拽实时跟手，松手按位移阈值吸附到相邻项 */
var sy=0,dy=0,drag=false;
var wrap=document.getElementById("wrap");
wrap.addEventListener("touchstart",function(e){drag=true;sy=e.touches[0].clientY;dy=0;},{passive:true});
wrap.addEventListener("touchmove",function(e){if(drag)dy=e.touches[0].clientY-sy;},{passive:true});
wrap.addEventListener("touchend",function(){if(drag){if(dy<-60)go(idx+1);else if(dy>60)go(idx-1);drag=false;}});
wrap.addEventListener("mousedown",function(e){drag=true;sy=e.clientY;dy=0;});
window.addEventListener("mouseup",function(e){if(drag){var d=e.clientY-sy;if(d<-60)go(idx+1);else if(d>60)go(idx-1);drag=false;}});
setInterval(next,4200);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
