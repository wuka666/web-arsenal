<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dropdown 下拉选择</title>
<style>
:root{--bg:#f8fafc;--ink:#0f172a;--menuBg:#ffffff;--accent:#0ea5e9;--radius:8px;--w:200px;--itemH:36px;--dur:0.18s}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.dd{position:relative;width:calc(var(--w) * 1px)}
.sel{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:var(--radius);background:var(--menuBg);color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--menuBg);border:1px solid #e2e8f0;border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.1);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity calc(var(--dur) * 1s),transform calc(var(--dur) * 1s)}
.menu.on{opacity:1;transform:translateY(0);pointer-events:auto}
.mi{padding:0 12px;height:calc(var(--itemH) * 1px);display:flex;align-items:center;font-size:13px;color:var(--ink);cursor:pointer}
.mi:hover{background:#f1f5f9}
.mi.on{color:var(--accent);font-weight:700}
</style>
<style>
/* 合规补齐：宪法附录B B1 —— 移动端可点元素命中区须 ≥44（WCAG 判命中区不判视觉尺寸，故用 min 尺寸撑开，视觉不变） */
.sel{min-width:44px;min-height:44px}
.mi{min-width:44px;min-height:44px}
</style>
</head>
<body>
<div class="dd"><div class="sel" id="s"><span id="sv">请选择</span><span>▾</span></div><div class="menu" id="m"></div></div>
<script>
var state={bg:"#f8fafc",ink:"#0f172a",menuBg:"#ffffff",accent:"#0ea5e9",radius:8,w:200,itemH:36,dur:0.18};
var r=document.documentElement.style;
function apply(){r.setProperty('--bg',state.bg);r.setProperty('--ink',state.ink);r.setProperty('--menuBg',state.menuBg);r.setProperty('--accent',state.accent);r.setProperty('--radius',state.radius+'px');r.setProperty('--w',state.w+'px');r.setProperty('--itemH',state.itemH+'px');r.setProperty('--dur',state.dur+'s');}
apply();
var s=document.getElementById("s"),m=document.getElementById("m"),sv=document.getElementById("sv");
var opts=["按时间排序","按热度排序","按名称排序"];
opts.forEach(function(o){var d=document.createElement("div");d.className="mi";d.textContent=o;
d.addEventListener("click",function(){sv.textContent=o;m.classList.remove("on");
Array.prototype.forEach.call(m.children,function(x){x.classList.remove("on");});d.classList.add("on");});
m.appendChild(d);});
s.addEventListener("click",function(e){e.stopPropagation();m.classList.toggle("on");});
document.addEventListener("click",function(e){if(!m.contains(e.target))m.classList.remove("on");});
setTimeout(function(){m.classList.add("on");},350);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
