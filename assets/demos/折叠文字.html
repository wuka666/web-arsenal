<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>折叠文字</title>
<style>
:root{--c:#222;--bg:#faf7f0;--dur:1.4;--fs:104;--persp:800;--fold:1;}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;background:var(--bg);overflow:hidden;
  font-family:system-ui,"Segoe UI",Arial,sans-serif}
.word{display:flex;perspective:calc(var(--persp)*1px)}
.word span{display:inline-block;font-weight:800;font-size:calc(var(--fs)*1px);color:var(--c);
  transform-origin:top center;transform:rotateX(calc(var(--fold) * -90deg));
  animation:fold calc(var(--dur)*1s) cubic-bezier(.2,1,.3,1) forwards}
@keyframes fold{to{transform:rotateX(0)}}
@media(prefers-reduced-motion:reduce){.word span{transform:none;animation:none}}
</style>
</head>
<body>
<div class="word" id="w"></div>
<script>
// 逐字从顶部翻折落下（rotateX -90→0）；fold 控制起始折角倍数
const state={text:"FOLD",c:"#222",bg:"#faf7f0",dur:1.4,fs:104,persp:800,fold:1};
function apply(){
  const r=document.documentElement.style;
  r.setProperty('--c',state.c); r.setProperty('--bg',state.bg);
  r.setProperty('--dur',state.dur); r.setProperty('--fs',state.fs);
  r.setProperty('--persp',state.persp); r.setProperty('--fold',state.fold);
  const w=document.getElementById('w'); w.innerHTML='';
  const n=state.text.length;
  for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=state.text[i];
    s.style.animationDelay=(i*0.12)+'s'; w.appendChild(s);}
}
apply();
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
