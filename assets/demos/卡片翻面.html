<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡片翻面演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #1a1a1a;
    perspective: 1200px;
  }
  .hint { font-size: 13px; color: #999; }
  .card3d {
    width: var(--w, 220px); height: var(--h, 300px); cursor: pointer; position: relative;
    transform-style: preserve-3d;
    transition: transform var(--dur, .6s) cubic-bezier(.34,1.3,.5,1);
  }
  /* 翻转轴由参数决定：rotateY（左右）或 rotateX（上下） */
  .card3d.flip { transform: var(--rot, rotateY(180deg)); }
  /* 关键：正反两面都隐藏自己的背面，翻面时不会把另一面照穿 */
  .face {
    position: absolute; inset: 0; border-radius: var(--r, 16px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    font-weight: 700;
  }
  .front { background: var(--fb, #1a1a1a); color: var(--fc, #fff); }
  .back { background: var(--bb, #fff); border: 2px solid var(--bc, #1a1a1a); color: var(--bc, #1a1a1a); transform: var(--rot, rotateY(180deg)); }
  .sub { font-size: 12px; font-weight: 400; opacity: .7; }
</style>
</head>
<body>
<div class="card3d" id="card" tabindex="0">
  <div class="face front">正面<span class="sub">点我翻面</span></div>
  <div class="face back">背面<span class="sub">再点翻回去</span></div>
</div>
<p class="hint">点卡片：整张沿中线翻转，正反两面互不穿帮</p>
<script>
  // 默认参数（父页面详情页可调）
  const state = {
    dur: 0.6, size: 220, radius: 16, dir: "左右翻",
    frontBg: "#1a1a1a", frontColor: "#ffffff", backBg: "#ffffff", backColor: "#1a1a1a"
  };
  const card = document.getElementById("card");
  const root = document.documentElement;

  function apply() {
    const s = root.style;
    s.setProperty("--dur", state.dur + "s");
    s.setProperty("--w", state.size + "px");
    s.setProperty("--h", Math.round(state.size * 300 / 220) + "px"); // 保持 220:300 比例
    s.setProperty("--r", state.radius + "px");
    s.setProperty("--rot", state.dir === "上下翻" ? "rotateX(180deg)" : "rotateY(180deg)");
    s.setProperty("--fb", state.frontBg);
    s.setProperty("--fc", state.frontColor);
    s.setProperty("--bb", state.backBg);
    s.setProperty("--bc", state.backColor);
  }
  function flip() { card.classList.toggle("flip"); }
  card.addEventListener("click", flip);
  card.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  });

  // 接收父页面（index.html 详情页）传来的参数
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });
  apply();
</script>
</body>
</html>
