<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>批量勾选</title>
<style>
:root{--c1:#007aff;--c2:#ffffff;--c3:#1f2937;--bg:#f2f2f7;--bd:#e5e7eb;--rad:12px;--pad:14px;--gap:10px;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:min(92vw,340px);background:var(--c2);border-radius:var(--rad);padding:var(--pad);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.bar{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.bar .all{font-weight:600}
.bar .cnt{margin-left:auto;color:var(--c1);font-weight:700}
.list{display:flex;flex-direction:column;gap:var(--gap)}
.it{display:flex;align-items:center;gap:12px;cursor:pointer}
.it input{width:20px;height:20px;accent-color:var(--c1)}
</style></head><body>
<div class="box"><div class="bar"><input type="checkbox" id="all"><span class="all">全选</span><span class="cnt" id="cnt">0/5</span></div><div class="list" id="list"></div></div>
<script>
const state={c1:"#007aff",c2:"#ffffff",c3:"#1f2937",bg:"#f2f2f7",bd:"#e5e7eb",rad:12,pad:14,gap:10};
const r=document.documentElement.style;
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--bd',state.bd);r.setProperty('--rad',state.rad+'px');r.setProperty('--pad',state.pad+'px');r.setProperty('--gap',state.gap+'px');}
const items=['设计稿评审','接口联调','埋点校对','回归测试','上线清单'];const sel=new Set();
function render(){const l=document.getElementById('list');l.innerHTML='';items.forEach((t,i)=>{const d=document.createElement('label');d.className='it';d.innerHTML='<input type="checkbox" '+(sel.has(i)?'checked':'')+'>'+t;d.querySelector('input').addEventListener('change',e=>{if(e.target.checked)sel.add(i);else sel.delete(i);sync();});l.appendChild(d);});document.getElementById('cnt').textContent=sel.size+'/'+items.length;document.getElementById('all').checked=sel.size===items.length;}
function sync(){render();}
document.getElementById('all').addEventListener('change',e=>{if(e.target.checked)items.forEach((_,i)=>sel.add(i));else sel.clear();render();});
apply();render();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
