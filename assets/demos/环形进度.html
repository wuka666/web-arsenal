<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>环形进度条演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #1a1a1a;
  }

  .ring-wrap {
    position: relative;
    width: var(--size, 120px); height: var(--size, 120px);
  }
  .ring-track { fill: none; stroke: var(--track, #eee); stroke-width: var(--thick, 10); }
  .ring {
    fill: none; stroke: var(--color, #1a1a1a); stroke-width: var(--thick, 10);
    stroke-linecap: var(--cap, round);
    stroke-dasharray: 326.7; stroke-dashoffset: 326.7;
    transform: rotate(var(--rot, -90deg)); transform-origin: center;
    filter: drop-shadow(var(--glow, 0 0 0 transparent));
  }
  .ring-pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: var(--pctSize, 24px); font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--color, #1a1a1a);
  }
  .btn {
    cursor: pointer; user-select: none; border: none; outline: none;
    background: #1a1a1a; color: #fff; font-size: 14px; font-weight: 700;
    padding: 10px 24px; border-radius: 8px;
  }
  /* 四档刻度：环读到一半时数字会说话、刻度让你一眼看出「到第几档」，不用读百分比 */
  .ring-tick { stroke: var(--track, #eee); stroke-width: 2; stroke-linecap: round; transition: stroke .2s; }
  .ring-tick.pass { stroke: var(--color, #1a1a1a); }
</style>
<style>
/* 合规补齐：宪法附录B B1 —— 移动端可点元素命中区须 ≥44（WCAG 判命中区不判视觉尺寸，故用 min 尺寸撑开，视觉不变） */
.btn{min-width:44px;min-height:44px}
</style>
</head>
<body>
<div class="ring-wrap" id="wrap">
  <svg viewBox="0 0 120 120" id="svg">
    <circle class="ring-track" id="ringTrack" cx="60" cy="60" r="52"></circle>
    <circle class="ring" id="ring" cx="60" cy="60" r="52"></circle>
    <g id="ticks"></g>
  </svg>
  <div class="ring-pct" id="pct">0%</div>
</div>
<button class="btn" id="btn">重新转</button>

<script>

  const state = {
    dur: 2,
    easing: "easeOut",
    size: 120,
    thick: 10,
    cap: "round",
    rot: -90,
    showPct: true,
    pctSize: 24,
    glow: false,
    reverse: false,
    color: "#1a1a1a",
    track: "#eee"
  };
  const ring = document.getElementById("ring");
  const ringTrack = document.getElementById("ringTrack");
  const pct = document.getElementById("pct");
  const wrap = document.getElementById("wrap");
  const svg = document.getElementById("svg");
  const ticksG = document.getElementById("ticks");
  const NS = "http://www.w3.org/2000/svg";
  // 25/50/75/100 四档，按 12→3→6→9 点方向排（与 --rot 起点对齐）
  const TICK_ANGLES = [0, 90, 180, 270];
  const tickEls = TICK_ANGLES.map(() => {
    const l = document.createElementNS(NS, "line");
    l.setAttribute("class", "ring-tick");
    ticksG.appendChild(l);
    return l;
  });
  function layoutTicks(r, circ) {
    tickEls.forEach((l, i) => {
      const a = (TICK_ANGLES[i] - 90) * Math.PI / 180;
      const r1 = r + 4, r2 = r + 9;
      l.setAttribute("x1", 60 + r1 * Math.cos(a));
      l.setAttribute("y1", 60 + r1 * Math.sin(a));
      l.setAttribute("x2", 60 + r2 * Math.cos(a));
      l.setAttribute("y2", 60 + r2 * Math.sin(a));
    });
  }
  function markTicks(p) {
    tickEls.forEach((l, i) => l.classList.toggle("pass", p >= (i + 1) * 25));
  }

  function ease(t) {
    if (state.easing === "linear") return t;
    if (state.easing === "easeInOut") return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
    return 1 - Math.pow(1 - t, 3);
  }

  function applyStyle() {
    const root = document.documentElement;
    root.style.setProperty("--color", state.color);
    root.style.setProperty("--track", state.track);
    root.style.setProperty("--thick", state.thick + "px");
    root.style.setProperty("--size", state.size + "px");
    root.style.setProperty("--cap", state.cap === "butt" ? "butt" : "round");
    root.style.setProperty("--rot", state.rot + "deg");
    root.style.setProperty("--pctSize", state.pctSize + "px");
    root.style.setProperty("--showPct", state.showPct ? "flex" : "none");
    pct.style.display = state.showPct ? "flex" : "none";
    root.style.setProperty("--glow", state.glow
      ? ("0 0 6px " + state.color + "88")
      : "0 0 0 transparent");
    svg.setAttribute("width", state.size);
    svg.setAttribute("height", state.size);
    const r = 52 - Math.min(state.thick / 2, 8);
    ring.setAttribute("r", r);
    ringTrack.setAttribute("r", r);
    const circ = 2 * Math.PI * r;
    ring.style.strokeDasharray = circ;
    ring.style.strokeDashoffset = circ;
    layoutTicks(r);
    markTicks(0);
    pct.textContent = "0%";
  }

  let raf = 0;
  function run() {
    cancelAnimationFrame(raf);
    const r = 52 - Math.min(state.thick / 2, 8);
    const circ = 2 * Math.PI * r;
    ring.style.strokeDashoffset = circ;
    markTicks(0);
    pct.textContent = "0%";
    const start = performance.now();
    const dur = state.dur * 1000;
    const dir = state.reverse ? -1 : 1;
    function tick(now) {
      const t = Math.min((now - start) / dur, 1);
      const p = Math.round(100 * ease(t));
      ring.style.strokeDashoffset = circ * (1 - p / 100);
      markTicks(p);
      pct.textContent = p + "%";
      if (t < 1) raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
  }
  document.getElementById("btn").addEventListener("click", run);
  applyStyle();
  run();

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    applyStyle();
    if (d.key === "dur" || d.key === "easing" || d.key === "reverse") run();
  });
</script>
</body>
</html>
