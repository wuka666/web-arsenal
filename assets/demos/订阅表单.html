<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{ --ease: cubic-bezier(.44,0,.56,1); }
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}

  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg,#fff)}
  .box{position:relative;width:300px}

  .inp{
    width:100%;box-sizing:border-box;padding:18px 14px 8px;font-size:15px;
    border:1.5px solid var(--ib,#ccc);border-radius:var(--ir,10px);
    background:var(--bg,#fff);color:#222;outline:none;
    transition:border-color var(--dur,.3s) var(--ease),background var(--dur,.3s) var(--ease);
  }
  .inp:focus{border-color:var(--ifb,#111)}

  .flab{
    position:absolute;left:15px;top:16px;font-size:15px;color:var(--lc,#888);
    pointer-events:none;transition:all var(--dur,.3s) var(--ease);
  }
  .inp:focus ~ .flab,.inp:not(:placeholder-shown) ~ .flab{
    top:6px;font-size:11px;transform:translateY(calc(var(--fs,8px) * -1px));color:var(--ifb,#111)
  }

  .btn{
    margin-top:14px;width:100%;box-sizing:border-box;border:none;cursor:pointer;
    padding:13px;font-size:15px;font-weight:600;border-radius:var(--br,10px);
    background:var(--bc,#111);color:var(--btc,#fff);
    transition:background var(--dur,.3s) var(--ease);
  }
  .btn:disabled{opacity:.7;cursor:default}
  .btn.done{background:var(--sc,#1a9e4b)}
</style></head>
<body>
  <div class="box">
    <input class="inp" id="inp" type="email" placeholder=" " autocomplete="off">
    <label class="flab" for="inp" id="flab">输入邮箱订阅更新</label>
    <button class="btn" id="btn">订阅</button>
  </div>

  <script>

  const state = {
    radius:10, border:"#cccccc", focusBorder:"#111111", bg:"#ffffff",
    btnRadius:10, btnColor:"#111111", btnText:"#ffffff", labelColor:"#888888",
    focusShift:8, dur:0.3, success:"#1a9e4b", btnTextStr:"订阅"
  };
  const inp = document.getElementById("inp"), btn = document.getElementById("btn"), root = document.documentElement;

  function apply() {
    const s = root.style;
    s.setProperty("--ir", state.radius + "px");
    s.setProperty("--ib", state.border);
    s.setProperty("--ifb", state.focusBorder);
    s.setProperty("--bg", state.bg);
    s.setProperty("--br", state.btnRadius + "px");
    s.setProperty("--bc", state.btnColor);
    s.setProperty("--btc", state.btnText);
    s.setProperty("--lc", state.labelColor);
    s.setProperty("--fs", state.focusShift);
    s.setProperty("--dur", state.dur + "s");
    s.setProperty("--sc", state.success);
    btn.textContent = state.btnTextStr;
  }

  btn.addEventListener("click", () => {
    if (btn.classList.contains("done")) return;
    btn.disabled = true; btn.textContent = "订阅中…";
    setTimeout(() => {
      btn.classList.add("done"); btn.textContent = "已订阅 ✓"; btn.disabled = false;
    }, 1200);
  });
  window.addEventListener("message", (e) => {
    const d = e.data; if (!d || d.type !== "param") return;
    state[d.key] = d.value; apply();
  });
  apply();
  </script>
</body></html>
