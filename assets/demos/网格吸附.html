<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网格吸附演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { height: 100vh; overflow: hidden; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #eef0f4; }
  .stage { position: absolute; inset: 0; overflow: hidden; }

  .bg { position: absolute; inset: -60px; background: linear-gradient(135deg, #dfe7f5, #e9e2f2 55%, #dbeaf0);
    transition: transform var(--dur) var(--ease), filter var(--dur) var(--ease); }

  .gridlines { position: absolute; inset: 0; opacity: 0; transition: opacity var(--dur) ease;
    background-image: linear-gradient(var(--gridc) 1px, transparent 1px), linear-gradient(90deg, var(--gridc) 1px, transparent 1px);
    background-size: var(--cell) var(--cell); background-position: center; }

  .cell { position: absolute; transition: transform var(--dur) var(--ease), width var(--dur) var(--ease), height var(--dur) var(--ease); }
  .inner { position: absolute; inset: 0; border-radius: var(--radius); background: var(--cardbg);
    box-shadow: 0 6px 18px rgba(20, 30, 60, .1); display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #9aa4b8; font-size: 18px; }
  .btn { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); cursor: pointer; border: none;
    background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 700; padding: 10px 26px; border-radius: 8px; }
  .btn:active { transform: translateX(-50%) scale(.96); }

</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" id="bg"></div>
  <div class="gridlines" id="gridlines"></div>
  <div id="cells"></div>
</div>
<button class="btn" id="btn">吸附到网格</button>

<script>

  const state = {
    cols: 3,
    gap: 20,
    radius: 12,
    dur: 0.6,
    stagger: 0.08,
    ease: "先快后慢",
    parallax: 14,
    bgShift: 10,
    gridShow: true,
    gridColor: "#c5cddd",
    cardBg: "#ffffff",
    scatter: 70
  };

  const EASE = { "先快后慢": "cubic-bezier(.22,1,.36,1)", "匀速": "linear", "回弹": "cubic-bezier(.34,1.56,.64,1)" };
  const gridlines = document.getElementById("gridlines");
  const cellsBox = document.getElementById("cells");
  const bg = document.getElementById("bg");
  const btn = document.getElementById("btn");
  let grid = false, cells = [];

  const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5; return x - Math.floor(x); };

  function build() {
    cellsBox.innerHTML = "";
    cells = [];
    const rows = 3, pad = 60;
    const cardW = Math.min(180, (innerWidth - pad * 2 - state.gap * (state.cols - 1)) / state.cols);
    const cardH = Math.min(120, (innerHeight - pad * 2 - state.gap * (rows - 1)) / rows);
    const totalW = state.cols * cardW + state.gap * (state.cols - 1);
    const totalH = rows * cardH + state.gap * (rows - 1);
    const x0 = (innerWidth - totalW) / 2, y0 = (innerHeight - totalH) / 2;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        const i = r * state.cols + c;
        const cell = document.createElement("div");
        cell.className = "cell";
        const inner = document.createElement("div");
        inner.className = "inner";
        inner.textContent = String(i + 1).padStart(2, "0");
        cell.appendChild(inner);
        cellsBox.appendChild(cell);
        cells.push({
          el: cell, inner, i, w: cardW, h: cardH,
          gx: x0 + c * (cardW + state.gap), gy: y0 + r * (cardH + state.gap),
          ox: (rnd(i) - 0.5) * 2 * state.scatter,
          oy: (rnd(i + 50) - 0.5) * 2 * state.scatter,
          rot: (rnd(i + 99) - 0.5) * 14,
          depth: 0.4 + rnd(i + 7) * 0.6
        });
      }
    }

    document.documentElement.style.setProperty("--cell", (cardW + state.gap) + "px");
    layout();
  }

  function layout() {
    cells.forEach(c => {
      const x = grid ? c.gx : c.gx + c.ox;
      const y = grid ? c.gy : c.gy + c.oy;
      c.el.style.width = c.w + "px";
      c.el.style.height = c.h + "px";
      c.el.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (grid ? 0 : c.rot) + "deg)";
      c.el.style.transitionDelay = (c.i * state.stagger) + "s";
    });
    gridlines.style.opacity = (grid && state.gridShow) ? 0.8 : 0;
  }

  function apply() {
    const root = document.documentElement.style;
    root.setProperty("--dur", state.dur + "s");
    root.setProperty("--ease", EASE[state.ease] || EASE["先快后慢"]);
    root.setProperty("--radius", state.radius + "px");
    root.setProperty("--gridc", state.gridColor);
    root.setProperty("--cardbg", state.cardBg);
    build();
  }

  btn.addEventListener("click", () => {
    grid = !grid;
    btn.textContent = grid ? "释放" : "吸附到网格";
    layout();
  });

  addEventListener("mousemove", e => {
    const mx = e.clientX / innerWidth * 2 - 1;
    const my = e.clientY / innerHeight * 2 - 1;
    cells.forEach(c => {
      const k = grid ? 0.25 : 1;
      c.inner.style.transform = "translate(" + mx * state.parallax * c.depth * k + "px," + my * state.parallax * c.depth * k + "px)";
    });
    bg.style.transform = "translate(" + -mx * state.bgShift + "px," + -my * state.bgShift + "px)" + (grid ? " scale(.94)" : "");
    bg.style.filter = grid ? "saturate(.75) brightness(.97)" : "none";
  });

  apply();

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply();
  });
</script>
</body>
</html>
