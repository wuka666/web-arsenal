<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{ --ease: cubic-bezier(.44,0,.56,1); }
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:220vh;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .hint{position:fixed;left:12px;bottom:10px;font-size:12px;color:#888;z-index:9}
  .replay{position:fixed;right:12px;top:12px;z-index:9;padding:6px 12px;border:0;border-radius:8px;background:#111;color:#fff;font-size:13px;cursor:pointer}
  .head{width:min(820px,90vw);text-align:var(--align);}
  /* 每行用 overflow:hidden 做遮罩，内层上移 shift 后归零揭示 */
  .line{overflow:hidden;}
  .line span{display:block;font-weight:800;font-size:var(--size);line-height:var(--lh);color:var(--fg);
    transform:translateY(var(--shift));opacity:0;
    transition:transform var(--dur) var(--ease2),opacity var(--dur) var(--ease2);}
  .line.in span{transform:translateY(0);opacity:1;}
  .line.bf span{filter:blur(10px);} .line.in.bf span{filter:blur(0);}
</style></head>
<body>
  <button class="replay" id="rp">重播</button>
  <div class="head" id="head">
    <div class="line"><span>设计正在被重写</span></div>
    <div class="line"><span>AI 成为真正的协作者</span></div>
    <div class="line"><span>工具消融于流程之中</span></div>
  </div>
  <div class="hint">向下滚动 / 调右侧参数看变化</div>
  <script>
  const state = {
    shift: 40, lineDelay: 0.08, dur: 0.7, size: 44, fg: "#111111",
    bg: "#ffffff", lh: 1.3, align: "左", blur: false, ease: "平滑"
  };
  const root = document.documentElement;
  const head = document.getElementById("head");
  const lines = [...head.querySelectorAll(".line")];
  const EASE = { "平滑":"var(--ease)", "回弹":"cubic-bezier(.34,1.56,.64,1)", "匀速":"linear" };
  function apply(){
    root.style.setProperty("--shift", state.shift + "px");
    root.style.setProperty("--dur", state.dur + "s");
    root.style.setProperty("--size", state.size + "px");
    root.style.setProperty("--fg", state.fg);
    root.style.setProperty("--bg", state.bg);
    root.style.setProperty("--lh", state.lh);
    root.style.setProperty("--align", state.align === "左" ? "left" : state.align === "右" ? "right" : "center");
    root.style.setProperty("--ease2", EASE[state.ease] || "var(--ease)");
    lines.forEach(l=>l.classList.toggle("bf", state.blur));
  }
  let io;
  function reset(){ // 重播：清状态并重新用 IntersectionObserver 逐行观察
    lines.forEach(l=>l.classList.remove("in"));
    if(io) io.disconnect();
    io = new IntersectionObserver((es)=>{
      es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("in"); });
    }, { threshold: 0.4 });
    lines.forEach((l,i)=>{ l.style.transitionDelay = (i * state.lineDelay) + "s"; io.observe(l); });
  }
  document.getElementById("rp").onclick = reset;
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "param") return;
    state[d.key] = d.value;
    apply(); reset();
  });
  apply(); reset();
  </script>
</body></html>
