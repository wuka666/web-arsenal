<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字局部过渡演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: var(--di); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card { width: min(380px, 92vw); background: #fff; border: 1px solid color-mix(in srgb, var(--accent) 14%, transparent); border-radius: var(--radius); color: var(--text); padding: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.06); }
  .desc { font-size: 12.5px; color: #888; margin-bottom: 14px; }
  .row { display: flex; align-items: baseline; gap: 12px; }
  .num { font-size: 40px; font-weight: 800; color: var(--num); font-variant-numeric: tabular-nums; line-height: 1; }
  .num.roll { animation: roll var(--dur) cubic-bezier(.22,1,.36,1); }
  @keyframes roll { 0% { transform: translateY(40%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  .unit { font-size: 14px; color: #666; }
  .tabs { display: flex; gap: 8px; margin-top: 18px; }
  .mtab { flex: 1; padding: 9px 0; border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent); background: transparent; color: #555; border-radius: 10px; font-size: 13px; cursor: pointer; transition: all .2s; }
  .mtab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="desc" id="desc">本月访问概览</div>
  <div class="row">
    <div class="num" id="num">1280</div>
    <div class="unit">次访问</div>
  </div>
  <div class="tabs" id="tabs">
    <button class="mtab">1月</button><button class="mtab on">2月</button><button class="mtab">3月</button><button class="mtab">4月</button>
  </div>
  
</div>

<script>
  const state = { dur: 0.6, radius: 16, accent: "#5E6AD2", di: "#fafafa", text: "#1a1a1a", num: "#5E6AD2" };
  const numEl = document.getElementById("num");
  const tabs = Array.from(document.querySelectorAll(".mtab"));
  const DATA = [980, 1280, 1540, 1110];
  function apply() {
    document.documentElement.style.setProperty("--accent", state.accent);
    document.documentElement.style.setProperty("--di", state.di);
    document.documentElement.style.setProperty("--text", state.text);
    document.documentElement.style.setProperty("--num", state.num);
    document.documentElement.style.setProperty("--radius", state.radius + "px");
    document.documentElement.style.setProperty("--dur", state.dur + "s");
  }
  function setMonth(i) {
    tabs.forEach((t, j) => t.classList.toggle("on", j === i));
    numEl.textContent = DATA[i];
    numEl.classList.remove("roll"); void numEl.offsetWidth; numEl.classList.add("roll");
  }
  tabs.forEach((t, i) => t.addEventListener("click", () => setMonth(i)));
  window.addEventListener("message", e => { const d = e.data; if (!d || d.type !== "param") return; state[d.key] = d.value; apply(); });
  apply();
</script>
</body>
</html>
