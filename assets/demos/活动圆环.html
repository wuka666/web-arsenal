<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动圆环</title>
<style>
:root{--c1:#ff375f;--c2:#a8ff00;--c3:#00e0ff;--bg:#0f172a;--p1:72;--p2:54;--p3:88;--lw:12;--sz:200;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#e5e7eb;min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{width:min(86vw,var(--sz));aspect-ratio:1}
svg{width:100%;height:100%;transform:rotate(-90deg)}
circle{fill:none;stroke-width:var(--lw);stroke-linecap:round}
.track{stroke:rgba(255,255,255,.1)}
</style></head><body>
<div class="wrap"><svg viewBox="0 0 120 120">
 <circle class="track" cx="60" cy="60" r="50"/><circle id="r1" cx="60" cy="60" r="50" stroke="var(--c1)"/>
 <circle class="track" cx="60" cy="60" r="36"/><circle id="r2" cx="60" cy="60" r="36" stroke="var(--c2)"/>
 <circle class="track" cx="60" cy="60" r="22"/><circle id="r3" cx="60" cy="60" r="22" stroke="var(--c3)"/>
</svg></div>
<script>
const C=2*Math.PI;
const state={c1:"#ff375f",c2:"#a8ff00",c3:"#00e0ff",bg:"#0f172a",p1:72,p2:54,p3:88,lw:12,sz:200};
const r=document.documentElement.style;
function ring(el,p,rad){const c=C*rad;el.setAttribute('stroke-dasharray',c+' '+(c*2));el.setAttribute('stroke-dashoffset',(c*(1-p/100)).toFixed(2));}
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--lw',state.lw+'px');r.setProperty('--sz',state.sz+'px');ring(document.getElementById('r1'),state.p1,50);ring(document.getElementById('r2'),state.p2,36);ring(document.getElementById('r3'),state.p3,22);}
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
