<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>光标探照揭示 · 单文件 demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; }
  .stage { position: relative; width: 100%; height: 100vh; overflow: hidden; background: #000; }
  .layer { position: absolute; inset: 0; background-size: cover; background-position: center; background-repeat: no-repeat; }
  .base  { z-index: 10; }
  .tint  { position: absolute; inset: 0; z-index: 20; pointer-events: none; mix-blend-mode: multiply; }
  .reveal{ z-index: 30; pointer-events: none; }
  .revealTint { position: absolute; inset: 0; z-index: 35; pointer-events: none; mix-blend-mode: soft-light; }
  .head  { position: absolute; top: 14%; left: 0; right: 0; z-index: 50; text-align: center; padding: 0 20px; pointer-events: none; }
  .head h1 { color: #fff; line-height: 0.95; }
  .head .l1 { display: block; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 400; font-size: clamp(40px, 8vw, 96px); }
  .head .l2 { display: block; font-weight: 400; font-size: clamp(40px, 8vw, 96px); margin-top: -4px; }
  .blurb { position: absolute; left: 5%; right: 5%; bottom: 8%; z-index: 50; max-width: 300px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
  .blurb p { color: rgba(255,255,255,0.82); line-height: 1.6; font-size: 14px; }
  .blurb button { border: 0; color: #fff; font-size: 14px; font-weight: 600; padding: 12px 28px; border-radius: 9999px; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
  .blurb button:hover { transform: scale(1.03); }
  .blurb button:active { transform: scale(0.95); }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="layer base" id="base"></div>
    <div class="tint" id="baseTint"></div>
    <canvas id="cmask" style="display:none"></canvas>
    <div class="layer reveal" id="reveal"></div>
    <div class="revealTint" id="revealTint"></div>
    <div class="head">
      <h1>
        <span class="l1" id="t1">Layers hold</span>
        <span class="l2" id="t2">tales of time</span>
      </h1>
    </div>
    <div class="blurb">
      <p id="desc">移动光标，柔和光晕会揭示藏在底图之下的第二张画面 —— 这是地理叙事站最常用的「探索式首屏」。</p>
      <button id="cta">Start Digging</button>
    </div>
  </div>

<script>

const state = {
  radius: 260,
  ease: 0.1,
  baseImg: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_195923_b0ba8ace-1d1d-4f2c-9a28-1ab84b330680.png&w=1280&q=85',
  revealImg: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_201152_bba90a12-bf12-459f-91f0-51f237dbaf3b.png&w=1280&q=85',
  centerColor: '#ffffff',
  headingColor: '#ffffff',
  accentColor: '#e8702a',
  baseTint: '#1b1206',
  revealTint: '#3a2a12',
  titleText: 'Layers hold',
  subText: 'tales of time',
  btnText: 'Start Digging'
};

const base = document.getElementById('base');
const baseTint = document.getElementById('baseTint');
const reveal = document.getElementById('reveal');
const revealTint = document.getElementById('revealTint');
const canvas = document.getElementById('cmask');
const ctx = canvas.getContext('2d');
const t1 = document.getElementById('t1');
const t2 = document.getElementById('t2');
const desc = document.getElementById('desc');
const cta = document.getElementById('cta');

const mouse = { x: -999, y: -999 };
const smooth = { x: -999, y: -999 };
const cur = { x: -999, y: -999 };
let raf = null;

function hexA(hex, a) {
  const m = hex.replace('#', '');
  const n = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
  const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function apply() {
  // 降级保护：图片URL在前、CSS渐变在后——断网时图片加载失败自动回退到品牌渐变，不黑屏
  const baseFallback = `linear-gradient(135deg, ${state.baseTint} 0%, #2a1a08 55%, #0d0904 100%)`;
  const revealFallback = `linear-gradient(135deg, ${state.revealTint} 0%, #5a4a2a 55%, #2a2010 100%)`;
  base.style.backgroundImage = `url(${state.baseImg}), ${baseFallback}`;
  reveal.style.backgroundImage = `url(${state.revealImg}), ${revealFallback}`;
  baseTint.style.background = state.baseTint;
  revealTint.style.background = state.revealTint;
  t1.textContent = state.titleText;
  t2.textContent = state.subText;
  cta.textContent = state.btnText;
  t1.style.color = state.headingColor;
  t2.style.color = state.headingColor;
  cta.style.background = state.accentColor;
  cta.style.boxShadow = `0 10px 30px ${hexA(state.accentColor, 0.33)}`;
  drawMask();
}

function drawMask() {
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = w; canvas.height = h;
  ctx.clearRect(0, 0, w, h);
  const r = Math.max(1, state.radius);
  const g = ctx.createRadialGradient(cur.x, cur.y, 0, cur.x, cur.y, r);
  const cc = hexA(state.centerColor, 1);
  g.addColorStop(0, cc);
  g.addColorStop(0.4, cc);
  g.addColorStop(0.6, hexA(state.centerColor, 0.75));
  g.addColorStop(0.75, hexA(state.centerColor, 0.4));
  g.addColorStop(0.88, hexA(state.centerColor, 0.12));
  g.addColorStop(1, hexA(state.centerColor, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cur.x, cur.y, r, 0, Math.PI * 2);
  ctx.fill();
  const url = canvas.toDataURL();
  reveal.style.maskImage = `url(${url})`;
  reveal.style.webkitMaskImage = `url(${url})`;
  reveal.style.maskSize = '100% 100%';
  reveal.style.webkitMaskSize = '100% 100%';
}

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (smooth.x === -999) { smooth.x = e.clientX; smooth.y = e.clientY; }
});
window.addEventListener('resize', drawMask);

function loop() {
  smooth.x += (mouse.x - smooth.x) * state.ease;
  smooth.y += (mouse.y - smooth.y) * state.ease;
  cur.x = smooth.x; cur.y = smooth.y;
  drawMask();
  raf = requestAnimationFrame(loop);
}
raf = requestAnimationFrame(loop);

window.addEventListener('message', ev => {
  const d = ev.data;
  if (d && d.type === 'param' && d.key in state) {
    state[d.key] = d.value;
    apply();
  }
});

apply();
</script>
</body>
</html>
