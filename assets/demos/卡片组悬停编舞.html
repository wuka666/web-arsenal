<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡片组悬停编舞</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:36px 22px;background:var(--bg);font-family:system-ui,"Segoe UI",Arial,sans-serif}
/* 参数值一律「带单位」写进 CSS 变量（apply 里走 UNIT 映射），所以这里直接用 var()——
   再套 calc(var(--x)*1px) 会变成 px² 而整条声明失效（同 A5-F2 的镜像坑） */
:root{--bg:#0d1220;--card:#151d31;--accent:#5b8cff;--glow:65;--rot:9deg;--lift:4px;--gap:18px;--dur:.42s;--stagger:90ms}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);width:min(640px,100%)}
/* 窄屏两列会把标题挤成竖条，堆成单栏 */
@media (max-width:540px){.grid{grid-template-columns:1fr}}
.card{position:relative;overflow:hidden;padding:22px 20px 26px;border-radius:14px;background:var(--card);border:1px solid rgba(255,255,255,.07);
  transition:transform var(--dur) cubic-bezier(.22,.61,.36,1),border-color var(--dur)}
/* 发光只从图标那一侧漫出：比整块变亮有方向感，也不至于糊掉文字 */
.card .halo{position:absolute;left:-20%;right:-20%;top:-40%;height:150%;pointer-events:none;
  background:radial-gradient(58% 76% at 26% 12%,var(--accent),transparent 70%);
  opacity:0;transition:opacity var(--dur)}
.card .ico{position:relative;width:36px;height:36px;color:var(--accent);
  transition:transform var(--dur) cubic-bezier(.34,1.4,.64,1)}
.card h3{position:relative;margin-top:13px;font-size:15px;font-weight:600;color:#fff;
  transition:transform var(--dur) cubic-bezier(.22,.61,.36,1) var(--stagger)}
.card p{position:relative;margin-top:7px;font-size:12.5px;line-height:1.62;color:rgba(255,255,255,.55)}
/* 下划线收尾：它是「这张被选中了」的结论，排在其他动作之后 */
.card .line{position:absolute;left:20px;bottom:15px;width:32px;height:2px;border-radius:2px;background:var(--accent);
  transform:scaleX(0);transform-origin:0 50%;
  transition:transform calc(var(--dur)*1.4) cubic-bezier(.22,.61,.36,1) calc(var(--stagger)*2)}
.card:hover,.card.on{transform:translateY(calc(var(--lift)*-1));border-color:color-mix(in srgb,var(--accent) 46%,transparent)}
.card:hover .halo,.card.on .halo{opacity:calc(var(--glow)/100)}
.card:hover .ico,.card.on .ico{transform:rotate(var(--rot)) scale(1.14)}
.card:hover h3,.card.on h3{transform:translateY(calc(var(--lift)*-1))}
.card:hover .line,.card.on .line{transform:scaleX(1)}
</style>
</head>
<body>
<div class="grid" id="grid">
  <div class="card">
    <span class="halo"></span>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg>
    <h3>实时协作</h3>
    <p>多人同时编辑，光标位置与选区即时同步。</p>
    <i class="line"></i>
  </div>
  <div class="card">
    <span class="halo"></span>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>
    <h3>版本快照</h3>
    <p>每次保存自动留档，可随时回滚到任意节点。</p>
    <i class="line"></i>
  </div>
  <div class="card">
    <span class="halo"></span>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13H11l-1 9 8.5-11H12l1-9z"/></svg>
    <h3>边缘加速</h3>
    <p>静态资源就近分发，首屏加载稳定在毫秒级。</p>
    <i class="line"></i>
  </div>
  <div class="card">
    <span class="halo"></span>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v5c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V7l7-4z"/><path d="M9 12l2 2 4-4"/></svg>
    <h3>权限可控</h3>
    <p>按成员粒度分配读写范围，操作全量留痕。</p>
    <i class="line"></i>
  </div>
</div>
<script>
const state={"bg":"#0d1220","card":"#151d31","accent":"#5b8cff","glow":65,"rot":9,"lift":4,"gap":18,"dur":0.42,"stagger":90};
const UNIT={gap:"px",rot:"deg",lift:"px",dur:"s",stagger:"ms"};
function apply(){const r=document.documentElement.style;for(const k in state){r.setProperty("--"+k,state[k]+(UNIT[k]||""));}}

const grid=document.getElementById("grid");
const cards=[].slice.call(grid.children);
// hover 类效果没人动时就只是张静止图（挂机预览与缩略截图同理），所以没真实指针时轮转点亮一张
let idx=0,userIn=false;
cards.forEach(function(c){c.addEventListener("pointerenter",function(){userIn=true;cards.forEach(function(x){x.classList.remove("on");});});});
setInterval(function(){
  if(userIn)return;
  cards.forEach(function(c,i){c.classList.toggle("on",i===idx%cards.length);});
  idx++;
},2200);

apply();
addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
