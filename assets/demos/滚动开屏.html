<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>滚动开屏</title>
<style>
:root{--bg:#e7e5e4;--body:#57534e;--screen:#0f172a;--accent:#38bdf8;--radius:10px;--w:420px;--maxA:105deg;--h:320px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;height:calc(var(--h) * 1px);display:flex;align-items:flex-end;justify-content:center}
.lid{width:calc(var(--w) * 1px);height:calc(var(--w) * 0.62px);background:var(--screen);border:8px solid var(--body);border-radius:var(--radius) var(--radius) 4px 4px;transform-origin:bottom center;transform:perspective(1200px) rotateX(var(--A,0deg));display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:18px}
.base{width:calc(var(--w) * 1.08px);height:14px;background:var(--body);border-radius:0 0 8px 8px;margin-top:-2px}
.stack{display:flex;flex-direction:column;align-items:center}
.cap{position:absolute;top:10px;left:12px;font-size:12px;opacity:.6}
</style>
</head>
<body>
<div style="position:relative"><div class="cap" id="cap">滚动页面 → 屏幕打开</div><div class="wrap"><div class="stack"><div class="lid" id="lid">产品截图</div><div class="base"></div></div></div></div>
<script>
var state={bg:"#e7e5e4",body:"#57534e",screen:"#0f172a",accent:"#38bdf8",radius:10,w:420,maxA:105,h:320};
var r=document.documentElement.style;
function apply(){r.setProperty('--bg',state.bg);r.setProperty('--body',state.body);r.setProperty('--screen',state.screen);r.setProperty('--accent',state.accent);r.setProperty('--radius',state.radius+'px');r.setProperty('--w',state.w+'px');r.setProperty('--maxA',state.maxA+'deg');r.setProperty('--h',state.h+'px');}
apply();
var lid=document.getElementById("lid"),cap=document.getElementById("cap");
function upd(p){var a=(1-p)*parseFloat(state.maxA);lid.style.setProperty("--A",(-a)+"deg");cap.textContent="开合 "+(p*100).toFixed(0)+"% （角度 "+a.toFixed(0)+"°）";}
var p=0;
window.__setP=function(v){p=Math.max(0,Math.min(1,v));upd(p);};
var t=0;
setInterval(function(){t+=0.012;var v=(Math.sin(t*Math.PI*2-Math.PI/2)+1)/2;window.__setP(v);},40);
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="param")return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
