<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>十字准星光标</title>
<style>
:root{--c:#ff6b6b;--bg:#070a12;--op:0.7;--thick:2;--gap:26;--size:26}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg,#0a0e16);font-family:system-ui,"Segoe UI",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const state={"c":"#ff6b6b","bg":"#070a12","op":0.7,"thick":2,"gap":26,"size":26};
let mx=innerWidth/2,my=innerHeight/2,wheel=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{wheel+=e.deltaY;},{passive:true});
function apply(){
  const r=document.documentElement.style;
  for(const k in state){ r.setProperty('--'+k, state[k]); }

}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
function loop(){ctx.clearRect(0,0,W,H);ctx.globalAlpha=state.op;ctx.strokeStyle=state.c;ctx.lineWidth=state.thick;
 ctx.beginPath();ctx.moveTo(0,my);ctx.lineTo(mx-state.gap,my);ctx.moveTo(mx+state.gap,my);ctx.lineTo(W,my);ctx.moveTo(mx,0);ctx.lineTo(mx,my-state.gap);ctx.moveTo(mx,my+state.gap);ctx.lineTo(mx,H);ctx.stroke();
 ctx.beginPath();ctx.arc(mx,my,state.size,0,7);ctx.stroke();requestAnimationFrame(loop);}loop();
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(!(d.key in state))return;state[d.key]=d.value;apply();});
</script>
</body>
</html>
