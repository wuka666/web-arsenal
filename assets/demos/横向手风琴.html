<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>横向手风琴</title>
<style>
:root{--c1:#0ea5e9;--c2:#ffffff;--c3:#0f172a;--bg:#eef0f4;--gap:10px;--rad:16px;--w:340px;--h:200px;--sp:1;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.acc{display:flex;gap:var(--gap);width:min(94vw,var(--w));height:var(--h);transform:scale(var(--sp))}
.pan{flex:1;background:var(--c2);border-radius:var(--rad);overflow:hidden;transition:flex .4s cubic-bezier(.2,.8,.2,1);cursor:pointer;position:relative;display:flex;align-items:flex-end;padding:14px;color:var(--c3);box-shadow:0 6px 20px rgba(20,20,40,.1)}
.pan::before{content:"";position:absolute;inset:0;background:var(--c1);opacity:.14}
.pan .t{position:relative;font-weight:700;writing-mode:vertical-rl;transition:writing-mode .3s}
.pan.on{flex:4}
.pan.on .t{writing-mode:horizontal-tb}
</style></head><body>
<div class="acc" id="acc">
 <div class="pan on"><span class="t">概览</span></div>
 <div class="pan"><span class="t">数据</span></div>
 <div class="pan"><span class="t">设置</span></div>
</div>
<script>
const state={c1:"#0ea5e9",c2:"#ffffff",c3:"#0f172a",bg:"#eef0f4",gap:10,rad:16,w:340,h:200,sp:1};
const r=document.documentElement.style;
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--gap',state.gap+'px');r.setProperty('--rad',state.rad+'px');r.setProperty('--w',state.w+'px');r.setProperty('--h',state.h+'px');r.setProperty('--sp',state.sp);}
apply();
const pans=document.querySelectorAll('.pan');
pans.forEach(p=>p.addEventListener('click',()=>{pans.forEach(x=>x.classList.remove('on'));p.classList.add('on');}));
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
