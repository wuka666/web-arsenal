<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>半圆仪表盘</title>
<style>
:root{--c1:#22d3ee;--c2:#334155;--c3:#e5e7eb;--bg:#0f172a;--val:64;--target:82;--lw:14;--sz:220;}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c3);min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{width:min(86vw,var(--sz))}
svg{width:100%;height:auto;display:block}
.track{fill:none;stroke:var(--c2);stroke-width:var(--lw);stroke-linecap:round}
.arc{fill:none;stroke:var(--c1);stroke-width:var(--lw);stroke-linecap:round}
.needle{stroke:var(--c3);stroke-width:3;stroke-linecap:round}
.tneedle{stroke:#f59e0b;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 4}
.tmark{fill:#f59e0b}
.tlabel{fill:#f59e0b;font-size:11px;font-weight:700}
</style></head><body>
<div class="wrap"><svg viewBox="0 0 200 148">
 <path class="track" d="M10 105 A90 90 0 0 1 190 105"/>
 <path id="arc" class="arc" d="M10 105 A90 90 0 0 1 190 105"/>
 <line id="tneedle" class="tneedle" x1="100" y1="105" x2="100" y2="31"/>
 <circle id="tmark" class="tmark" cx="100" cy="21" r="3.4"/>
 <line id="needle" class="needle" x1="100" y1="105" x2="100" y2="25"/>
 <!-- 当前值放盘下：两根针都从圆心向上扫，数字留在盘内必然被针穿过 -->
 <text id="vt" x="100" y="136" text-anchor="middle" fill="var(--c3)" font-size="24" font-weight="700">64</text>
 <!-- 目标读数放到盘外右下：目标针扫过的扇区在圆心上方（y 65–105），y=126 已出盘，任何角度都不压字 -->
 <text id="tt" class="tlabel" x="152" y="126" text-anchor="middle">目标 82</text>
</svg></div>
<script>
const L=Math.PI*90;
const state={c1:"#22d3ee",c2:"#334155",c3:"#e5e7eb",bg:"#0f172a",val:64,target:82,lw:14,sz:220};
const r=document.documentElement.style;
function apply(){r.setProperty('--c1',state.c1);r.setProperty('--c2',state.c2);r.setProperty('--c3',state.c3);r.setProperty('--bg',state.bg);r.setProperty('--lw',state.lw+'px');r.setProperty('--sz',state.sz+'px');const arc=document.getElementById('arc');arc.setAttribute('stroke-dasharray',L.toFixed(2));arc.setAttribute('stroke-dashoffset',(L*(1-state.val/100)).toFixed(2));const ang=-90+state.val/100*180;document.getElementById('needle').setAttribute('transform','rotate('+ang.toFixed(2)+' 100 105)');const ang2=-90+state.target/100*180;document.getElementById('tneedle').setAttribute('transform','rotate('+ang2.toFixed(2)+' 100 105)');document.getElementById('tmark').setAttribute('transform','rotate('+ang2.toFixed(2)+' 100 105)');document.getElementById('vt').textContent=state.val;document.getElementById('tt').textContent='目标 '+state.target;}
apply();
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='param')return;if(d.key in state){state[d.key]=d.value;apply();}});
</script></body></html>
